<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">體腔地圖：胸、腹、骨盆與會陰</title><desc id="desc">前視概念圖；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">體腔地圖：胸、腹、骨盆與會陰</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">前視概念圖｜回看 07:43–19:10｜非等比例</text><ellipse cx="310" cy="175" rx="58" ry="65" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M250 235L190 270L205 425L225 550L310 605L395 550L415 425L430 270L370 235" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M215 405Q310 350 405 405" fill="none" stroke="#ba817b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M230 500 L390 500" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M245 550 L375 550" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M310 235 L310 605" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="252" y="332" font-size="27" fill="#203e48" text-anchor="start" font-weight="400">胸腔</text><text x="247" y="460" font-size="27" fill="#203e48" text-anchor="start" font-weight="400">腹腔</text><text x="265" y="545" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">骨盆腔</text><text x="280" y="588" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">會陰</text><rect x="520" y="145" width="520" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="535" y="180" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">胸腔：兩側胸膜腔＋中間縱膈</text><text x="535" y="216" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">心包腔位於縱膈內</text><rect x="520" y="270" width="520" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="535" y="305" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">橫膈：胸腔與腹腔的分界</text><text x="535" y="341" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">腹腔與骨盆腔之間沒有同樣的完整隔膜</text><rect x="520" y="395" width="520" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="535" y="430" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">骨盆腔與會陰分層</text><text x="535" y="466" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">骨盆膈以上為盆腔；以下是會陰區</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">讀圖先定基準：解剖姿勢 → 前後／上下 → 胸、腹、盆腔。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">原板書區域框架保留；橫膈與骨盆膈是本站補上的分界提示。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>