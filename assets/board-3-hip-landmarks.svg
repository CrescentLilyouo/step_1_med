<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">四髂棘與兩條常混韌帶的端點</title><desc id="desc">單側髖骨外面觀＋端點展開；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="850" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">四髂棘與兩條常混韌帶的端點</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">單側髖骨外面觀＋端點展開｜回看 86:00–106:30｜非等比例</text><path d="M150 200Q290 110 480 200L420 280L460 330L380 385L345 460L440 480L410 625L225 625L195 535L215 455L175 395L190 325L145 285Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="350" cy="410" rx="52" ry="50" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="320" cy="540" rx="65" ry="52" fill="white" stroke="#7899a6" stroke-width="3"/><path d="M575 170 L475 205" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="575" y="180" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">ASIS 髂前上棘</text><path d="M575 265 L455 330" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="575" y="275" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">AIIS 髂前下棘</text><path d="M35 145 L155 200" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="35" y="155" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">PSIS</text><path d="M35 305 L145 285" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="35" y="315" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">PIIS</text><path d="M480 200L550 625" fill="none" stroke="#158875" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M460 330L525 510L530 575" fill="none" stroke="#ba817b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="550" cy="625" rx="12" ry="12" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><text x="575" y="400" font-size="25" fill="#203e48" text-anchor="start" font-weight="700">腹股溝韌帶：</text><text x="575" y="440" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">ASIS ↔ 恥骨結節</text><text x="575" y="505" font-size="25" fill="#203e48" text-anchor="start" font-weight="700">髂股韌帶（前方）：</text><text x="575" y="550" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">AIIS 附近 ↔ 轉子間線</text><rect x="35" y="710" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="745" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">外面觀前在右；圖上的恥骨端／股骨端已展開，連線只表示端點配對。</text><text x="55" y="779" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">後方轉子間嵴 ≠ 前方轉子間線；髂嵴觸診高度只能當近似地標。</text><text x="35" y="830" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>