<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc"><title id="title">下頜骨與舌骨：突、角、孔各有位置</title><desc id="desc">下頜外側面＋舌骨概念觀；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="840" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">下頜骨與舌骨：突、角、孔各有位置</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">下頜外側面＋舌骨概念觀｜回看 29:30–36:30｜非等比例</text><path d="M170 205L150 195L145 320L130 420Q250 515 405 420L420 310L410 165L375 190L345 260L330 425Q250 452 205 415L205 270Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="170" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">下頜骨側視 · 前在左</text><path d="M460 185 L405 175" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="460" y="195" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">髁突：接 TMJ</text><path d="M460 270 L345 220" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="460" y="280" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">冠突：顳肌附著</text><path d="M460 410 L380 425" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="460" y="420" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">下頜角</text><ellipse cx="225" cy="435" rx="9" ry="9" fill="white" stroke="#7899a6" stroke-width="3"/><path d="M80 565 L225 435" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="80" y="575" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">頦孔：頦神經／血管</text><text x="670" y="165" font-size="26" fill="#203e48" text-anchor="start" font-weight="700">舌骨 · 上面概念觀</text><path d="M740 340Q855 430 965 340L1000 255M740 340L705 255" fill="none" stroke="#7899a6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" /><text x="790" y="423" font-size="26" fill="#203e48" text-anchor="start" font-weight="400">體</text><text x="970" y="300" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">大角</text><ellipse cx="760" cy="347" rx="10" ry="14" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><ellipse cx="946" cy="350" rx="10" ry="14" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><text x="770" y="490" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">小角：體與大角交界</text><text x="680" y="570" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">舌骨不與其他骨直接形成關節</text><rect x="35" y="700" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="735" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">下頜骨的下頜孔在內側、頦孔在外側；本圖只畫外側頦孔。</text><text x="55" y="769" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">髁突／冠突，以及舌骨體／大角／小角，各自放回骨上的位置。</text><text x="35" y="820" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>