<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 830" role="img" aria-labelledby="title desc"><title id="title">同一根肋骨，後端有兩種關節</title><desc id="desc">胸椎側面／肋後端展開；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="830" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">同一根肋骨，後端有兩種關節</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">胸椎側面／肋後端展開｜回看 03:40–09:00｜非等比例</text><rect x="140" y="170" width="210" height="130" rx="12" fill="#dcebf0" stroke="#b7cbd0" stroke-width="2"/><rect x="140" y="310" width="210" height="28" rx="12" fill="#f3d4d1" stroke="#b7cbd0" stroke-width="2"/><rect x="140" y="348" width="210" height="130" rx="12" fill="#dcebf0" stroke="#b7cbd0" stroke-width="2"/><text x="205" y="245" font-size="30" fill="#203e48" text-anchor="start" font-weight="400">T5</text><text x="205" y="425" font-size="30" fill="#203e48" text-anchor="start" font-weight="400">T6</text><path d="M350 324L510 385Q750 330 855 440Q890 565 650 590" fill="none" stroke="#7899a6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="357" cy="326" rx="15" ry="30" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><ellipse cx="512" cy="384" rx="18" ry="18" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><path d="M350 410L515 385" fill="none" stroke="#ba817b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><text x="465" y="300" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">第 6 肋骨頭</text><path d="M480 308 L357 326" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="550" y="420" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">肋結節</text><text x="735" y="510" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">肋骨體</text><rect x="80" y="540" width="420" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="95" y="575" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">肋骨頭關節</text><text x="95" y="611" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">T5、T6 椎體＋中間椎間盤</text><rect x="555" y="540" width="465" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="570" y="575" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">肋橫突關節</text><text x="570" y="611" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">第 6 肋結節 ↔ T6 橫突</text><rect x="35" y="690" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="725" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">示例第 6 肋：頭接上號與同號椎體；結節接同號橫突。</text><text x="55" y="759" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">1、10、11、12 肋有不同模式；11、12 肋沒有肋橫突關節。</text><text x="35" y="810" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>