<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" role="img" aria-labelledby="title desc"><title id="title">骨盆像斜筒：入口、中骨盆與出口</title><desc id="desc">斜筒模型；非實際骨盆比例；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="860" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">骨盆像斜筒：入口、中骨盆與出口</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">斜筒模型；非實際骨盆比例｜回看 25:06–31:12｜非等比例</text><path d="M180 210L525 310L435 605L90 505Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="350" cy="260" rx="180" ry="65" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="265" cy="445" rx="180" ry="65" fill="#dcefe8" stroke="#7899a6" stroke-width="3"/><ellipse cx="180" cy="570" rx="160" ry="55" fill="#f3d4d1" stroke="#7899a6" stroke-width="3"/><path d="M350 260Q290 395 180 570" fill="none" stroke="#158875" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M580 210 L490 270" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="580" y="220" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">入口平面：骨盆界線</text><path d="M580 390 L405 445" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="580" y="400" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">中骨盆：坐骨棘之間</text><path d="M580 575 L310 575" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="580" y="585" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">出口：坐骨結節等邊界</text><text x="580" y="300" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">前後徑：兩端需先辨認</text><text x="580" y="480" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">坐骨棘間徑：最窄橫徑考點</text><text x="580" y="635" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">坐骨結節間徑：出口橫徑</text><rect x="35" y="720" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="755" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">沿用板書斜筒／產道構想；三個平面分開，箭頭示骨盆軸的大致彎曲。</text><text x="55" y="789" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">解剖、產科、對角 conjugate 的恥骨端不同；影片約數不能當成三者同一值。</text><text x="35" y="840" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>