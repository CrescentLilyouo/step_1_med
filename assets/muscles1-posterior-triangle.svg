<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1060" role="img" aria-labelledby="title desc"><title id="title">頸後三角：枕區與鎖骨上區</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="1060" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">頸後三角：枕區與鎖骨上區</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 107:30–112:30｜非等比例</text><text x="40" y="150" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">側頸分區拓撲：SCM 後緣、斜方肌前緣與鎖骨</text><path d="M300 215 L180 800 L950 800Z" fill="#e7f1ff" stroke="#6b8da1" stroke-width="6"/><path d="M300 215 L180 800" stroke="#c19a5b" stroke-width="12" fill="none"/><path d="M300 215 L950 800" stroke="#9698bc" stroke-width="12" fill="none"/><path d="M210 650 L840 800" stroke="#c87276" stroke-width="10" fill="none"/><text x="560" y="495" font-size="31" fill="#203e48" text-anchor="middle" font-weight="700">枕三角</text><text x="430" y="765" font-size="23" fill="#203e48" text-anchor="middle" font-weight="400">鎖骨上／肩胛鎖骨三角</text><text x="35" y="480" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">SCM 後緣</text><text x="785" y="465" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">斜方肌前緣</text><text x="550" y="845" font-size="24" fill="#203e48" text-anchor="middle" font-weight="400">鎖骨中 1/3 附近</text><text x="360" y="646" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">肩胛舌骨肌下腹</text><rect x="40" y="905" width="1020" height="105" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="942" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">上腹分頸前；下腹分頸後：同一肌肉，兩個區域</text><text x="550.0" y="975" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">肩胛舌骨肌下腹不是鎖骨到舌骨直連線；圖僅示分區邊界</text></g></svg>