<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 865" role="img" aria-labelledby="title desc"><title id="title">踝足動作：背屈蹠屈與內外翻分開</title><desc id="desc">側視踝動作＋足底方向概念；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="865" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">踝足動作：背屈蹠屈與內外翻分開</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">側視踝動作＋足底方向概念｜回看 1:38:06–1:47:18｜非等比例</text><text x="55" y="150" font-size="27" fill="#203e48" text-anchor="start" font-weight="700">踝關節：背屈／蹠屈</text><path d="M260 180V420L450 470L560 495" fill="none" stroke="#7899a6" stroke-width="33" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="275" cy="430" rx="33" ry="33" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><path d="M440 360Q540 450 440 590" fill="none" stroke="#158875" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="390" y="315" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">背屈：足背接近小腿</text><text x="380" y="640" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">蹠屈：足尖向下</text><text x="650" y="150" font-size="27" fill="#203e48" text-anchor="start" font-weight="700">內翻／外翻：足底朝向</text><ellipse cx="790" cy="400" rx="68" ry="150" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M790 235 L790 560" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M695 335Q650 400 695 465" fill="none" stroke="#158875" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M895 335Q940 400 895 465" fill="none" stroke="#158875" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="650" y="610" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">朝內：內翻</text><text x="880" y="610" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">朝外：外翻</text><text x="680" y="655" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">距下／橫跗等關節參與</text><rect x="35" y="725" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="760" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">踝背屈通常較穩：距骨滑車前部較寬；不把內外翻全歸到踝穴內。</text><text x="55" y="794" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">旋後＝內翻＋內收＋蹠屈；旋前＝外翻＋外展＋背屈，是三平面的組合。</text><text x="35" y="845" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>