<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">肩胛骨：三角輪廓、三窩與外上方標記</title><desc id="desc">後面概念觀；外側在右；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="850" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">肩胛骨：三角輪廓、三窩與外上方標記</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">後面概念觀；外側在右｜回看 17:00–24:00、30:00–33:30｜非等比例</text><path d="M175 230L510 185L390 600Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M170 305L430 260L535 170" fill="none" stroke="#7899a6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" /><path d="M495 230Q550 250 530 310" fill="none" stroke="#7899a6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="520" cy="330" rx="25" ry="47" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><text x="270" y="240" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">棘上窩</text><text x="275" y="405" font-size="27" fill="#203e48" text-anchor="start" font-weight="400">棘下窩</text><text x="110" y="660" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">後面觀：棘延續至肩峰</text><path d="M570 165 L520 185" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="570" y="175" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">肩峰</text><path d="M570 265 L525 275" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="570" y="275" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">喙突（偏前）</text><path d="M570 340 L520 330" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="570" y="350" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">關節盂（外側）</text><path d="M65 420 L200 390" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="65" y="430" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">內側緣</text><rect x="670" y="420" width="370" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="685" y="455" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">前面：肩胛下窩</text><text x="685" y="491" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">與後面的棘上／棘下窩分開</text><rect x="670" y="540" width="370" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="685" y="575" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">肩胛上切跡</text><text x="685" y="611" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">神經通常下，血管通常上</text><rect x="35" y="710" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="745" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">板書三角骨輪廓保留；喙突與肩峰同在外上區，但前後位置不同。</text><text x="55" y="779" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">肩胛棘、三個窩與肌肉附著配讀；上神經下韌帶口訣需保留血管變異。</text><text x="35" y="830" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>