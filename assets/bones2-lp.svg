<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title"><title id="title">腰椎穿刺正中入路的層次與椎管位置</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#607e90"/></marker></defs><style>text{font-family:'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#173449;font-size:22px}.small{font-size:18px;fill:#4d687b}.title{font-size:30px;font-weight:700}.bold{font-weight:700}.link{fill:none;stroke:#607e90;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#b3cad6;stroke-width:2}</style><rect width="1000" height="700" fill="#f3f8fb"/><text x="40" y="48" class="title">腰部正中穿刺：層次與位置</text><text x="40" y="83" class="small">解剖學比較圖；非操作指引，非實際比例</text><rect x="40" y="115" width="400" height="540" rx="18" class="box"/><text x="65" y="153" class="bold">A · 由前往後的空間關係</text><rect x="70" y="191" width="340" height="48" rx="8" fill="#e8c48d"/><text x="86" y="222" class="">椎體／椎間盤</text><path d="M240 240V260" class="link"/><rect x="70" y="263" width="340" height="48" rx="8" fill="#cae1da"/><text x="86" y="294" class="">後縱韌帶</text><path d="M240 312V332" class="link"/><rect x="70" y="335" width="340" height="48" rx="8" fill="#daebf4"/><text x="86" y="366" class="">椎管內容</text><path d="M240 384V404" class="link"/><rect x="70" y="407" width="340" height="48" rx="8" fill="#cae1da"/><text x="86" y="438" class="">椎板與黃韌帶</text><path d="M240 456V476" class="link"/><rect x="70" y="479" width="340" height="48" rx="8" fill="#d7dde2"/><text x="86" y="510" class="">棘突、棘間／棘上韌帶</text><path d="M240 528V548" class="link"/><rect x="70" y="551" width="340" height="48" rx="8" fill="#f3dfd4"/><text x="86" y="582" class="">後方皮下與皮膚</text><rect x="475" y="115" width="485" height="540" rx="18" class="box"/><text x="500" y="153" class="bold">B · 從後方進入的正中層次</text><rect x="505" y="193" width="425" height="50" rx="9" fill="#edf3f7"/><text x="520" y="226" class="">皮膚 → 皮下組織</text><path d="M720 244V269" class="link"/><rect x="505" y="271" width="425" height="50" rx="9" fill="#edf3f7"/><text x="520" y="304" class="">棘上 → 棘間 → 黃韌帶</text><path d="M720 322V347" class="link"/><rect x="505" y="349" width="425" height="50" rx="9" fill="#edf3f7"/><text x="520" y="382" class="">硬膜外腔</text><path d="M720 400V425" class="link"/><rect x="505" y="427" width="425" height="50" rx="9" fill="#edf3f7"/><text x="520" y="460" class="">硬脊膜 → 蛛網膜</text><path d="M720 478V503" class="link"/><rect x="505" y="505" width="425" height="50" rx="9" fill="#d8eee7"/><text x="520" y="538" class="">蛛網膜下腔（腰池）</text><text x="508" y="615" class="small">腰池：腦脊髓液＋馬尾神經根</text></svg>