<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">肋溝與胸壁：VAN 和三層肋間肌</title><desc id="desc">胸壁剖面＋層次展開；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">肋溝與胸壁：VAN 和三層肋間肌</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">胸壁剖面＋層次展開｜回看 09:00–14:30｜非等比例</text><ellipse cx="520" cy="205" rx="260" ry="55" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M315 205Q450 300 675 215" fill="none" stroke="#7899a6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="635" cy="257" rx="16" ry="14" fill="#90aeca" stroke="#7899a6" stroke-width="3"/><ellipse cx="635" cy="297" rx="15" ry="14" fill="#c87976" stroke="#7899a6" stroke-width="3"/><ellipse cx="635" cy="337" rx="13" ry="11" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><rect x="300" y="375" width="105" height="155" rx="12" fill="#f3d4d1" stroke="#b7cbd0" stroke-width="2"/><rect x="420" y="375" width="105" height="155" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><rect x="540" y="375" width="105" height="155" rx="12" fill="#dcebf0" stroke="#b7cbd0" stroke-width="2"/><text x="210" y="580" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">外肋間肌</text><text x="415" y="580" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">內肋間肌</text><text x="610" y="580" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">最內肋間肌</text><path d="M750 255 L650 257" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="750" y="265" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">V 靜脈（上）</text><path d="M750 300 L650 297" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="750" y="310" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">A 動脈</text><path d="M750 345 L650 337" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="750" y="355" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">N 神經（下）</text><text x="60" y="155" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">上方肋骨</text><text x="70" y="350" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">胸壁三層展開</text><text x="725" y="470" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">主要神經血管束</text><text x="725" y="510" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">在內與最內肋間肌之間</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">橫斷／分層示意：肋溝在肋骨下緣內面，主要束由上到下 VAN。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">下方肋骨上緣仍可有側支；避主要束的解剖理由不等於保證完全無血管。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>