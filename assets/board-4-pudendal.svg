<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 870" role="img" aria-labelledby="title desc"><title id="title">坐骨孔與梨狀肌：陰部神經繞行</title><desc id="desc">後外側通路展開；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="870" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">坐骨孔與梨狀肌：陰部神經繞行</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">後外側通路展開｜回看 00:00–04:12｜非等比例</text><path d="M130 150L230 150L270 440L200 575L155 380Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M590 160Q770 100 850 240L775 305Q650 320 630 390L690 420Q635 455 650 500L730 575L670 620L550 540L550 440L570 320Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M240 380 L690 420" fill="none" stroke="#ba817b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M250 410 L670 605" fill="none" stroke="#7899a6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><path d="M250 315L600 335L615 385L265 375Z" fill="#f3d4d1" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M390 250L420 375Q475 425 650 445Q700 460 645 490L465 535" fill="none" stroke="#158875" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="285" y="205" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">骨盆內 S2–S4</text><path d="M705 345 L570 350" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="705" y="355" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">梨狀肌</text><path d="M745 425 L690 420" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="745" y="435" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">坐骨棘／薦棘韌帶</text><text x="60" y="680" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">綠：陰部神經的出骨盆 → 繞棘 → 入會陰路線</text><text x="285" y="450" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">大坐骨孔下區</text><text x="350" y="580" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">小坐骨孔 → 陰部管</text><rect x="35" y="730" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="765" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">梨狀肌穿大坐骨孔；陰部神經及內陰部血管由其下方出，再經小孔入會陰。</text><text x="55" y="799" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">這是立體關係的展開，箭頭跨平面；不表示神經穿越薦棘韌帶本身。</text><text x="35" y="850" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>