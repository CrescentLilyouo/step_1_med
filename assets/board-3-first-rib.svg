<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">第一肋：前靜脈、後動脈，中間斜角肌結節</title><desc id="desc">上面觀；前後以標籤定向；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">第一肋：前靜脈、後動脈，中間斜角肌結節</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">上面觀；前後以標籤定向｜回看 14:30–17:00｜非等比例</text><path d="M150 220Q260 115 485 170Q600 205 630 365Q575 445 450 470Q320 450 200 365Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M210 250Q385 165 510 250" fill="none" stroke="#8da6af" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M225 345Q370 230 545 335" fill="none" stroke="#8da6af" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="390" cy="275" rx="22" ry="22" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><text x="280" y="560" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">第一肋上面觀</text><path d="M65 170 L210 250" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="65" y="180" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">前方</text><path d="M665 480 L520 365" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="665" y="490" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">後方</text><path d="M680 210 L385 230" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="680" y="220" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">鎖骨下靜脈溝</text><path d="M680 300 L390 275" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="680" y="310" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">斜角肌結節</text><path d="M680 380 L430 315" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="680" y="390" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">鎖骨下動脈溝</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">前斜角肌附著結節，分開前方靜脈與後方動脈／臂叢的通路。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">第一肋的上面兩條血管溝，不是典型肋下緣的 VAN 排列。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>