<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title"><title id="title">肩胛上切跡與喙鎖韌帶</title><rect width="1100" height="660" rx="20" fill="#f6fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="49" font-size="30" fill="#18364a" font-weight="700">肩胛上切跡與喙鎖韌帶</text><rect x="30" y="80" width="520" height="510" rx="12" fill="#fff"/><rect x="570" y="80" width="500" height="510" rx="12" fill="#fff"/><text x="50" y="122" font-size="25" fill="#18364a" font-weight="700">A｜肩胛上切跡</text><path d="M80 285 L180 285 Q290 480 390 285 L495 285" fill="none" stroke="#dfc68d" stroke-width="28"/><path d="M180 285 L390 285" fill="none" stroke="#567b70" stroke-width="16"/><circle cx="300" cy="225" r="20" fill="#c85e61"/><circle cx="275" cy="350" r="20" fill="#c69935"/><path d="M320 225 L485 180" fill="none" stroke="#5e788b" stroke-width="3"/><text x="63" y="180" font-size="21" fill="#b8464a" font-weight="400">肩胛上動脈：通常在韌帶上</text><text x="65" y="510" font-size="22" fill="#987114" font-weight="400">肩胛上神經：韌帶下方</text><path d="M275 373 L200 477" fill="none" stroke="#5e788b" stroke-width="3"/><text x="63" y="553" font-size="20" fill="#18364a" font-weight="400">基準是肩胛上橫韌帶，血管有變異</text><text x="590" y="122" font-size="25" fill="#18364a" font-weight="700">B｜喙鎖韌帶兩部分</text><rect x="605" y="175" width="425" height="43" rx="12" fill="#dfc68d"/><text x="740" y="160" font-size="22" fill="#18364a" font-weight="400">鎖骨下表面</text><path d="M654 218 L735 218 L705 393 Z" fill="#c8e6e0" stroke="#0e796c" stroke-width="3"/><path d="M820 218 L962 218 L885 393 L763 393 Z" fill="#d5e5f3" stroke="#427a9e" stroke-width="3"/><rect x="650" y="399" width="270" height="35" rx="12" fill="#dfc68d"/><text x="722" y="468" font-size="22" fill="#18364a" font-weight="400">肩胛骨喙突</text><text x="596" y="510" font-size="21" fill="#0e796c" font-weight="400">內後：圓錐 conoid → 圓錐結節</text><text x="596" y="550" font-size="21" fill="#427a9e" font-weight="400">外前：斜方 trapezoid → 斜方線</text><text x="35" y="633" font-size="19" fill="#617789" font-weight="400">原創概念圖｜非等比例；配合正文方向、層次及變異說明使用</text></g></svg>