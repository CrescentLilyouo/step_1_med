<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 910" role="img" aria-labelledby="title desc"><title id="title">四舌外肌：動作與 X／XII</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="910" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">四舌外肌：動作與 X／XII</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 58:00–61:45｜非等比例</text><text x="550" y="150" font-size="25" fill="#203e48" text-anchor="middle" font-weight="400">課堂側面方向摘要：前方在右，後方在左</text><path d="M380 440 Q620 380 760 440 Q700 525 380 490Z" fill="#efbfbc" stroke="#b76d6e" stroke-width="4"/><path d="M530 440 L530 230" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M530 440 L300 240" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M530 460 L300 640" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M650 460 L865 640" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="460" y="195" font-size="27" fill="#203e48" text-anchor="start" font-weight="400">顎舌肌：X</text><text x="60" y="200" font-size="27" fill="#203e48" text-anchor="start" font-weight="400">莖突舌肌：XII</text><text x="60" y="700" font-size="27" fill="#203e48" text-anchor="start" font-weight="400">舌骨舌肌：XII</text><text x="740" y="700" font-size="27" fill="#203e48" text-anchor="start" font-weight="400">頦舌肌：XII</text><rect x="40" y="760" width="1020" height="100" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="797" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">頦舌肌：伸舌重要；單側收縮使舌向對側</text><text x="550.0" y="830" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">單側周邊 XII 受損，伸舌偏向患側；不同肌束的完整作用另見表</text></g></svg>