<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 940" role="img" aria-labelledby="title desc"><title id="title">肱骨三個高度：腋、橈、尺神經</title><desc id="desc">高度索引；後方走行已展開；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="940" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">肱骨三個高度：腋、橈、尺神經</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">高度索引；後方走行已展開｜回看 46:00–57:30｜非等比例</text><ellipse cx="300" cy="185" rx="70" ry="70" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M360 180L415 240L380 325L365 520L435 615L360 650L260 615L290 500L270 305Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M230 285Q300 330 400 300" fill="none" stroke="#ba817b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M285 420L380 465" fill="none" stroke="#ba817b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M265 615Q225 655 225 695" fill="none" stroke="#ba817b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M530 275 L400 300" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="530" y="285" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">外科頸：腋神經＋後旋肱動脈</text><path d="M530 425 L355 455" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="530" y="435" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">骨幹後面：橈神經＋肱深動脈</text><path d="M530 605 L260 625" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="530" y="615" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">內上髁後方：尺神經</text><text x="60" y="750" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">紅線是貼骨關係索引；不同高度配不同神經。</text><rect x="35" y="800" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="835" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">板書近端、骨幹與遠端的神經配對統一放在同一張分層圖。</text><text x="55" y="869" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">橈神經溝在後面，本圖已展開到可見；不可當成真實前面標本。</text><text x="35" y="920" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>