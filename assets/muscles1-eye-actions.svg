<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 870" role="img" aria-labelledby="title desc"><title id="title">六眼外肌：動作方向與 III、IV、VI</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="870" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">六眼外肌：動作方向與 III、IV、VI</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 10:30–13:30｜非等比例</text><text x="550" y="145" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">患者右眼正面：外側在圖左，內側在圖右</text><ellipse cx="550" cy="390" rx="145" ry="100" fill="#fff" stroke="#7d9daa" stroke-width="4"/><circle cx="550" cy="390" r="57" fill="#c6e6e0" stroke="#298c7d" stroke-width="3"/><circle cx="550" cy="390" r="25" fill="#234851"/><path d="M550 390 L220 390" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M550 390 L880 390" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M550 390 L790 220" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M550 390 L790 560" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M550 390 L310 220" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M550 390 L310 560" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="45" y="375" font-size="25" fill="#203e48" text-anchor="start" font-weight="600">外直肌 LR · VI</text><text x="815" y="375" font-size="25" fill="#203e48" text-anchor="start" font-weight="600">內直肌 MR · III</text><text x="730" y="190" font-size="25" fill="#203e48" text-anchor="start" font-weight="600">上直肌 SR · III</text><text x="730" y="610" font-size="25" fill="#203e48" text-anchor="start" font-weight="600">下直肌 IR · III</text><text x="40" y="190" font-size="25" fill="#203e48" text-anchor="start" font-weight="600">下斜肌 IO · III</text><text x="40" y="610" font-size="25" fill="#203e48" text-anchor="start" font-weight="600">上斜肌 SO · IV</text><rect x="40" y="665" width="1020" height="110" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="702" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">上下直肌另有內收；上下斜肌另有外展</text><text x="550.0" y="735" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">上直／上斜內旋，下直／下斜外旋；以眼球上極判斷扭轉</text><text x="40" y="820" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">這是正視位動作摘要；H 型檢查需先內收／外展，不按斜箭頭直接測。</text></g></svg>