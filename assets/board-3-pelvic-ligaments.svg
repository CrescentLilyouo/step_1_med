<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 875" role="img" aria-labelledby="title desc"><title id="title">坐骨棘、坐骨結節與兩條薦骨韌帶</title><desc id="desc">骨盆後外側關係展開；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="875" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">坐骨棘、坐骨結節與兩條薦骨韌帶</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">骨盆後外側關係展開｜回看 107:00–113:42｜非等比例</text><path d="M170 155L280 155L315 430L245 560L195 380Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M600 160Q790 100 860 240L770 310Q655 320 640 390L700 420Q630 450 650 500L740 575L680 620L575 540L565 440L580 320Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M285 375 L700 420" fill="none" stroke="#ba817b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M290 400 L680 600" fill="none" stroke="#158875" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="700" cy="420" rx="10" ry="10" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><ellipse cx="680" cy="600" rx="10" ry="10" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><text x="105" y="630" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">薦骨（後方）</text><path d="M740 415 L700 420" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="740" y="425" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">坐骨棘</text><path d="M740 605 L680 600" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="740" y="615" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">坐骨結節</text><text x="355" y="310" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">大坐骨切跡 → 大孔</text><text x="725" y="495" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">小切跡</text><text x="50" y="685" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">紅：薦棘韌帶；綠：薦結節韌帶。切跡加上韌帶，形成孔的邊界。</text><rect x="35" y="735" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="770" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">片尾講師修正坐骨棘畫得過高；這張以大、小切跡交界重新放置坐骨棘。</text><text x="55" y="804" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">韌帶連線是拓撲展開；孔的實際深度、梨狀肌與神經另見第四部。</text><text x="35" y="855" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>