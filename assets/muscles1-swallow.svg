<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 910" role="img" aria-labelledby="title desc"><title id="title">吞嚥：提喉、閉氣道與推送需協調</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="910" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">吞嚥：提喉、閉氣道與推送需協調</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 58:00–72:00、80:00–85:00｜非等比例</text><rect x="270" y="155" width="560" height="105" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="192" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">口腔期</text><text x="550.0" y="225" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">舌推食團向後；開始可隨意控制</text><rect x="270" y="315" width="560" height="105" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="352" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">咽期</text><text x="550.0" y="385" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">軟顎抬高、喉向前上、氣道關閉協調</text><rect x="270" y="475" width="560" height="105" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="512" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">咽縮肌推送</text><text x="550.0" y="545" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">上、中、下的協調推進</text><rect x="270" y="635" width="560" height="105" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="672" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">上食道括約肌開啟</text><text x="550.0" y="705" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">鬆弛與舌骨喉前上牽引共同作用</text><path d="M550 260 L550 305" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M550 420 L550 465" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M550 580 L550 625" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="35" y="815" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">會厭不是吞嚥保護的唯一蓋子；聲帶與喉前庭的閉合亦重要。</text><text x="35" y="860" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">課堂漏斗／環狀比喻只用於理解；各肌位置與神經另見比較表。</text></g></svg>