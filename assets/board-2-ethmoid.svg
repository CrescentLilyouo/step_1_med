<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">篩骨：篩板、雞冠、垂直板與鼻甲</title><desc id="desc">冠狀概念圖；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">篩骨：篩板、雞冠、垂直板與鼻甲</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">冠狀概念圖｜回看 00:00–03:00｜非等比例</text><rect x="205" y="215" width="480" height="30" rx="12" fill="#f6e5bd" stroke="#b7cbd0" stroke-width="2"/><path d="M445 145V495" fill="none" stroke="#ba817b" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 245L220 440Q300 460 310 390L270 350Q335 345 325 290L275 270M685 245L670 440Q590 460 580 390L620 350Q555 345 565 290L615 270" fill="none" stroke="#7899a6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="240" cy="230" rx="5" ry="5" fill="#7899a6" stroke="#7899a6" stroke-width="3"/><ellipse cx="285" cy="230" rx="5" ry="5" fill="#7899a6" stroke="#7899a6" stroke-width="3"/><ellipse cx="330" cy="230" rx="5" ry="5" fill="#7899a6" stroke="#7899a6" stroke-width="3"/><ellipse cx="375" cy="230" rx="5" ry="5" fill="#7899a6" stroke="#7899a6" stroke-width="3"/><ellipse cx="420" cy="230" rx="5" ry="5" fill="#7899a6" stroke="#7899a6" stroke-width="3"/><ellipse cx="465" cy="230" rx="5" ry="5" fill="#7899a6" stroke="#7899a6" stroke-width="3"/><ellipse cx="510" cy="230" rx="5" ry="5" fill="#7899a6" stroke="#7899a6" stroke-width="3"/><ellipse cx="555" cy="230" rx="5" ry="5" fill="#7899a6" stroke="#7899a6" stroke-width="3"/><ellipse cx="600" cy="230" rx="5" ry="5" fill="#7899a6" stroke="#7899a6" stroke-width="3"/><ellipse cx="645" cy="230" rx="5" ry="5" fill="#7899a6" stroke="#7899a6" stroke-width="3"/><path d="M745 175 L445 170" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="745" y="185" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">雞冠</text><path d="M745 255 L670 230" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="745" y="265" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">篩板＋篩孔（CN I）</text><path d="M745 340 L445 350" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="745" y="350" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">中隔：篩骨垂直板</text><path d="M745 440 L610 350" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="745" y="450" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">上／中鼻甲：篩骨一部分</text><path d="M260 500Q320 470 315 525M630 500Q570 470 575 525" fill="none" stroke="#ba817b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="577" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">下鼻甲是獨立骨，與篩骨的上／中鼻甲分開。</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">沿用板書的篩骨正面「橫板＋垂直板＋兩側鼻甲」構想。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">本圖只示意篩骨：完整鼻中隔還有犁骨與中隔軟骨。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>