<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 865" role="img" aria-labelledby="title desc"><title id="title">H 型檢查：先水平定位，再測上下</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="865" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">H 型檢查：先水平定位，再測上下</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 29:00–35:00｜非等比例</text><text x="550" y="147" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">患者右眼正面：外側在圖左、內側在圖右</text><rect x="40" y="190" width="480" height="80" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="280.0" y="227" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">先外展（往外看）</text><rect x="40" y="350" width="480" height="90" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="280.0" y="387" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">再上看：上直肌 SR · III</text><rect x="40" y="520" width="480" height="90" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="280.0" y="557" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">再下看：下直肌 IR · III</text><path d="M280 270 L280 337" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M280 440 L280 507" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="580" y="190" width="480" height="80" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="820.0" y="227" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">先內收（往鼻側看）</text><rect x="580" y="350" width="480" height="90" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="820.0" y="387" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">再上看：下斜肌 IO · III</text><rect x="580" y="520" width="480" height="90" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="820.0" y="557" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">再下看：上斜肌 SO · IV</text><path d="M820 270 L820 337" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M820 440 L820 507" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="40" y="695" width="1020" height="120" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="732" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">水平：內收測 MR（III），外展測 LR（VI）</text><text x="550.0" y="765" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">這是先放到測試位置、再看垂直動作；不是每次動作只有單一肌肉收縮</text></g></svg>