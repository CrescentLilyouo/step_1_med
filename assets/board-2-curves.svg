<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">脊柱四曲：胸薦原發，頸腰次發</title><desc id="desc">側視；前在左；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">脊柱四曲：胸薦原發，頸腰次發</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">側視；前在左｜回看 52:30–57:00｜非等比例</text><path d="M310 150Q240 210 310 275Q380 355 305 440Q240 510 320 590L345 630" fill="none" stroke="#7899a6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" /><text x="80" y="157" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">前 ←</text><text x="430" y="157" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">→ 後</text><rect x="600" y="145" width="440" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="615" y="180" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">頸曲 · 前凸</text><text x="615" y="216" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">次發：抬頭相關</text><rect x="600" y="270" width="440" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="615" y="305" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">胸曲 · 後凸</text><text x="615" y="341" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">原發：胎兒曲度保留</text><rect x="600" y="395" width="440" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="615" y="430" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">腰曲 · 前凸</text><text x="615" y="466" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">次發：站立行走相關</text><rect x="600" y="520" width="440" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="615" y="555" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">薦曲 · 後凸</text><text x="615" y="591" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">原發：胎兒曲度保留</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">「前凸／後凸」以身體方向為基準，不能只看紙面上向左或向右。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">本圖側視前在左；正常曲度與病理性過度彎曲分開。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>