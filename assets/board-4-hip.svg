<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 830" role="img" aria-labelledby="title desc"><title id="title">髖關節：月狀面、頭凹與兩條囊內相關韌帶</title><desc id="desc">髖臼側面／股骨近端展開；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="830" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">髖關節：月狀面、頭凹與兩條囊內相關韌帶</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">髖臼側面／股骨近端展開｜回看 04:12–10:24｜非等比例</text><path d="M120 180Q320 130 420 285Q460 450 300 515Q170 550 110 420Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="310" cy="350" rx="100" ry="125" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><ellipse cx="320" cy="350" rx="65" ry="90" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="315" cy="350" rx="65" ry="75" fill="#f3d4d1" stroke="#7899a6" stroke-width="3"/><path d="M365 380L600 465L710 520L660 610L520 500L365 440Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M250 285L310 350" fill="none" stroke="#158875" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M260 445L325 445" fill="none" stroke="#ba817b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M675 200 L395 310" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="675" y="210" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">髖臼唇：增深窩</text><path d="M675 290 L300 320" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="675" y="300" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">股骨頭韌帶：連向頭凹</text><path d="M675 380 L290 445" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="675" y="390" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">髖臼橫韌帶：跨缺口</text><text x="75" y="625" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">髖臼中央窩與周圍月狀面分開；並非整個碗都覆關節軟骨。</text><rect x="35" y="690" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="725" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">片中的髖部韌帶框架：三條囊韌帶＋股骨頭韌帶＋髖臼橫韌帶。</text><text x="55" y="759" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">囊韌帶：髂股（前）、恥股（前下）、坐股（後）；不是圖中三條同面直線。</text><text x="35" y="810" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>