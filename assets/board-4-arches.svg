<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1040" role="img" aria-labelledby="title desc"><title id="title">足弓：骨性拱門、拉索與 Windlass</title><desc id="desc">中文解剖概念圖，非等比例；細節與來源見網頁比較表。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#168674" stroke-width="1.5"/></marker></defs><rect width="1100" height="1040" rx="18" fill="#f8fbfd"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="40" y="57" font-size="33" fill="#193f4e" text-anchor="start" font-weight="700">足弓：骨性拱門、拉索與 Windlass</text><text x="40" y="96" font-size="20" fill="#627580" text-anchor="start" font-weight="400">本站原創示意｜非等比例，請配合解剖教材閱讀</text><text x="40" y="147" font-size="27" fill="#193f4e" text-anchor="start" font-weight="650">內側縱弓：較高，距骨頭為重要拱頂區</text><rect x="40" y="260" width="170" height="82" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="125.0" y="300" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">跟骨</text><rect x="255" y="205" width="170" height="82" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="340.0" y="245" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">距骨</text><rect x="470" y="235" width="170" height="82" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="555.0" y="275" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">舟骨</text><rect x="685" y="265" width="170" height="82" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="770.0" y="305" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">三楔骨</text><rect x="900" y="310" width="160" height="82" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="980.0" y="350" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">1–3 蹠骨</text><path d="M125 410 Q550 220 980 410" fill="none" stroke="#75a69a" stroke-width="7"/><text x="550" y="398" font-size="23" fill="#193f4e" text-anchor="middle" font-weight="400">骨性拱門</text><path d="M125 448 L980 448" stroke="#d18045" stroke-width="10"/><text x="550" y="490" font-size="24" fill="#193f4e" text-anchor="middle" font-weight="400">足底腱膜：前後拉索（tie beam）</text><text x="40" y="555" font-size="25" fill="#193f4e" text-anchor="start" font-weight="650">外側縱弓：較低，跟骨 → 骰骨 → 第 4、5 蹠骨</text><text x="40" y="622" font-size="27" fill="#193f4e" text-anchor="start" font-weight="650">Windlass：蹠趾伸展後，腱膜繞蹠骨頭張緊</text><rect x="40" y="670" width="470" height="110" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="275.0" y="710" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">① 蹠趾伸展</text><text x="275.0" y="746" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">尤其拇趾</text><rect x="590" y="670" width="470" height="110" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="825.0" y="710" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">② 腱膜張緊</text><text x="825.0" y="746" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">繞過蹠骨頭</text><rect x="590" y="825" width="470" height="110" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="825.0" y="865" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">③ 前後趨靠近</text><text x="825.0" y="901" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">足跟與前足距離趨縮短</text><rect x="40" y="825" width="470" height="110" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="275.0" y="865" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">④ 縱弓升高</text><text x="275.0" y="901" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">足部變得較利於推進</text><path d="M510 725 L580 725" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><path d="M825 780 L825 815" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><path d="M590 880 L520 880" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><text x="40" y="990" font-size="20" fill="#193f4e" text-anchor="start" font-weight="400">骨性、韌帶、腱膜與肌肉共同控制；不是固定磚橋。來源：S123、S126、S129。</text></g></svg>