<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 895" role="img" aria-labelledby="title desc"><title id="title">咀嚼肌：用骨端與拉力推運動</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="895" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">咀嚼肌：用骨端與拉力推運動</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 43:00–57:30｜非等比例</text><path d="M390 315 L385 530 L190 585 L95 565 L85 620 L200 640 L465 545 L490 260 Q460 210 425 245 L420 290" stroke="#879a9e" stroke-width="9" fill="none"/><circle cx="467" cy="242" r="27" fill="#ffdfaa"/><text x="70" y="200" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">前方 ←</text><text x="45" y="693" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">下顎骨外形概念；肌肉投影不代表同一深度</text><path d="M360 520 L360 310" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M395 290 L310 150" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M430 530 L520 380" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M466 245 L250 245" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="620" y="155" width="440" height="100" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="840.0" y="192" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">咬肌 masseter</text><text x="840.0" y="225" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">主要上提，閉口</text><rect x="620" y="290" width="440" height="100" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="840.0" y="327" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">顳肌 temporalis</text><text x="840.0" y="360" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">上提；後束協助後縮</text><rect x="620" y="425" width="440" height="100" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="840.0" y="462" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">內翼肌 medial pterygoid</text><text x="840.0" y="495" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">上提、前突與側移</text><rect x="620" y="560" width="440" height="100" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="840.0" y="597" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">外翼肌 lateral pterygoid</text><text x="840.0" y="630" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">前突、側移；參與張口</text><rect x="40" y="740" width="1020" height="105" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="777" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">四大咀嚼肌：V3 運動支；頰肌是 VII，屬表情肌</text><text x="550.0" y="810" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">單側翼肌推下顎往對側；嘴角方向與整個下顎方向要分開</text></g></svg>