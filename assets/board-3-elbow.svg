<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc"><title id="title">肘與前臂：配對、兩端骨頭和旋前旋後</title><desc id="desc">肘前視簡图＋前臂動作概念；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="840" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">肘與前臂：配對、兩端骨頭和旋前旋後</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">肘前視簡图＋前臂動作概念｜回看 50:00–66:00｜非等比例</text><text x="80" y="150" font-size="26" fill="#203e48" text-anchor="start" font-weight="700">肘部：小頭配橈，滑車配尺</text><ellipse cx="230" cy="240" rx="48" ry="45" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><path d="M345 190Q270 240 345 300Q430 250 345 190Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="230" cy="325" rx="38" ry="21" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M195 330L205 530L245 595L265 570L250 330" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M360 300Q320 320 305 285Q285 350 320 375L320 570L350 575L370 350Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="165" y="652" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">橈骨</text><text x="295" y="652" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">尺骨</text><text x="80" y="190" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">外側</text><text x="390" y="190" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">內側</text><text x="620" y="150" font-size="25" fill="#203e48" text-anchor="start" font-weight="700">旋後（掌朝前）</text><path d="M680 230 L680 520" fill="none" stroke="#7899a6" stroke-width="23" stroke-linecap="round" stroke-linejoin="round" /><path d="M815 230 L815 520" fill="none" stroke="#7899a6" stroke-width="23" stroke-linecap="round" stroke-linejoin="round" /><text x="650" y="580" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">橈</text><text x="805" y="580" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">尺</text><text x="870" y="150" font-size="25" fill="#203e48" text-anchor="start" font-weight="700">旋前</text><path d="M940 230 L1050 520" fill="none" stroke="#ba817b" stroke-width="23" stroke-linecap="round" stroke-linejoin="round" /><path d="M1050 230 L940 520" fill="none" stroke="#7899a6" stroke-width="23" stroke-linecap="round" stroke-linejoin="round" /><text x="935" y="580" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">交叉</text><rect x="35" y="700" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="735" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">旋前是橈骨跨過尺骨；不是橈尺兩骨互換名字，也不是腕關節完成此動作。</text><text x="55" y="769" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">近端橈骨頭轉動，遠端橈骨繞尺骨頭；環狀韌帶環抱橈骨頭，兩端接尺骨。</text><text x="35" y="820" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>