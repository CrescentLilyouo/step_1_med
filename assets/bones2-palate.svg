<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title"><title id="title">鼻中隔與硬腭的兩個視角</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#607e90"/></marker></defs><style>text{font-family:'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#173449;font-size:22px}.small{font-size:18px;fill:#4d687b}.title{font-size:30px;font-weight:700}.bold{font-weight:700}.link{fill:none;stroke:#607e90;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#b3cad6;stroke-width:2}</style><rect width="1000" height="700" fill="#f3f8fb"/><text x="40" y="50" class="title">鼻中隔與硬腭：把兩個視角分開</text><text x="40" y="84" class="small">概念示意，非實際骨骼比例</text><rect x="40" y="110" width="920" height="255" rx="18" class="box"/><text x="70" y="147" class="bold">A · 冠狀面：鼻腔在上、口腔在下</text><rect x="220" y="177" width="270" height="94" fill="#dbedf2"/><rect x="510" y="177" width="270" height="94" fill="#dbedf2"/><rect x="490" y="167" width="20" height="104" fill="#e8c48d"/><rect x="200" y="271" width="600" height="17" rx="5" fill="#dba562"/><text x="270" y="222" class="">右鼻腔</text><text x="600" y="222" class="">左鼻腔</text><text x="440" y="328" class="">口腔</text><path d="M500 177L500 150L755 150" fill="none" stroke="#607e90" stroke-width="2"/><text x="760" y="155" class="small">鼻中隔</text><text x="805" y="286" class="small">硬腭</text><rect x="40" y="395" width="920" height="270" rx="18" class="box"/><text x="70" y="430" class="bold">B · 下面觀：上排門牙在前</text><path d="M180 488Q340 435 500 488L500 573H180Z" fill="#d8ebe5" stroke="#7ba796" stroke-width="2"/><path d="M180 573H500L472 630H208Z" fill="#e8c48d" stroke="#b9905a" stroke-width="2"/><path d="M340 469V630M180 573H500" stroke="#779099" stroke-width="2" stroke-dasharray="6 5"/><text x="302" y="462" class="small">前</text><text x="302" y="655" class="small">後</text><text x="545" y="500" class="bold">上頜骨腭突：硬腭前約 3/4</text><text x="545" y="532" class="small">切牙孔／初級腭分界在前方</text><text x="545" y="590" class="bold">腭骨水平板：硬腭後約 1/4</text><text x="545" y="622" class="small">橫腭縫是成人骨性分界</text></svg>