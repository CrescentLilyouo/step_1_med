<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" role="img" aria-labelledby="title desc"><title id="title">薦骨：薦孔、薦骨嵴、薦角與薦管裂孔</title><desc id="desc">後面觀＋前方地標對照；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="860" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">薦骨：薦孔、薦骨嵴、薦角與薦管裂孔</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">後面觀＋前方地標對照｜回看 1:49:00–1:52:30｜非等比例</text><path d="M160 160L485 160L440 455L345 615L215 455Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M295 615L300 545L330 500L360 545L365 615" fill="none" stroke="#ba817b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="255" cy="250" rx="12" ry="19" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="400" cy="250" rx="12" ry="19" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="262" cy="312" rx="12" ry="19" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="393" cy="312" rx="12" ry="19" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="269" cy="374" rx="12" ry="19" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="386" cy="374" rx="12" ry="19" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="276" cy="436" rx="12" ry="19" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="379" cy="436" rx="12" ry="19" fill="white" stroke="#7899a6" stroke-width="3"/><path d="M325 180 L325 470" fill="none" stroke="#7899a6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><text x="40" y="145" font-size="25" fill="#203e48" text-anchor="start" font-weight="700">後面觀</text><text x="180" y="675" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">薦管裂孔（下端）</text><rect x="635" y="165" width="400" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="650" y="200" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">前方：薦骨岬</text><text x="650" y="236" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">S1 椎體前上緣；骨盆入口地標</text><rect x="635" y="300" width="400" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="650" y="335" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">前後各 4 對薦孔</text><text x="650" y="371" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">前孔：前支；後孔：後支</text><rect x="635" y="435" width="400" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="650" y="470" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">薦角與薦管裂孔</text><text x="650" y="506" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">薦角：S5 下關節突相關</text><rect x="35" y="720" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="755" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">薦孔不是五對；薦管裂孔是下端後方骨弓未完全閉合的開口。</text><text x="55" y="789" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">左圖採後面觀，不將前方的薦岬畫成後面可見的突起。</text><text x="35" y="840" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>