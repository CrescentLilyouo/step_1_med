<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="title"><title id="title">同一個 L4–L5 間隙，突出方向決定受壓根</title><rect width="1100" height="750" rx="20" fill="#f4f9fb"/><g font-family="Noto Sans CJK TC,Noto Sans TC,sans-serif"><text x="35" y="52" font-size="30" fill="#193b4a" font-weight="700">同一個 L4–L5 間隙，突出方向決定受壓根</text><rect x="35" y="95" width="500" height="535" rx="14" fill="#fff" stroke="#d2e3e5"/><text x="55" y="137" font-size="24" fill="#193b4a" font-weight="700">A｜旁中央突出</text><rect x="75" y="185" width="195" height="80" rx="14" fill="#f4e4b9" stroke="#d2e3e5"/><text x="129" y="233" font-size="23" fill="#193b4a">L4 椎體</text><rect x="75" y="315" width="195" height="80" rx="14" fill="#f4e4b9" stroke="#d2e3e5"/><text x="129" y="363" font-size="23" fill="#193b4a">L5 椎體</text><rect x="75" y="270" width="195" height="40" rx="14" fill="#dedee9" stroke="#d2e3e5"/><text x="82" y="298" font-size="18" fill="#193b4a">L4–L5 椎間盤</text><path d="M 305 180 L 305 410" stroke="#d49b2d" stroke-width="13" fill="none"/><path d="M 305 220 Q 355 240 430 270" stroke="#d49b2d" stroke-width="13" fill="none"/><text x="348" y="229" font-size="18" fill="#193b4a">離開根 L4</text><text x="315" y="433" font-size="18" fill="#193b4a">通過根 L5</text><circle cx="294" cy="293" r="23" fill="#c14e62" fill-opacity=".7"/><text x="60" y="498" font-size="24" fill="#973d51" font-weight="700">常見受影響：通過根 L5</text><text x="60" y="540" font-size="19" fill="#193b4a">椎管內，尚未離開的 L5</text><text x="60" y="584" font-size="18" fill="#617987">紅點＝突出位置；黃線＝神經根。</text><rect x="565" y="95" width="500" height="535" rx="14" fill="#fff" stroke="#d2e3e5"/><text x="585" y="137" font-size="24" fill="#193b4a" font-weight="700">B｜孔內／遠外側突出</text><rect x="605" y="185" width="195" height="80" rx="14" fill="#f4e4b9" stroke="#d2e3e5"/><text x="659" y="233" font-size="23" fill="#193b4a">L4 椎體</text><rect x="605" y="315" width="195" height="80" rx="14" fill="#f4e4b9" stroke="#d2e3e5"/><text x="659" y="363" font-size="23" fill="#193b4a">L5 椎體</text><rect x="605" y="270" width="195" height="40" rx="14" fill="#dedee9" stroke="#d2e3e5"/><text x="612" y="298" font-size="18" fill="#193b4a">L4–L5 椎間盤</text><path d="M 835 180 L 835 410" stroke="#d49b2d" stroke-width="13" fill="none"/><path d="M 835 220 Q 885 240 960 270" stroke="#d49b2d" stroke-width="13" fill="none"/><text x="878" y="229" font-size="18" fill="#193b4a">離開根 L4</text><text x="845" y="433" font-size="18" fill="#193b4a">通過根 L5</text><circle cx="905" cy="253" r="23" fill="#c14e62" fill-opacity=".7"/><text x="590" y="498" font-size="24" fill="#973d51" font-weight="700">常見受影響：離開根 L4</text><text x="590" y="540" font-size="19" fill="#193b4a">L4–L5 椎間孔附近的 L4</text><text x="590" y="584" font-size="18" fill="#617987">紅點＝突出位置；黃線＝神經根。</text><text x="35" y="681" font-size="20" fill="#193b4a">先看椎間盤間隙，再看突出方向。此圖為位置關係簡化，並非真實橫斷面影像。</text><text x="35" y="728" font-size="17" fill="#647e88">原創概念圖｜位置與大小不按比例；配合正文及來源核對。</text></g></svg>