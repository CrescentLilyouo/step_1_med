<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">骨盆入口：把一圈骨盆界線畫清楚</title><desc id="desc">骨盆入口上面觀；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">骨盆入口：把一圈骨盆界線畫清楚</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">骨盆入口上面觀｜回看 17:36–25:06｜非等比例</text><ellipse cx="385" cy="355" rx="270" ry="195" fill="white" stroke="#7899a6" stroke-width="3"/><path d="M240 190L385 260L520 190" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M145 305Q155 470 360 510M625 305Q610 470 410 510" fill="none" stroke="#158875" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><rect x="350" y="500" width="65" height="45" rx="12" fill="#f3d4d1" stroke="#b7cbd0" stroke-width="2"/><text x="310" y="145" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">後：薦骨</text><text x="318" y="590" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">前：恥骨</text><path d="M720 235 L385 250" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="720" y="245" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">薦骨岬（後正中）</text><path d="M720 350 L610 405" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="720" y="360" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">髂骨弓狀線</text><path d="M720 455 L490 488" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="720" y="465" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">恥骨梳</text><path d="M720 550 L380 510" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="720" y="560" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">恥骨嵴／聯合上緣</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">後→前：薦岬／薦翼 → 弓狀線 → 恥骨梳 → 恥骨嵴／聯合上緣。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">骨盆界線圈出入口；大／小骨盆以此為界，不能靠整塊髖骨上下各半來分。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>