<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 895" role="img" aria-labelledby="title desc"><title id="title">骨盆形態：入口形狀與盆腔輪廓一起看</title><desc id="desc">入口上面觀＋盆腔模型；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="895" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">骨盆形態：入口形狀與盆腔輪廓一起看</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">入口上面觀＋盆腔模型｜回看 31:12–38:36｜非等比例</text><text x="80" y="150" font-size="27" fill="#203e48" text-anchor="start" font-weight="700">常見男性骨盆形態</text><text x="605" y="150" font-size="27" fill="#203e48" text-anchor="start" font-weight="700">常見女性骨盆形態</text><path d="M150 250Q240 155 325 250Q410 155 480 250Q475 390 325 480Q160 405 150 250Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="805" cy="335" rx="175" ry="135" fill="#dcefe8" stroke="#7899a6" stroke-width="3"/><path d="M185 530L465 530L360 665L290 665Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M650 530L955 530L935 665L670 665Z" fill="#dcefe8" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="245" y="505" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">入口較心形</text><text x="725" y="505" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">入口較寬橢圓</text><text x="225" y="705" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">盆腔較漏斗形</text><text x="705" y="705" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">盆腔較寬／近筒形</text><rect x="35" y="755" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="790" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">板書心形／圓橢圓＋漏斗／圓筒，是典型群體差異的教學模型。</text><text x="55" y="824" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">骨盆形態連續變化、存在重疊；不能僅靠入口形狀或單一角度判定個體。</text><text x="35" y="875" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>