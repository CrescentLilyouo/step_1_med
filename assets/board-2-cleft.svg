<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">腭發育：初級腭、次級腭與兩側融合</title><desc id="desc">胚胎腭的下面觀概念；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">腭發育：初級腭、次級腭與兩側融合</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">胚胎腭的下面觀概念｜回看 22:30–27:30｜非等比例</text><path d="M160 485Q110 310 220 210Q350 150 445 235Q530 350 495 485Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M190 475L305 260L340 475Z" fill="#f6e5bd" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M190 475Q245 330 285 350L285 475Z" fill="#f3d4d1" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M340 475L340 350Q415 330 465 475Z" fill="#f3d4d1" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="305" cy="480" rx="8" ry="8" fill="#158875" stroke="#7899a6" stroke-width="3"/><text x="80" y="555" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">切牙孔：初級／次級腭參考分界</text><rect x="600" y="170" width="440" height="95" rx="12" fill="#f6e5bd" stroke="#b7cbd0" stroke-width="2"/><text x="615" y="205" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">初級腭</text><text x="615" y="241" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">來自中間上頜區（內側鼻突相關）</text><rect x="600" y="300" width="440" height="95" rx="12" fill="#f3d4d1" stroke="#b7cbd0" stroke-width="2"/><text x="615" y="335" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">次級腭</text><text x="615" y="371" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">兩側上頜突的腭突起抬升、融合</text><rect x="600" y="430" width="440" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="615" y="465" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">唇裂與腭裂分開理解</text><text x="615" y="501" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">可同時或分別發生；不是同一條融合線</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">左側只借板書的三角初級腭＋兩側次級腭，示意融合關係。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">這是胚胎發育分區；不等同成人上頜骨與腭骨的橫腭縫。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>