" text-anchor="start" font-weight="700">脊柱節段</text><text x="770" y="208" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">頸椎 7</text><text x="770" y="278" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">胸椎 12</text><text x="770" y="348" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">腰椎 5</text><text x="770" y="418" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">薦椎 5 → 成人 1 骨</text><text x="770" y="488" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">尾椎通常 4 → 通常 1 骨</text><text x="40" y="160" font-size="26" fill="#203e48" text-anchor="start" font-weight="700">中軸骨骼</text><text x="40" y="198" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">脊柱＋胸廓</text><text x="40" y="235" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">另含顱骨等</text><text x="40" y="660" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">骨盆連接下肢</text><rect x="35" y="700" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="735" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">沿用板書「脊柱逐節向下畫」的構想；肋骨往前連胸骨的路線已展開。</text><text x="55" y="769" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">成人脊柱通常 26 塊骨；發育節段通常 33，計數基準不同。</text><text x="35" y="820" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>