<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">髖周六動脈與兩組吻合：字母配回構造</title><desc id="desc">板書字母分組＋骨端示意；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="850" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">髖周六動脈與兩組吻合：字母配回構造</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書字母分組＋骨端示意｜回看 10:24–15:42｜非等比例</text><rect x="45" y="145" width="470" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="60" y="180" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">髂內動脈系統</text><text x="60" y="216" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">a 閉孔、b 上臀、c 下臀</text><rect x="585" y="145" width="470" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="600" y="180" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">股深動脈系統（常見）</text><text x="600" y="216" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">d 內旋股、e 外旋股、f 第一穿通</text><ellipse cx="550" cy="385" rx="90" ry="80" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M620 415L710 510L650 565L565 440" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M710 510L740 645" fill="none" stroke="#7899a6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><rect x="45" y="300" width="395" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="60" y="335" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">轉子吻合：b、c、d、e</text><text x="60" y="371" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">旋股動脈主要列上行支</text><rect x="660" y="300" width="395" height="95" rx="12" fill="#f3d4d1" stroke="#b7cbd0" stroke-width="2"/><text x="675" y="335" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">十字吻合：c、d、e、f</text><text x="675" y="371" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">旋股橫支＋第一穿通升支</text><path d="M440 350 L520 340" fill="none" stroke="#158875" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M660 395 L635 510" fill="none" stroke="#ba817b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="55" y="570" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">上臀＋下臀＋兩旋股</text><text x="55" y="610" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">與下臀＋兩旋股＋第一穿通對照</text><rect x="35" y="710" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="745" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">保留板書 a–f 和兩組四條；連線只是分组索引，不表示血流全從圖示方向進入。</text><text x="55" y="779" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">成人股骨頭重要供血為內旋股動脈的支持帶分支；各動脈起源可有變異。</text><text x="35" y="830" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>