<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" role="img" aria-labelledby="title"><title id="title">八塊腕骨：兩排與掌側深度</title><rect width="1100" height="690" rx="20" fill="#f6fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="49" font-size="30" fill="#18364a" font-weight="700">八塊腕骨：兩排與掌側深度</text><text x="40" y="110" font-size="24" fill="#18364a" font-weight="400">掌側觀的概念排列｜左：橈側／拇指；右：尺側／小指</text><text x="40" y="155" font-size="23" fill="#0c796f" font-weight="400">遠端 ↑（往掌骨）</text><rect x="45" y="180" width="245" height="110" rx="12" fill="#dceef6"/><text x="60" y="223" font-size="26" fill="#18364a" font-weight="700">大多角骨</text><text x="60" y="265" font-size="23" fill="#18364a" font-weight="400">Trapezium</text><rect x="307" y="180" width="245" height="110" rx="12" fill="#dceef6"/><text x="322" y="223" font-size="26" fill="#18364a" font-weight="700">小多角骨</text><text x="322" y="265" font-size="23" fill="#18364a" font-weight="400">Trapezoid</text><rect x="569" y="180" width="245" height="110" rx="12" fill="#dceef6"/><text x="584" y="223" font-size="26" fill="#18364a" font-weight="700">頭狀骨</text><text x="584" y="265" font-size="23" fill="#18364a" font-weight="400">Capitate</text><rect x="831" y="180" width="245" height="110" rx="12" fill="#dceef6"/><text x="846" y="223" font-size="26" fill="#18364a" font-weight="700">鉤狀骨</text><text x="846" y="265" font-size="23" fill="#18364a" font-weight="400">Hamate</text><rect x="45" y="340" width="245" height="110" rx="12" fill="#dcefe5"/><text x="60" y="383" font-size="26" fill="#18364a" font-weight="700">舟狀骨</text><text x="60" y="425" font-size="23" fill="#18364a" font-weight="400">Scaphoid</text><rect x="307" y="340" width="245" height="110" rx="12" fill="#dcefe5"/><text x="322" y="383" font-size="26" fill="#18364a" font-weight="700">月狀骨</text><text x="322" y="425" font-size="23" fill="#18364a" font-weight="400">Lunate</text><rect x="569" y="340" width="245" height="110" rx="12" fill="#dcefe5"/><text x="584" y="383" font-size="26" fill="#18364a" font-weight="700">三角骨</text><text x="584" y="425" font-size="23" fill="#18364a" font-weight="400">Triquetrum</text><rect x="831" y="340" width="245" height="110" rx="12" fill="#fbedd7"/><text x="846" y="383" font-size="26" fill="#18364a" font-weight="700">豆狀骨</text><text x="846" y="425" font-size="23" fill="#18364a" font-weight="400">Pisiform</text><path d="M831 395 L790 395" fill="none" stroke="#b08935" stroke-width="4" stroke-dasharray="7 5"/><text x="800" y="494" font-size="22" fill="#a47724" font-weight="400">覆在三角骨掌側</text><text x="45" y="517" font-size="23" fill="#0c796f" font-weight="400">近端 ↓（往前臂）</text><text x="45" y="563" font-size="23" fill="#18364a" font-weight="400">橈骨直接接：舟狀骨、月狀骨</text><text x="45" y="603" font-size="21" fill="#18364a" font-weight="400">尺骨與腕骨之間有關節盤；豆狀骨不與其他三骨處於同一平面</text><text x="35" y="663" font-size="19" fill="#617789" font-weight="400">原創概念圖｜非等比例；配合正文方向、層次及變異說明使用</text></g></svg>