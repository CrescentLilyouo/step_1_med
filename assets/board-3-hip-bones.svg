<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">髖骨三部分：髖臼與閉孔的拼接</title><desc id="desc">單側髖骨外面概念觀；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">髖骨三部分：髖臼與閉孔的拼接</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">單側髖骨外面概念觀｜回看 74:30–86:00｜非等比例</text><path d="M170 210Q280 100 470 210L440 325L395 410L335 570L225 560L160 435L210 335Z" fill="#dcefe8" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M395 410L460 380L490 500L335 570Z" fill="#f3d4d1" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M170 410L235 435L225 560L335 570L315 630L170 540Z" fill="#f6e5bd" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="345" cy="405" rx="50" ry="55" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="300" cy="525" rx="60" ry="47" fill="white" stroke="#7899a6" stroke-width="3"/><text x="235" y="235" font-size="28" fill="#203e48" text-anchor="start" font-weight="400">髂骨</text><text x="392" y="490" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">恥骨</text><text x="145" y="590" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">坐骨</text><path d="M600 430 L360 410" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="440" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">髖臼：三骨共同形成</text><path d="M600 560 L340 525" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="570" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">閉孔：恥＋坐圍成</text><rect x="610" y="155" width="420" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="625" y="190" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">外側面</text><text x="625" y="226" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">髖臼可見；頭向內與髖臼相配</text><rect x="610" y="280" width="420" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="625" y="315" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">內側面</text><text x="625" y="351" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">髂窩、弓狀線、耳狀面等</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">三色是骨的發育組成索引，成人融合後邊界不會像拼圖線一樣全部可見。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">Ilium 髂骨 ≠ ileum 迴腸；髖骨由髂、坐、恥三部分融合。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>