<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" role="img" aria-labelledby="title desc"><title id="title">顳顎關節：關節盤、旋轉與滑移</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="880" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">顳顎關節：關節盤、旋轉與滑移</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 36:30–42:30｜非等比例</text><rect x="35" y="145" width="495" height="70" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="282.5" y="182" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">閉口：關節盤隔成兩腔</text><path d="M85 300 Q205 260 265 340 L465 295" fill="none" stroke="#7899a6" stroke-width="18"/><ellipse cx="285" cy="390" rx="110" ry="25" fill="#d7868a"/><ellipse cx="285" cy="470" rx="80" ry="62" fill="#ffe1a3" stroke="#bba47a" stroke-width="4"/><path d="M235 520 L245 650 M335 515 L325 650" stroke="#bba47a" stroke-width="8"/><text x="65" y="363" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">上腔：盤—顳骨，滑移</text><text x="65" y="580" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">下腔：盤—下顎髁，旋轉</text><rect x="570" y="145" width="495" height="70" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="817.5" y="182" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">張口：旋轉＋前方滑移</text><path d="M620 300 Q740 260 800 340 L1000 295" fill="none" stroke="#7899a6" stroke-width="18"/><ellipse cx="820" cy="390" rx="110" ry="25" fill="#d7868a"/><ellipse cx="820" cy="470" rx="80" ry="62" fill="#ffe1a3" stroke="#bba47a" stroke-width="4"/><path d="M770 520 L780 650 M870 515 L860 650" stroke="#bba47a" stroke-width="8"/><text x="600" y="363" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">上腔：盤—顳骨，滑移</text><text x="600" y="580" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">下腔：盤—下顎髁，旋轉</text><path d="M820 393 L705 340" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="675" y="680" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">前方 ←（概念方向）</text><rect x="35" y="730" width="1030" height="105" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="767" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">正常張口是兩側協調的三維運動</text><text x="550.0" y="800" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">外翼肌上下頭附著與功能有差異；不能把盤簡畫成孤立骨片</text></g></svg>