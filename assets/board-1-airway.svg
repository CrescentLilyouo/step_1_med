<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">氣道—食道—胃與橫膈通道</title><desc id="desc">側視／高度整合；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="850" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">氣道—食道—胃與橫膈通道</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">側視／高度整合｜回看 44:40–51:15｜非等比例</text><text x="55" y="150" font-size="26" fill="#203e48" text-anchor="start" font-weight="700">氣道／食道側視</text><path d="M180 180L260 180L290 215L270 245L255 575" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M260 275L200 285L210 540" fill="none" stroke="#ba817b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" /><path d="M275 270L305 580Q390 590 385 650Q295 690 290 600" fill="#f3d4d1" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M45 365 L210 375" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="45" y="375" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">氣管</text><path d="M330 400 L295 410" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="330" y="410" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">食道</text><text x="325" y="642" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">胃</text><text x="550" y="150" font-size="26" fill="#203e48" text-anchor="start" font-weight="700">橫膈三通道：T8、T10、T12</text><rect x="550" y="195" width="500" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="565" y="230" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">T8 · 下腔靜脈</text><text x="565" y="266" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">中央腱區</text><rect x="550" y="330" width="500" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="565" y="365" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">T10 · 食道＋迷走神經幹</text><text x="565" y="401" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">肌性食道裂孔</text><rect x="550" y="465" width="500" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="565" y="500" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">T12 · 主動脈＋胸管</text><text x="565" y="536" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">後方主動脈裂孔</text><rect x="35" y="710" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="745" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">片中以氣道、食道與脊柱串連高度；右側將三大橫膈通道整理成對照。</text><text x="55" y="779" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">高度為典型近似；食道裂孔與主動脈裂孔不能混成同一個孔。</text><text x="35" y="830" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>