<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">肩帶連接與喙鎖韌帶：三個關節分開</title><desc id="desc">單側肩帶前視展開；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">肩帶連接與喙鎖韌帶：三個關節分開</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">單側肩帶前視展開｜回看 24:00–30:00、39:00–46:00｜非等比例</text><rect x="90" y="215" width="75" height="230" rx="12" fill="#f3d4d1" stroke="#b7cbd0" stroke-width="2"/><path d="M170 245Q320 185 440 240Q560 300 730 255" fill="none" stroke="#7899a6" stroke-width="23" stroke-linecap="round" stroke-linejoin="round" /><path d="M740 255L860 225L790 560L605 340Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="665" cy="355" rx="40" ry="55" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><ellipse cx="605" cy="375" rx="68" ry="70" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M605 440V625" fill="none" stroke="#7899a6" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" /><path d="M680 275L650 325L740 290" fill="#dcefe8" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M650 325 L795 240" fill="none" stroke="#ba817b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><text x="40" y="185" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">胸骨</text><path d="M185 125 L165 245" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="185" y="135" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">SC 胸鎖關節</text><path d="M770 140 L735 255" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="770" y="150" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">AC 肩鎖關節</text><path d="M800 390 L640 355" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="400" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">GH 盂肱關節</text><path d="M200 500 L680 285" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="510" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">喙鎖韌帶：圓錐＋斜方</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">骨性連接路線：胸骨 → 鎖骨 → 肩峰／肩胛骨 → 肱骨。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">喙鎖跨兩骨；喙肩連同一肩胛骨的喙突與肩峰，並非同一條。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>