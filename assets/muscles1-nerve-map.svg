<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 870" role="img" aria-labelledby="title desc"><title id="title">頭頸肌神經：大分類與例外</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="870" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">頭頸肌神經：大分類與例外</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 07:00–10:00、80:00–85:00、97:00–103:00｜非等比例</text><rect x="40" y="160" width="490" height="115" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="285.0" y="197" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">V3</text><text x="285.0" y="230" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">四咀嚼肌、下顎舌骨、二腹前腹</text><rect x="570" y="160" width="490" height="115" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="815.0" y="197" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">VII</text><text x="815.0" y="230" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">表情肌、莖舌骨、二腹後腹</text><rect x="40" y="330" width="490" height="115" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="285.0" y="367" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">IX</text><text x="285.0" y="400" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">莖突嚥肌</text><rect x="570" y="330" width="490" height="115" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="815.0" y="367" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">X</text><text x="815.0" y="400" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">多數咽／軟顎及內在喉肌</text><rect x="40" y="500" width="490" height="115" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="285.0" y="537" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">C1 隨 XII 行走</text><text x="285.0" y="570" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">頦舌骨、甲狀舌骨</text><rect x="570" y="500" width="490" height="115" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="815.0" y="537" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">頸神經袢 C1–C3</text><text x="815.0" y="570" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">其餘常用舌骨下肌群</text><rect x="40" y="695" width="1020" height="125" rx="12" fill="#fff1db" stroke="#adcac3"/><text x="550.0" y="732" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">最常見陷阱：XII 旁邊經過，不等於神經纖維源自 XII</text><text x="550.0" y="765" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">嚥肌大多 X；莖突嚥肌 IX。軟顎張肌 V3；環甲肌上喉外支。</text></g></svg>