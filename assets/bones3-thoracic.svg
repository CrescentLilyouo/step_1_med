<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title"><title id="title">胸壁層次與第一肋骨血管關係</title><rect width="1100" height="660" rx="20" fill="#f6fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="49" font-size="30" fill="#18364a" font-weight="700">胸壁層次與第一肋骨血管關係</text><rect x="30" y="80" width="520" height="510" rx="12" fill="#fff"/><rect x="570" y="80" width="500" height="510" rx="12" fill="#fff"/><text x="52" y="120" font-size="25" fill="#18364a" font-weight="700">A｜一般肋間：淺 → 深</text><rect x="55" y="150" width="465" height="58" rx="12" fill="#f1e4bd"/><text x="80" y="189" font-size="23" fill="#18364a" font-weight="400">外肋間肌</text><rect x="55" y="230" width="465" height="58" rx="12" fill="#d7e9f3"/><text x="80" y="269" font-size="23" fill="#18364a" font-weight="400">內肋間肌</text><rect x="55" y="390" width="465" height="58" rx="12" fill="#e0ecda"/><text x="80" y="429" font-size="23" fill="#18364a" font-weight="400">最內肋間肌</text><rect x="55" y="305" width="465" height="60" rx="12" fill="#eef8f5"/><text x="70" y="344" font-size="22" fill="#087b70" font-weight="400">神經血管平面</text><text x="65" y="488" font-size="22" fill="#18364a" font-weight="700">肋骨溝：內面下緣</text><circle cx="75" cy="503" r="10" fill="#407da8"/><text x="99" y="510" font-size="21" fill="#407da8" font-weight="400">V 靜脈</text><circle cx="75" cy="533" r="10" fill="#c94f4f"/><text x="99" y="540" font-size="21" fill="#c94f4f" font-weight="400">A 動脈</text><circle cx="75" cy="563" r="10" fill="#bc861b"/><text x="99" y="570" font-size="21" fill="#bc861b" font-weight="400">N 神經</text><text x="280" y="551" font-size="21" fill="#18364a" font-weight="400">上方 → 下方：VAN</text><text x="590" y="120" font-size="25" fill="#18364a" font-weight="700">B｜第一肋骨上面：前 → 後</text><rect x="600" y="165" width="430" height="70" rx="12" fill="#d9ebf8"/><text x="618" y="209" font-size="23" fill="#18364a" font-weight="400">鎖骨下靜脈（前方）</text><rect x="600" y="265" width="430" height="70" rx="12" fill="#e3eee0"/><text x="618" y="309" font-size="23" fill="#18364a" font-weight="400">前斜角肌／斜角肌結節</text><rect x="600" y="365" width="430" height="70" rx="12" fill="#f7dddd"/><text x="618" y="409" font-size="23" fill="#18364a" font-weight="400">鎖骨下動脈（後方）</text><path d="M815 245 L815 225" fill="none" stroke="#5e788b" stroke-width="3"/><path d="M815 355 L815 335" fill="none" stroke="#5e788b" stroke-width="3"/><text x="595" y="490" font-size="21" fill="#18364a" font-weight="400">動脈與臂神經叢走斜角肌間隙</text><text x="595" y="530" font-size="21" fill="#18364a" font-weight="400">靜脈在前斜角肌前方</text><text x="595" y="565" font-size="21" fill="#087b70" font-weight="400">不是一般肋骨溝的 VAN 上下題</text><text x="35" y="633" font-size="19" fill="#617789" font-weight="400">原創概念圖｜非等比例；配合正文方向、層次及變異說明使用</text></g></svg>