<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc"><title id="title">顱底孔洞：用三顱窩串起神經出口</title><desc id="desc">顱底內面分區索引；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="840" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">顱底孔洞：用三顱窩串起神經出口</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">顱底內面分區索引｜回看 80:15–101:20｜非等比例</text><ellipse cx="395" cy="385" rx="270" ry="255" fill="white" stroke="#7899a6" stroke-width="3"/><path d="M170 285Q395 350 620 285M160 445Q395 365 630 445" fill="none" stroke="#ba817b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="395" cy="185" rx="7" ry="7" fill="#158875" stroke="#7899a6" stroke-width="3"/><ellipse cx="320" cy="320" rx="7" ry="7" fill="#158875" stroke="#7899a6" stroke-width="3"/><ellipse cx="480" cy="330" rx="7" ry="7" fill="#158875" stroke="#7899a6" stroke-width="3"/><ellipse cx="480" cy="375" rx="7" ry="7" fill="#158875" stroke="#7899a6" stroke-width="3"/><ellipse cx="535" cy="405" rx="7" ry="7" fill="#158875" stroke="#7899a6" stroke-width="3"/><ellipse cx="585" cy="430" rx="7" ry="7" fill="#158875" stroke="#7899a6" stroke-width="3"/><ellipse cx="260" cy="470" rx="7" ry="7" fill="#158875" stroke="#7899a6" stroke-width="3"/><ellipse cx="505" cy="510" rx="7" ry="7" fill="#158875" stroke="#7899a6" stroke-width="3"/><ellipse cx="450" cy="560" rx="7" ry="7" fill="#158875" stroke="#7899a6" stroke-width="3"/><ellipse cx="395" cy="555" rx="33" ry="43" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><text x="325" y="638" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">枕骨大孔</text><path d="M395 185 L725 150" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="735" y="158" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">篩孔 · I</text><path d="M320 320 L725 203" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="735" y="211" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">視神經管 · II</text><path d="M480 330 L725 256" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="735" y="264" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">眶上裂 · III/IV/V1/VI</text><path d="M480 375 L725 309" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="735" y="317" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">圓孔 · V2</text><path d="M535 405 L725 362" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="735" y="370" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">卵圓孔 · V3</text><path d="M585 430 L725 415" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="735" y="423" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">棘孔 · 中腦膜動脈</text><path d="M260 470 L725 468" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="735" y="476" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">內耳道 · VII/VIII</text><path d="M505 510 L725 521" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="735" y="529" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">頸靜脈孔 · IX/X/XI</text><path d="M450 560 L725 574" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="735" y="582" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">舌下神經管 · XII</text><rect x="35" y="700" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="735" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">點位是通道分區索引，不是實際大小、左右對稱或可供精密定位的顱底圖。</text><text x="55" y="769" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">VII 由內耳道進入顏面神經管，再經莖乳突孔出骨；頸內動脈走頸動脈管。</text><text x="35" y="820" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>