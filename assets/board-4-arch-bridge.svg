<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" role="img" aria-labelledby="title desc"><title id="title">足弓像石橋：拱頂、拉索、固定與懸吊</title><desc id="desc">板書工程模型＋解剖配對；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="880" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">足弓像石橋：拱頂、拉索、固定與懸吊</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書工程模型＋解剖配對｜回看 1:25:36–1:38:06｜非等比例</text><path d="M130 450Q355 120 580 450" fill="none" stroke="#7899a6" stroke-width="55" stroke-linecap="round" stroke-linejoin="round" /><path d="M290 265L355 190L420 265L375 305L335 305Z" fill="#f6e5bd" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M120 495 L590 495" fill="none" stroke="#ba817b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M225 385 L235 450" fill="none" stroke="#158875" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M460 385 L470 450" fill="none" stroke="#158875" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M130 210L130 470M590 210L590 470M130 210Q355 150 590 210" fill="none" stroke="#7899a6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="215" y="575" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">足底拉索／底梁</text><text x="645" y="180" font-size="26" fill="#203e48" text-anchor="start" font-weight="700">石橋四個關鍵字</text><rect x="645" y="215" width="400" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="660" y="250" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">拱頂</text><text x="660" y="286" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">內縱弓常以距骨頭為關鍵</text><rect x="645" y="325" width="400" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="660" y="360" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">拉索</text><text x="660" y="396" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">足底腱膜、足底韌帶等</text><rect x="645" y="435" width="400" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="660" y="470" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">節間固定</text><text x="660" y="506" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">韌帶約束相邻骨的位移</text><rect x="645" y="545" width="400" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="660" y="580" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">懸吊</text><text x="660" y="616" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">脛後／腓骨長等肌腱支撐</text><rect x="35" y="740" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="775" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">沿用板書的拱橋、拉索與懸吊比喻；工程構件不是足部一對一的實體解剖。</text><text x="55" y="809" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">彈簧韌帶支持距骨頭；腓骨長肌腱跨足底，脛後肌也是內縱弓的重要動態支持。</text><text x="35" y="860" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>