<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 710" role="img" aria-labelledby="title"><title id="title">坐骨切跡與薦棘／薦結節韌帶</title><rect width="1100" height="710" rx="20" fill="#f6fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="49" font-size="30" fill="#18364a" font-weight="700">坐骨切跡與薦棘／薦結節韌帶</text><rect x="30" y="80" width="620" height="555" rx="12" fill="#fff"/><rect x="675" y="80" width="395" height="555" rx="12" fill="#fff"/><text x="50" y="121" font-size="25" fill="#18364a" font-weight="700">髖骨後緣的概念圖</text><path d="M180 170 Q440 170 440 235 Q340 280 405 330 L465 340 Q375 410 405 490 L440 535 Q315 590 200 535 Q230 410 170 350 Z" fill="#f3e7cc" stroke="#a88e57" stroke-width="5"/><circle cx="440" cy="235" r="8" fill="#0c796f"/><circle cx="465" cy="340" r="8" fill="#0c796f"/><circle cx="440" cy="535" r="8" fill="#0c796f"/><path d="M440 235 L545 207" fill="none" stroke="#5e788b" stroke-width="3"/><text x="390" y="190" font-size="21" fill="#18364a" font-weight="400">髂後下棘</text><path d="M380 280 L555 280" fill="none" stroke="#5e788b" stroke-width="3"/><text x="433" y="264" font-size="21" fill="#18364a" font-weight="400">大坐骨切跡</text><path d="M465 340 L585 340" fill="none" stroke="#5e788b" stroke-width="3"/><text x="476" y="327" font-size="21" fill="#18364a" font-weight="400">坐骨棘</text><path d="M387 430 L555 430" fill="none" stroke="#5e788b" stroke-width="3"/><text x="433" y="415" font-size="21" fill="#18364a" font-weight="400">小坐骨切跡</text><path d="M440 535 L577 554" fill="none" stroke="#5e788b" stroke-width="3"/><text x="464" y="586" font-size="21" fill="#18364a" font-weight="400">坐骨結節</text><text x="50" y="605" font-size="22" fill="#18364a" font-weight="400">讀圖順序：大切跡 → 棘 → 小切跡 → 結節</text><text x="695" y="122" font-size="25" fill="#18364a" font-weight="700">韌帶端點配對</text><rect x="700" y="160" width="345" height="90" rx="12" fill="#e3f2eb"/><text x="722" y="197" font-size="25" fill="#18364a" font-weight="700">薦棘韌帶</text><text x="722" y="232" font-size="22" fill="#18364a" font-weight="400">薦／尾骨 ↔ 坐骨棘</text><rect x="700" y="285" width="345" height="90" rx="12" fill="#dfecf6"/><text x="722" y="322" font-size="25" fill="#18364a" font-weight="700">薦結節韌帶</text><text x="722" y="357" font-size="22" fill="#18364a" font-weight="400">薦骨等 ↔ 坐骨結節</text><text x="700" y="435" font-size="21" fill="#18364a" font-weight="400">加入兩條韌帶與薦骨邊界</text><text x="700" y="475" font-size="21" fill="#18364a" font-weight="400">骨性切跡 → 大、小坐骨孔</text><text x="700" y="537" font-size="22" fill="#0b796d" font-weight="400">陰部神經：大孔出</text><text x="700" y="575" font-size="22" fill="#0b796d" font-weight="400">繞棘，再由小孔入會陰</text><text x="35" y="683" font-size="19" fill="#617789" font-weight="400">原創概念圖｜非等比例；配合正文方向、層次及變異說明使用</text></g></svg>