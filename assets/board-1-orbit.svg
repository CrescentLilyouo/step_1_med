<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">眼眶：四壁、七骨與三個主要通道</title><desc id="desc">單側眶腔展開圖；內側在左；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">眼眶：四壁、七骨與三個主要通道</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">單側眶腔展開圖；內側在左｜回看 90:15–107:40｜非等比例</text><ellipse cx="405" cy="355" rx="235" ry="220" fill="white" stroke="#7899a6" stroke-width="3"/><path d="M210 205Q405 130 600 205L575 270H240Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M240 270L290 485L360 380L330 270Z" fill="#dcefe8" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M330 270H435L485 420L360 380Z" fill="#f6e5bd" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M435 270L575 270L600 440L485 420Z" fill="#f3d4d1" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M290 485L485 420L600 440Q405 625 290 485Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="375" cy="300" rx="17" ry="17" fill="white" stroke="#7899a6" stroke-width="3"/><path d="M440 315L510 355" fill="none" stroke="#158875" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M470 450L555 462" fill="none" stroke="#158875" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><rect x="685" y="155" width="365" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="700" y="190" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">頂壁</text><text x="700" y="226" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">額骨＋蝶骨小翼</text><rect x="685" y="270" width="365" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="700" y="305" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">內側壁</text><text x="700" y="341" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">上頜、淚、篩、蝶骨</text><rect x="685" y="385" width="365" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="700" y="420" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">底壁</text><text x="700" y="456" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">上頜為主＋顴、腭骨</text><rect x="685" y="500" width="365" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="700" y="535" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">外側壁</text><text x="700" y="571" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">顴骨＋蝶骨大翼</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">四壁顏色是分區，不代表實際每塊骨的完整面積；後方尖端被展開。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">視神經管：II；眶上裂：III、IV、V1、VI；眶下裂：V2 分支等。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>