<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="title"><title id="title">翼腭窩：七種通道與方向</title><rect width="1100" height="750" rx="20" fill="#f4f9fb"/><g font-family="Noto Sans CJK TC,Noto Sans TC,sans-serif"><text x="35" y="52" font-size="30" fill="#193b4a" font-weight="700">翼腭窩：七種通道與方向</text><rect x="35" y="110" width="390" height="112" rx="14" fill="#fff" stroke="#d2e3e5"/><text x="53" y="140" font-size="19" fill="#0c7668" font-weight="700">後方</text><text x="53" y="173" font-size="21" fill="#193b4a">圓孔 → 中顱窩</text><text x="53" y="204" font-size="17" fill="#526b76">V2 進入翼腭窩</text><path d="M 425 166 L 470 360" fill="none" stroke="#8ab5b5" stroke-width="2"/><rect x="35" y="245" width="390" height="112" rx="14" fill="#fff" stroke="#d2e3e5"/><text x="53" y="275" font-size="19" fill="#0c7668" font-weight="700">後方</text><text x="53" y="308" font-size="21" fill="#193b4a">翼管 → 破裂孔附近</text><text x="53" y="339" font-size="17" fill="#526b76">翼管神經：大岩＋深岩</text><path d="M 425 301 L 470 360" fill="none" stroke="#8ab5b5" stroke-width="2"/><rect x="35" y="380" width="390" height="112" rx="14" fill="#fff" stroke="#d2e3e5"/><text x="53" y="410" font-size="19" fill="#0c7668" font-weight="700">後方</text><text x="53" y="443" font-size="21" fill="#193b4a">腭鞘管 → 鼻咽</text><text x="53" y="474" font-size="17" fill="#526b76">咽支、咽支血管</text><path d="M 425 436 L 470 360" fill="none" stroke="#8ab5b5" stroke-width="2"/><rect x="675" y="110" width="390" height="112" rx="14" fill="#fff" stroke="#d2e3e5"/><text x="693" y="140" font-size="19" fill="#0c7668" font-weight="700">上方</text><text x="693" y="173" font-size="21" fill="#193b4a">眶下裂 → 眼眶</text><text x="693" y="204" font-size="17" fill="#526b76">眶下神經、顴神經等</text><path d="M 675 166 L 630 360" fill="none" stroke="#8ab5b5" stroke-width="2"/><rect x="675" y="245" width="390" height="112" rx="14" fill="#fff" stroke="#d2e3e5"/><text x="693" y="275" font-size="19" fill="#0c7668" font-weight="700">內側</text><text x="693" y="308" font-size="21" fill="#193b4a">蝶腭孔 → 鼻腔</text><text x="693" y="339" font-size="17" fill="#526b76">蝶腭動脈、鼻支</text><path d="M 675 301 L 630 360" fill="none" stroke="#8ab5b5" stroke-width="2"/><rect x="675" y="380" width="390" height="112" rx="14" fill="#fff" stroke="#d2e3e5"/><text x="693" y="410" font-size="19" fill="#0c7668" font-weight="700">下方</text><text x="693" y="443" font-size="21" fill="#193b4a">腭管 → 口腔腭部</text><text x="693" y="474" font-size="17" fill="#526b76">大、小腭神經及血管</text><path d="M 675 436 L 630 360" fill="none" stroke="#8ab5b5" stroke-width="2"/><rect x="675" y="515" width="390" height="112" rx="14" fill="#fff" stroke="#d2e3e5"/><text x="693" y="545" font-size="19" fill="#0c7668" font-weight="700">外側</text><text x="693" y="578" font-size="21" fill="#193b4a">翼上頜裂 → 顳下窩</text><text x="693" y="609" font-size="17" fill="#526b76">上頜動脈進入</text><path d="M 675 571 L 630 360" fill="none" stroke="#8ab5b5" stroke-width="2"/><rect x="450" y="295" width="200" height="130" rx="14" fill="#dcefeb" stroke="#d2e3e5"/><text x="473" y="343" font-size="28" fill="#193b4a" font-weight="700">翼腭窩</text><text x="473" y="382" font-size="18" fill="#193b4a">PPF 交通樞紐</text><text x="35" y="686" font-size="19" fill="#193b4a">七種通道；不是七個相同大小的圓孔。路線代表交通，不表示所有內容物同向通行。</text><text x="35" y="728" font-size="17" fill="#647e88">原創概念圖｜位置與大小不按比例；配合正文及來源核對。</text></g></svg>