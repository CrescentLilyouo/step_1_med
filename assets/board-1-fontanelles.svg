<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">六個囟門：正中兩個，側方兩對</title><desc id="desc">上面觀＋側方位置清單；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">六個囟門：正中兩個，側方兩對</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">上面觀＋側方位置清單｜回看 64:45–68:00｜非等比例</text><ellipse cx="355" cy="370" rx="190" ry="240" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M175 240Q355 190 535 240M355 205V515M180 505Q355 565 530 505" fill="none" stroke="#c1837e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M355 190L390 235L355 280L320 235Z" fill="#f6e5bd" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M355 500L375 535L335 535Z" fill="#f6e5bd" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="165" font-size="25" fill="#203e48" text-anchor="start" font-weight="700">上面觀</text><text x="312" y="163" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">前</text><text x="312" y="638" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">後</text><rect x="600" y="150" width="450" height="95" rx="12" fill="#f6e5bd" stroke="#b7cbd0" stroke-width="2"/><text x="615" y="185" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">前囟 ×1</text><text x="615" y="221" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">菱形；典型約 18–24 個月閉合</text><rect x="600" y="270" width="450" height="95" rx="12" fill="#f6e5bd" stroke="#b7cbd0" stroke-width="2"/><text x="615" y="305" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">後囟 ×1</text><text x="615" y="341" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">三角形；典型出生後約 2–3 個月</text><rect x="600" y="390" width="450" height="95" rx="12" fill="#f6e5bd" stroke="#b7cbd0" stroke-width="2"/><text x="615" y="425" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">蝶囟 ×2</text><text x="615" y="461" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">兩側前外方；翼點區相關</text><rect x="600" y="510" width="450" height="95" rx="12" fill="#f6e5bd" stroke="#b7cbd0" stroke-width="2"/><text x="615" y="545" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">乳突囟 ×2</text><text x="615" y="581" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">兩側後外方；星點區相關</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">總數 6：前 1＋後 1＋蝶 2＋乳突 2。圖左只畫可由顱頂辨識的兩個。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">側方兩對以右側標籤列出，避免把它們誤畫在顱頂正中；閉合時程有變異。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>