<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">脊柱韌帶：前後位置與椎間盤</title><desc id="desc">側視展開；前在左；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">脊柱韌帶：前後位置與椎間盤</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">側視展開；前在左｜回看 1:32:00–1:37:30、1:43:30–1:45:30｜非等比例</text><rect x="150" y="180" width="180" height="110" rx="12" fill="#dcebf0" stroke="#b7cbd0" stroke-width="2"/><path d="M330 225L460 245L545 210" fill="none" stroke="#7899a6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><rect x="150" y="335" width="180" height="110" rx="12" fill="#dcebf0" stroke="#b7cbd0" stroke-width="2"/><path d="M330 380L460 400L545 365" fill="none" stroke="#7899a6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><rect x="150" y="490" width="180" height="110" rx="12" fill="#dcebf0" stroke="#b7cbd0" stroke-width="2"/><path d="M330 535L460 555L545 520" fill="none" stroke="#7899a6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><rect x="150" y="290" width="180" height="45" rx="12" fill="#f3d4d1" stroke="#b7cbd0" stroke-width="2"/><ellipse cx="240" cy="312" rx="50" ry="17" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><path d="M460 265 L460 325" fill="none" stroke="#a68b42" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><rect x="150" y="445" width="180" height="45" rx="12" fill="#f3d4d1" stroke="#b7cbd0" stroke-width="2"/><ellipse cx="240" cy="467" rx="50" ry="17" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><path d="M460 420 L460 480" fill="none" stroke="#a68b42" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M140 180 L140 600" fill="none" stroke="#158875" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M340 180 L340 600" fill="none" stroke="#158875" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M545 210 L545 560" fill="none" stroke="#ba817b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M630 205 L140 225" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="630" y="215" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">前縱韌帶：椎體前面</text><path d="M630 290 L340 330" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="630" y="300" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">後縱韌帶：椎體後面</text><path d="M630 390 L460 415" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="630" y="400" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">黃韌帶：相鄰椎板</text><path d="M630 505 L545 480" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="630" y="515" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">棘間／棘上韌帶：後方棘突</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">側視：左為前、右為後。粉紅是椎間盤纖維環概念；金色是髓核。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">前後縱韌帶不等於椎管後壁的黃韌帶；本圖將部分深度展開。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>