<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" role="img" aria-labelledby="title desc"><title id="title">脛腓骨：內外踝與總腓神經位置</title><desc id="desc">前面觀；內在左、外在右；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="920" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">脛腓骨：內外踝與總腓神經位置</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">前面觀；內在左、外在右｜回看 1:08:36–1:13:12｜非等比例</text><path d="M210 190L390 190L365 320L355 545L390 655L300 685L260 600L265 340Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M445 205L475 205L465 590L505 700L450 725L425 605L430 280Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="445" cy="220" rx="24" ry="24" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><path d="M500 200Q410 235 443 290L500 320" fill="none" stroke="#ba817b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="180" y="150" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">脛骨：內側主承重</text><text x="420" y="150" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">腓骨：外側較細</text><path d="M620 225 L445 260" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="620" y="235" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">腓骨頭／頸：總腓神經繞行</text><path d="M620 515 L390 440" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="620" y="525" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">骨間膜：兩骨之間</text><path d="M370 340L430 300L425 585L360 545Z" fill="#dcefe8" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M620 640 L305 660" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="620" y="650" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">內踝：脛骨末端</text><path d="M620 710 L475 695" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="620" y="720" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">外踝：腓骨末端較低</text><rect x="35" y="780" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="815" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">前面觀內側在左、外側在右；外踝通常比內踝更低、更偏後。</text><text x="55" y="849" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">近端脛腓是滑液關節；遠端為纖維性連結；腓骨不是完全零承重。</text><text x="35" y="900" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>