<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1000" role="img" aria-labelledby="title desc"><title id="title">頸前三角：用三條肌肉畫分區</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="1000" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">頸前三角：用三條肌肉畫分區</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 103:00–113:42｜非等比例</text><text x="40" y="143" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">單側前頸概念：下顎上方；中線在右；SCM 在左</text><path d="M180 220 L950 220 L950 785Z" fill="#e9f5f0" stroke="#557e83" stroke-width="6"/><path d="M180 220 L950 785" stroke="#c29b5b" stroke-width="14" fill="none"/><path d="M180 220 L600 390 L950 220" stroke="#c87276" stroke-width="9" fill="none"/><path d="M600 390 L600 528" stroke="#6596be" stroke-width="9" fill="none"/><path d="M600 390 L950 390" stroke="#b4bfc3" stroke-width="4" fill="none"/><text x="280" y="175" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">下顎骨下緣</text><text x="870" y="315" font-size="23" fill="#203e48" text-anchor="middle" font-weight="400">頦下三角</text><text x="420" y="275" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">下顎下三角</text><text x="475" y="397" font-size="22" fill="#203e48" text-anchor="middle" font-weight="400">頸動脈三角</text><text x="820" y="660" font-size="26" fill="#203e48" text-anchor="start" font-weight="400">肌三角</text><text x="980" y="535" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">中線</text><text x="250" y="530" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">胸鎖乳突肌</text><text x="380" y="355" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">二腹肌後腹</text><text x="755" y="367" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">二腹肌前腹</text><text x="445" y="470" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">肩胛舌骨肌上腹</text><text x="635" y="410" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">舌骨</text><rect x="40" y="845" width="1020" height="105" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="882" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">先找大三角，再用二腹肌、肩胛舌骨肌分區</text><text x="550.0" y="915" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">頦下三角整體為不成對的中線區；圖只示一半。圖上範圍不是手術定位圖。</text></g></svg>