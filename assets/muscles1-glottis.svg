<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 865" role="img" aria-labelledby="title desc"><title id="title">聲門俯視：外展打開，內收靠攏</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="865" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">聲門俯視：外展打開，內收靠攏</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 85:30–96:30｜非等比例</text><text x="550" y="142" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">由上方看：前方在上，後方在下</text><rect x="40" y="175" width="475" height="70" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="277.5" y="212" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">吸氣：聲門打開</text><ellipse cx="275" cy="460" rx="210" ry="180" fill="#fff" stroke="#a0b3bc" stroke-width="5"/><path d="M275 295 L155 555" stroke="#c87276" stroke-width="9" fill="none"/><path d="M135 545 L175 545 L155 578Z" fill="#e8c588"/><path d="M275 295 L395 555" stroke="#c87276" stroke-width="9" fill="none"/><path d="M375 545 L415 545 L395 578Z" fill="#e8c588"/><text x="275" y="625" font-size="22" fill="#203e48" text-anchor="middle" font-weight="400">杓狀軟骨位在後方</text><path d="M155 600 L90 555" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M395 600 L460 555" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="585" y="175" width="475" height="70" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="822.5" y="212" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">發聲：聲帶靠攏</text><ellipse cx="820" cy="460" rx="210" ry="180" fill="#fff" stroke="#a0b3bc" stroke-width="5"/><path d="M820 295 L800 555" stroke="#c87276" stroke-width="9" fill="none"/><path d="M780 545 L820 545 L800 578Z" fill="#e8c588"/><path d="M820 295 L840 555" stroke="#c87276" stroke-width="9" fill="none"/><path d="M820 545 L860 545 L840 578Z" fill="#e8c588"/><text x="820" y="625" font-size="22" fill="#203e48" text-anchor="middle" font-weight="400">杓狀軟骨位在後方</text><path d="M670 550 L780 550" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M970 550 L860 550" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="40" y="710" width="1020" height="105" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="747" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">後環杓肌是唯一主要聲帶外展肌；側環杓與杓肌協助內收</text><text x="550.0" y="780" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">箭頭表示杓狀軟骨／聲帶動作的概念；不是肌肉實際止點投影</text></g></svg>