<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">股骨：近端附著、後方粗線與橫切方向</title><desc id="desc">後面觀＋骨幹橫切概念；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="850" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">股骨：近端附著、後方粗線與橫切方向</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">後面觀＋骨幹橫切概念｜回看 38:36–51:30｜非等比例</text><ellipse cx="235" cy="195" rx="65" ry="65" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M285 210L380 270L410 195L455 245L410 330L390 510L440 605L370 660L300 630L310 505L325 305L275 250Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="350" cy="328" rx="18" ry="23" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><path d="M365 370 L365 540" fill="none" stroke="#ba817b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="145" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">後面觀 · 頭向內</text><path d="M470 210 L415 235" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="470" y="220" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">大轉子：多條肌肉附著</text><path d="M470 330 L350 328" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="470" y="340" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">小轉子：髂腰肌</text><path d="M470 465 L365 465" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="470" y="475" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">粗線：骨幹後方</text><text x="690" y="150" font-size="25" fill="#203e48" text-anchor="start" font-weight="700">骨幹橫切概念</text><path d="M705 255L975 255L845 480Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M817 450L845 480L873 450" fill="none" stroke="#ba817b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><text x="770" y="230" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">前</text><text x="780" y="535" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">後：粗線</text><text x="675" y="595" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">切面輪廓隨高度改變</text><text x="675" y="635" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">不是每處都完美三角形</text><rect x="35" y="710" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="745" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">前方轉子間線、後方轉子間嵴分開；圖左採後面觀，粗線在後。</text><text x="55" y="779" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">大轉子五組課堂清單不代表只有五條腱附著；股骨頸不套用肱骨的兩種頸命名。</text><text x="35" y="830" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>