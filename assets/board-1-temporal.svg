<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">顳骨側面：耳道、顴突、乳突與莖突</title><desc id="desc">單側外面觀；前在左；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">顳骨側面：耳道、顴突、乳突與莖突</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">單側外面觀；前在左｜回看 74:45–86:40｜非等比例</text><path d="M180 205Q360 80 535 205L545 360L445 395L350 340L230 330Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="415" cy="360" rx="38" ry="32" fill="white" stroke="#7899a6" stroke-width="3"/><path d="M230 330L100 310L85 350L215 370" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M460 395L440 515L400 405" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M390 405L365 525L350 410" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="250" y="245" font-size="28" fill="#203e48" text-anchor="start" font-weight="400">鱗部</text><text x="440" y="290" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">乳突部</text><text x="130" y="294" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">顴突</text><path d="M600 330 L440 360" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="340" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">外耳道</text><path d="M600 430 L440 460" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="440" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">乳突</text><path d="M600 520 L370 475" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="530" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">莖突</text><rect x="620" y="145" width="425" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="635" y="180" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">岩部：深部楔形骨區</text><text x="635" y="216" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">內耳與內耳道；側面輪廓不全顯示</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">外耳道開在側面；內耳道在顱內岩部後面，二者不是同一條直通管。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">CN VII：內耳道進入 → 顏面神經管 → 莖乳突孔離開顱骨。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>