<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">眼眶通道：孔裂與共同腱環分兩層讀</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">眼眶通道：孔裂與共同腱環分兩層讀</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 23:00–28:30｜非等比例</text><rect x="45" y="145" width="1010" height="85" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="182" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">共同腱環 annulus of Zinn：四直肌的起點框架</text><text x="550.0" y="215" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">腱環包圍視神經管及眶上裂的部分區域，不是另一個骨孔</text><rect x="45" y="270" width="620" height="365" rx="90" fill="#e9f2ff" stroke="#6e94b6" stroke-width="7"/><text x="355" y="311" font-size="27" fill="#203e48" text-anchor="middle" font-weight="600">腱環內的通路</text><rect x="95" y="345" width="520" height="96" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="355.0" y="382" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">視神經管</text><text x="355.0" y="415" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">視神經 II＋眼動脈</text><rect x="95" y="475" width="520" height="115" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="355.0" y="512" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">眶上裂的環內部分</text><text x="355.0" y="545" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">III 上下支、VI、鼻睫神經 V1</text><rect x="705" y="280" width="355" height="150" rx="12" fill="#fff1db" stroke="#adcac3"/><text x="882.5" y="317" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">眶上裂環外部分</text><text x="882.5" y="350" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">IV、額神經、淚神經 V1</text><text x="883" y="471" font-size="22" fill="#203e48" text-anchor="middle" font-weight="400">眼靜脈通路有變異</text><rect x="705" y="510" width="355" height="115" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="882.5" y="547" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">眶下裂（非共同腱環）</text><text x="882.5" y="580" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">眶下、顴神經等 V2 分支</text><text x="45" y="710" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">記憶順序：先判斷骨孔，再判斷是否在腱環內；V1 不是一整條都同路。</text><text x="45" y="757" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">框圖只示內容分組，不表示真實視神經管、眶上裂與眶下裂的形狀。</text></g></svg>