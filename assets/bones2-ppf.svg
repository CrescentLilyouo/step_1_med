<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 890" role="img" aria-labelledby="title"><title id="title">翼腭窩七種主要交通通道</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#607e90"/></marker></defs><style>text{font-family:'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#173449;font-size:22px}.small{font-size:18px;fill:#4d687b}.title{font-size:30px;font-weight:700}.bold{font-weight:700}.link{fill:none;stroke:#607e90;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#b3cad6;stroke-width:2}</style><rect width="1000" height="890" fill="#f3f8fb"/><text x="40" y="48" class="title">翼腭窩：七種主要通道</text><text x="40" y="82" class="small">箭頭表示交通關係；通過物與精確方向請配合比較表</text><rect x="45" y="115" width="275" height="125" rx="15" class="box"/><text x="65" y="148" class="bold">中顱窩</text><text x="65" y="180" class="">圓孔</text><text x="65" y="214" class="small">V2 上頜神經</text><rect x="680" y="115" width="275" height="125" rx="15" class="box"/><text x="700" y="148" class="bold">眼眶</text><text x="700" y="180" class="">眶下裂</text><text x="700" y="214" class="small">眶下／顴神經等</text><rect x="45" y="330" width="275" height="125" rx="15" class="box"/><text x="65" y="363" class="bold">破裂孔鄰近區</text><text x="65" y="395" class="">翼管</text><text x="65" y="429" class="small">翼管神經</text><rect x="680" y="330" width="275" height="125" rx="15" class="box"/><text x="700" y="363" class="bold">鼻腔</text><text x="700" y="395" class="">蝶腭孔</text><text x="700" y="429" class="small">蝶腭動脈／鼻神經</text><rect x="45" y="545" width="275" height="125" rx="15" class="box"/><text x="65" y="578" class="bold">顳下窩</text><text x="65" y="610" class="">翼上頜裂</text><text x="65" y="644" class="small">上頜動脈／齒槽分支</text><rect x="680" y="545" width="275" height="125" rx="15" class="box"/><text x="700" y="578" class="bold">鼻咽</text><text x="700" y="610" class="">腭鞘管</text><text x="700" y="644" class="small">咽神經／血管</text><rect x="365" y="710" width="275" height="125" rx="15" class="box"/><text x="385" y="743" class="bold">腭／口腔</text><text x="385" y="775" class="">大腭管 → 腭孔</text><text x="385" y="809" class="small">大／小腭神經</text><path d="M430 345L310 230" class="link"/><path d="M570 345L690 230" class="link"/><path d="M400 382H325" class="link"/><path d="M600 382H675" class="link"/><path d="M430 420L310 550" class="link"/><path d="M570 420L690 550" class="link"/><path d="M500 445V705" class="link"/><rect x="395" y="330" width="210" height="115" rx="20" fill="#0f766e"/><text x="420" y="376" style="fill:white;font-size:30px;font-weight:700">翼腭窩</text><text x="420" y="412" style="fill:#dcf7f2;font-size:18px">深部交通樞紐</text><text x="45" y="860" class="small">課堂「七孔六腔」把兩條顱底路線合併記數；此圖保留各通道差異。</text></svg>