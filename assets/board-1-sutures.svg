<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">顱頂骨縫：額、頂、枕與三條主要骨縫</title><desc id="desc">顱頂上面觀；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">顱頂骨縫：額、頂、枕與三條主要骨縫</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">顱頂上面觀｜回看 56:40–64:45｜非等比例</text><ellipse cx="410" cy="370" rx="210" ry="245" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M230 235Q410 190 590 235M410 220L410 500M230 500Q410 570 590 500" fill="none" stroke="#c1837e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="372" y="190" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">前</text><text x="372" y="635" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">後</text><text x="372" y="275" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">額骨</text><text x="265" y="400" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">頂骨</text><text x="460" y="400" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">頂骨</text><text x="372" y="570" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">枕骨</text><path d="M685 220 L570 230" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="685" y="230" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">冠狀縫</text><path d="M685 335 L410 345" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="685" y="345" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">矢狀縫</text><path d="M685 520 L570 510" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="685" y="530" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">人字縫</text><ellipse cx="410" cy="220" rx="9" ry="9" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><ellipse cx="410" cy="525" rx="9" ry="9" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><text x="685" y="610" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">交會點：前囟點／後囟點</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">板書的 F／P／O 改成額骨、頂骨、枕骨；前後方向先寫在圖上。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">冠狀縫是額與頂；矢狀縫是兩頂；人字縫是頂與枕。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>