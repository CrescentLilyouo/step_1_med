<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 925" role="img" aria-labelledby="title desc"><title id="title">七跗骨：內外側路線與蹠骨配對</title><desc id="desc">中文解剖概念圖，非等比例；細節與來源見網頁比較表。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#168674" stroke-width="1.5"/></marker></defs><rect width="1100" height="925" rx="18" fill="#f8fbfd"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="40" y="57" font-size="33" fill="#193f4e" text-anchor="start" font-weight="700">七跗骨：內外側路線與蹠骨配對</text><text x="40" y="96" font-size="20" fill="#627580" text-anchor="start" font-weight="400">本站原創示意｜非等比例，請配合解剖教材閱讀</text><text x="40" y="146" font-size="24" fill="#193f4e" text-anchor="start" font-weight="650">內側（拇趾側）</text><text x="790" y="146" font-size="24" fill="#193f4e" text-anchor="start" font-weight="650">外側（小趾側）</text><rect x="100" y="185" width="420" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="310.0" y="225" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">距骨 talus</text><text x="310.0" y="261" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">上承踝穴，前接舟骨</text><rect x="590" y="185" width="410" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="795.0" y="225" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">跟骨 calcaneus</text><text x="795.0" y="261" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">後下方；前接骰骨</text><rect x="100" y="340" width="420" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="310.0" y="380" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">舟骨 navicular</text><text x="310.0" y="416" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">前方連三塊楔骨</text><rect x="735" y="500" width="280" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="875.0" y="540" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">骰骨 cuboid</text><text x="875.0" y="576" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">主要接第 4、5 蹠骨</text><path d="M310 285 L310 330" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><path d="M880 285 L880 490" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="500" width="200" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="165.0" y="540" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">內楔骨</text><rect x="290" y="500" width="200" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="390.0" y="540" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">中楔骨</text><rect x="515" y="500" width="200" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="615.0" y="540" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">外楔骨</text><path d="M310 440 L165 490" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><path d="M310 440 L390 490" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><path d="M310 440 L615 490" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><rect x="90" y="680" width="140" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="160.0" y="720" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">第 1 蹠骨</text><path d="M165 600 L160 670" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><rect x="270" y="680" width="140" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="340.0" y="720" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">第 2 蹠骨</text><path d="M390 600 L340 670" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><rect x="450" y="680" width="140" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="520.0" y="720" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">第 3 蹠骨</text><path d="M615 600 L520 670" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><rect x="720" y="680" width="140" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="790.0" y="720" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">第 4 蹠骨</text><path d="M875 600 L790 670" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><rect x="900" y="680" width="140" height="100" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="970.0" y="720" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">第 5 蹠骨</text><path d="M875 600 L970 670" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><text x="40" y="837" font-size="22" fill="#193f4e" text-anchor="start" font-weight="400">排列關係圖：跟骨實際位在距骨下方；圖塊分開只是便於讀取。</text><text x="40" y="875" font-size="22" fill="#193f4e" text-anchor="start" font-weight="400">距骨、跟骨、舟骨、骰骨＋三楔骨＝七跗骨。來源：S113、S123。</text></g></svg>