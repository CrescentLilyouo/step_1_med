<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 865" role="img" aria-labelledby="title desc"><title id="title">斜肌繞行：先畫滑車，再看拉力</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="865" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">斜肌繞行：先畫滑車，再看拉力</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 14:00–22:00｜非等比例</text><text x="35" y="150" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">右眼外側的概念投影：後方在左，前方在右</text><circle cx="675" cy="380" r="170" fill="#fff" stroke="#829fac" stroke-width="5"/><path d="M818 285 Q900 380 818 475" fill="#e4f3f9" stroke="#829fac" stroke-width="4"/><circle cx="920" cy="210" r="24" fill="#ffe3ad" stroke="#bb8d39" stroke-width="4"/><path d="M170 210 L900 210 L625 255" fill="none" stroke="#c87276" stroke-width="12"/><path d="M860 525 Q810 610 620 490" fill="none" stroke="#d5a655" stroke-width="12"/><path d="M170 380 L770 380" fill="none" stroke="#638dba" stroke-width="12"/><text x="160" y="186" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">上斜肌 → 前內上方滑車 → 後外上方鞏膜</text><text x="665" y="650" font-size="23" fill="#203e48" text-anchor="middle" font-weight="400">下斜肌：前內側起 → 後外下方鞏膜</text><text x="85" y="426" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">外直肌：後方共同腱環起</text><text x="850" y="173" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">滑車</text><text x="850" y="440" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">角膜／前方</text><rect x="40" y="710" width="1020" height="100" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="747" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">附著點、受力方向、眼球轉動：是三件不同的事</text><text x="550.0" y="780" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">外側投影把內側滑車投影出來；不是顯露骨頭後的精確照片</text></g></svg>