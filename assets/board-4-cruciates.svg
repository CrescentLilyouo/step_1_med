<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 885" role="img" aria-labelledby="title desc"><title id="title">十字韌帶：附著端與限制方向</title><desc id="desc">中文解剖概念圖，非等比例；細節與來源見網頁比較表。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#168674" stroke-width="1.5"/></marker></defs><rect width="1100" height="885" rx="18" fill="#f8fbfd"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="40" y="57" font-size="33" fill="#193f4e" text-anchor="start" font-weight="700">十字韌帶：附著端與限制方向</text><text x="40" y="96" font-size="20" fill="#627580" text-anchor="start" font-weight="400">本站原創示意｜非等比例，請配合解剖教材閱讀</text><rect x="40" y="145" width="490" height="95" rx="16" fill="#e7f2ff" stroke="#a5c7c0"/><text x="285.0" y="185" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">ACL 前十字韌帶</text><rect x="65" y="285" width="440" height="85" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="285.0" y="325" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">股骨外髁的內側面</text><rect x="65" y="465" width="440" height="85" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="285.0" y="505" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">脛骨前髁間區</text><path d="M285 375 L285 459" stroke="#d18045" stroke-width="13"/><text x="305" y="423" font-size="21" fill="#193f4e" text-anchor="start" font-weight="400">連接</text><rect x="40" y="590" width="490" height="95" rx="16" fill="#fff1da" stroke="#a5c7c0"/><text x="285.0" y="630" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">限制脛骨相對股骨前移</text><rect x="570" y="145" width="490" height="95" rx="16" fill="#e7f2ff" stroke="#a5c7c0"/><text x="815.0" y="185" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">PCL 後十字韌帶</text><rect x="595" y="285" width="440" height="85" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="815.0" y="325" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">股骨內髁的外側面</text><rect x="595" y="465" width="440" height="85" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="815.0" y="505" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">脛骨後髁間區</text><path d="M815 375 L815 459" stroke="#d18045" stroke-width="13"/><text x="835" y="423" font-size="21" fill="#193f4e" text-anchor="start" font-weight="400">連接</text><rect x="570" y="590" width="490" height="95" rx="16" fill="#fff1da" stroke="#a5c7c0"/><text x="815.0" y="630" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">限制脛骨相對股骨後移</text><text x="40" y="746" font-size="25" fill="#193f4e" text-anchor="start" font-weight="600">命名看脛骨附著端；ACL 與 PCL 都是關節囊內、滑膜外。</text><text x="40" y="795" font-size="22" fill="#193f4e" text-anchor="start" font-weight="400">這是端點配對圖，不是實際側面投影；兩條韌帶在三維空間交叉。</text><text x="40" y="843" font-size="20" fill="#193f4e" text-anchor="start" font-weight="400">核對來源：S118 ACL；S119 PCL。</text></g></svg>