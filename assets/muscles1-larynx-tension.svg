<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 885" role="img" aria-labelledby="title desc"><title id="title">喉肌：聲帶長短與開閉分開讀</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="885" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">喉肌：聲帶長短與開閉分開讀</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 88:00–96:30｜非等比例</text><rect x="40" y="155" width="490" height="90" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="285.0" y="192" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">環甲肌：張力增加</text><text x="285.0" y="225" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">甲狀與環狀軟骨相對傾動</text><rect x="570" y="155" width="490" height="90" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="815.0" y="192" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">甲杓肌／聲肌：調整張力</text><text x="815.0" y="225" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">甲杓肌可縮短；聲肌精細調整</text><path d="M160 320 L160 520 L350 520 L350 340" stroke="#6f95a6" stroke-width="10" fill="none"/><ellipse cx="260" cy="600" rx="155" ry="48" fill="#e2edf1" stroke="#6f95a6" stroke-width="5"/><text x="250" y="420" font-size="23" fill="#203e48" text-anchor="middle" font-weight="400">甲狀軟骨</text><text x="260" y="608" font-size="23" fill="#203e48" text-anchor="middle" font-weight="400">環狀軟骨</text><path d="M690 320 L690 520 L880 520 L880 340" stroke="#6f95a6" stroke-width="10" fill="none"/><ellipse cx="790" cy="600" rx="155" ry="48" fill="#e2edf1" stroke="#6f95a6" stroke-width="5"/><text x="780" y="420" font-size="23" fill="#203e48" text-anchor="middle" font-weight="400">甲狀軟骨</text><text x="790" y="608" font-size="23" fill="#203e48" text-anchor="middle" font-weight="400">環狀軟骨</text><path d="M170 515 L300 575" stroke="#c87276" stroke-width="10" fill="none"/><path d="M220 325 L220 275" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="80" y="677" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">聲帶被拉長，音高控制相關</text><text x="600" y="677" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">不能只把所有張力改變叫關閉</text><rect x="40" y="735" width="1020" height="100" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="772" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">神經：環甲肌 → 上喉神經外支；其餘主要內在喉肌 → 喉返神經</text><text x="550.0" y="805" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">開閉、長短、張力三種問題分別作答，不把「喉肌」只分一張肌</text></g></svg>