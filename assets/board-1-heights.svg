<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">體表橫線：先記地標，再看近似椎體高度</title><desc id="desc">側視高度對照；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">體表橫線：先記地標，再看近似椎體高度</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">側視高度對照｜回看 31:30–44:40｜非等比例</text><path d="M380 155Q310 230 365 305Q440 375 375 445Q320 500 365 570" fill="none" stroke="#7899a6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" /><path d="M240 180 L980 180" fill="none" stroke="#b6c7cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="187" font-size="27" fill="#203e48" text-anchor="start" font-weight="700">T4–T5</text><text x="600" y="166" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">胸骨角／第 2 肋定位</text><path d="M240 305 L980 305" fill="none" stroke="#b6c7cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="312" font-size="27" fill="#203e48" text-anchor="start" font-weight="700">L1</text><text x="600" y="291" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">幽門平面（傳統參考）</text><path d="M240 375 L980 375" fill="none" stroke="#b6c7cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="382" font-size="27" fill="#203e48" text-anchor="start" font-weight="700">L3</text><text x="600" y="361" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">肋下平面（近似）</text><path d="M240 445 L980 445" fill="none" stroke="#b6c7cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="452" font-size="27" fill="#203e48" text-anchor="start" font-weight="700">L4</text><text x="600" y="431" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">髂嵴線（有變異）</text><path d="M240 510 L980 510" fill="none" stroke="#b6c7cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="517" font-size="27" fill="#203e48" text-anchor="start" font-weight="700">L5</text><text x="600" y="496" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">髂結節平面（近似）</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">體表高度是教材的近似參考，不是每個人固定的座標。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">平面、椎體高度與體表點是三個描述方式；姿勢和呼吸會影響對位。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>