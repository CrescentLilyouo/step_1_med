<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">典型椎骨：椎體、椎弓、椎孔與七突</title><desc id="desc">上面觀；前在上；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">典型椎骨：椎體、椎弓、椎孔與七突</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">上面觀；前在上｜回看 59:30–1:09:00、1:17:30–1:24:30｜非等比例</text><ellipse cx="375" cy="240" rx="120" ry="65" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M270 275L260 370Q375 520 490 370L480 275" fill="none" stroke="#7899a6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="375" cy="355" rx="70" ry="70" fill="white" stroke="#7899a6" stroke-width="3"/><path d="M260 370L155 355M490 370L595 355M375 465V565" fill="none" stroke="#7899a6" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="275" cy="355" rx="28" ry="22" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><ellipse cx="475" cy="355" rx="28" ry="22" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><text x="315" y="245" font-size="27" fill="#203e48" text-anchor="start" font-weight="400">椎體</text><text x="340" y="365" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">椎孔</text><text x="315" y="608" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">棘突（後）</text><path d="M30 300 L155 355" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="310" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">橫突</text><path d="M600 235 L475 290" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="245" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">椎弓根</text><path d="M600 480 L445 425" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="490" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">椎板</text><rect x="725" y="310" width="320" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="740" y="345" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">七突＝1＋2＋4</text><text x="740" y="381" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">棘 1、橫 2、關節 4</text><text x="725" y="470" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">上關節突：圖中金色</text><text x="725" y="510" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">下關節突：在下方，未展開</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">前方椎體承重；後方椎弓根＋椎板圍成椎孔，椎孔串成椎管。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">椎間孔在相鄰椎骨側面，不是圖中同一椎骨中央的椎孔。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>