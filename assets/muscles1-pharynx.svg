<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 965" role="img" aria-labelledby="title desc"><title id="title">咽管展開與重疊咽縮肌</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="965" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">咽管展開與重疊咽縮肌</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 62:00–72:30｜非等比例</text><text x="40" y="150" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">管壁示意：上、中、下嚥縮肌彼此重疊，非三個分離橡皮圈</text><path d="M155.0 200 Q330 270 505.0 200 L505.0 360 Q330 430 155.0 360Z" fill="#a3c3e0" fill-opacity=".62" stroke="#65848d" stroke-width="3"/><text x="330" y="315" font-size="27" fill="#203e48" text-anchor="middle" font-weight="600">上咽縮肌</text><path d="M120.0 330 Q330 400 540.0 330 L540.0 490 Q330 560 120.0 490Z" fill="#8abcb0" fill-opacity=".62" stroke="#65848d" stroke-width="3"/><text x="330" y="445" font-size="27" fill="#203e48" text-anchor="middle" font-weight="600">中咽縮肌</text><path d="M85.0 460 Q330 530 575.0 460 L575.0 620 Q330 690 85.0 620Z" fill="#d7b68f" fill-opacity=".62" stroke="#65848d" stroke-width="3"/><text x="330" y="575" font-size="27" fill="#203e48" text-anchor="middle" font-weight="600">下嚥縮肌</text><path d="M330 195 L330 700" stroke="#ac6368" stroke-width="7" fill="none"/><text x="330" y="756" font-size="25" fill="#203e48" text-anchor="middle" font-weight="400">後方：咽縫</text><rect x="665" y="210" width="395" height="110" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="862.5" y="247" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">上部前方框架</text><text x="862.5" y="280" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">翼下顎縫等</text><rect x="665" y="385" width="395" height="110" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="862.5" y="422" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">中部前方框架</text><text x="862.5" y="455" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">舌骨、莖突舌骨韌帶等</text><rect x="665" y="560" width="395" height="110" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="862.5" y="597" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">下部前方框架</text><text x="862.5" y="630" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">甲狀／環狀軟骨區</text><rect x="40" y="815" width="1020" height="105" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="852" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">C6：咽轉為食道的常用層級；不是咽縫固定附著 C6 椎體的證明</text><text x="550.0" y="885" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">吞嚥時有位移；板書位置已用教材核對，完整附著不只上述一個點</text></g></svg>