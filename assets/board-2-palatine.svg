<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">腭骨的 L 形與上頜骨四突</title><desc id="desc">單骨結構展開圖；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">腭骨的 L 形與上頜骨四突</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">單骨結構展開圖｜回看 16:00–22:30、27:30–29:30｜非等比例</text><text x="60" y="145" font-size="26" fill="#203e48" text-anchor="start" font-weight="700">腭骨：L 形結構</text><path d="M200 185H235V430H455V465H200Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="200" y="165" width="100" height="35" rx="12" fill="#f6e5bd" stroke="#b7cbd0" stroke-width="2"/><text x="60" y="285" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">垂直板</text><path d="M170 278 L220 300" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="315" y="507" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">水平板</text><path d="M315 210 L260 185" fill="none" stroke="#7899a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="315" y="220" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">眼眶突（小部分）</text><text x="600" y="145" font-size="26" fill="#203e48" text-anchor="start" font-weight="700">上頜骨：四個突</text><ellipse cx="805" cy="340" rx="75" ry="70" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M805 340 L805 195" fill="none" stroke="#7899a6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><text x="805" y="180" font-size="24" fill="#203e48" text-anchor="middle" font-weight="400">額突</text><path d="M805 340 L1010 340" fill="none" stroke="#7899a6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><text x="1010" y="325" font-size="24" fill="#203e48" text-anchor="middle" font-weight="400">顴突</text><path d="M805 340 L805 495" fill="none" stroke="#7899a6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><text x="805" y="480" font-size="24" fill="#203e48" text-anchor="middle" font-weight="400">齒槽突</text><path d="M805 340 L600 340" fill="none" stroke="#7899a6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="325" font-size="24" fill="#203e48" text-anchor="middle" font-weight="400">腭突</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">腭骨水平板參與硬腭，垂直板参与鼻腔外側壁；眼眶突很小。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">上頜骨腭突與腭骨水平板是兩塊骨的不同部分；顴突也不等於顴骨。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>