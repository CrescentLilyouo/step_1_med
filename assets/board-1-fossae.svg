<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc"><title id="title">三個顱窩：把板書的三層分區補上中文</title><desc id="desc">顱底內面上面觀；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="840" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">三個顱窩：把板書的三層分區補上中文</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">顱底內面上面觀｜回看 68:00–74:45｜非等比例</text><ellipse cx="340" cy="385" rx="235" ry="255" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M130 295Q340 340 550 295M120 430Q340 350 560 430" fill="none" stroke="#ba817b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="252" y="238" font-size="27" fill="#203e48" text-anchor="start" font-weight="400">前顱窩</text><text x="252" y="385" font-size="27" fill="#203e48" text-anchor="start" font-weight="400">中顱窩</text><text x="252" y="530" font-size="27" fill="#203e48" text-anchor="start" font-weight="400">後顱窩</text><ellipse cx="340" cy="590" rx="35" ry="40" fill="white" stroke="#7899a6" stroke-width="3"/><text x="300" y="650" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">枕骨大孔</text><rect x="645" y="155" width="400" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="660" y="190" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">前顱窩 · 額葉</text><text x="660" y="226" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">額骨、篩骨、蝶骨小翼</text><rect x="645" y="300" width="400" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="660" y="335" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">中顱窩 · 顳葉</text><text x="660" y="371" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">蝶骨大翼、顳骨等</text><rect x="645" y="445" width="400" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="660" y="480" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">後顱窩 · 小腦／腦幹</text><text x="660" y="516" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">顳骨岩部、枕骨等</text><rect x="35" y="700" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="735" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">由前向後：三窩逐漸加深。小翼分前／中；岩部上緣分中／後。</text><text x="55" y="769" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">這是分區示意，孔洞另見顱底總表；不能按圖上距離定位實際神經。</text><text x="35" y="820" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>