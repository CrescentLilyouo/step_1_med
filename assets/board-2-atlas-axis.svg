<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">寰椎撐頭，樞椎齒突作旋轉軸</title><desc id="desc">寰枕側面概念＋寰樞上面觀；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">寰椎撐頭，樞椎齒突作旋轉軸</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">寰枕側面概念＋寰樞上面觀｜回看 1:45:30–1:49:00｜非等比例</text><text x="65" y="150" font-size="26" fill="#203e48" text-anchor="start" font-weight="700">寰枕關節：點頭 YES</text><ellipse cx="315" cy="225" rx="190" ry="75" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><ellipse cx="245" cy="295" rx="45" ry="22" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><ellipse cx="385" cy="295" rx="45" ry="22" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><ellipse cx="315" cy="365" rx="170" ry="75" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><ellipse cx="315" cy="365" rx="120" ry="45" fill="white" stroke="#7899a6" stroke-width="3"/><path d="M160 200Q120 290 160 380" fill="none" stroke="#158875" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="260" y="227" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">枕骨</text><text x="225" y="485" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">C1 寰椎：承托頭部</text><text x="610" y="150" font-size="26" fill="#203e48" text-anchor="start" font-weight="700">寰樞關節：搖頭 NO</text><ellipse cx="805" cy="320" rx="175" ry="140" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><ellipse cx="805" cy="320" rx="125" ry="95" fill="white" stroke="#7899a6" stroke-width="3"/><ellipse cx="805" cy="230" rx="34" ry="50" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><path d="M685 280 L925 280" fill="none" stroke="#ba817b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M675 400Q805 510 945 395" fill="none" stroke="#158875" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="840" y="240" font-size="23" fill="#203e48" text-anchor="start" font-weight="400">齒突 C2</text><text x="655" y="565" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">橫韌帶在齒突後方固定其位置</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">左側示意 C1 上關節面與枕髁配對；右側為 C1 上面觀，前在上。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">YES 主要寰枕；NO 主要寰樞。C1 沒有典型椎體／棘突，仍有前後弓。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>