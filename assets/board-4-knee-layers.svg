<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">膝的囊與滑膜：十字韌帶在哪一層？</title><desc id="desc">囊—滑膜拓撲概念圖；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">膝的囊與滑膜：十字韌帶在哪一層？</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">囊—滑膜拓撲概念圖｜回看 51:30–1:00:00｜非等比例</text><ellipse cx="335" cy="355" rx="230" ry="215" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><ellipse cx="335" cy="355" rx="190" ry="175" fill="white" stroke="#7899a6" stroke-width="3"/><path d="M180 430Q250 470 285 360L335 285L390 360Q420 470 490 430" fill="none" stroke="#c1837e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="335" cy="355" rx="45" ry="65" fill="#dcefe8" stroke="#7899a6" stroke-width="3"/><text x="310" y="353" font-size="18" fill="#203e48" text-anchor="start" font-weight="400">ACL</text><text x="310" y="382" font-size="18" fill="#203e48" text-anchor="start" font-weight="400">PCL</text><text x="270" y="550" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">十字韌帶</text><rect x="650" y="160" width="395" height="95" rx="12" fill="#dcebf0" stroke="#b7cbd0" stroke-width="2"/><text x="665" y="195" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">關節囊內</text><text x="665" y="231" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">十字韌帶在囊內</text><rect x="650" y="290" width="395" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="665" y="325" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">滑膜腔外</text><text x="665" y="361" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">滑膜反折，將十字韌帶排除</text><rect x="650" y="420" width="395" height="95" rx="12" fill="#f6e5bd" stroke="#b7cbd0" stroke-width="2"/><text x="665" y="455" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">半月板：纖維軟骨</text><text x="665" y="491" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">內側較 C 形；外側較近 O 形</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">圈層是空間分類圖，不是實際 MRI 切面：囊內 ≠ 滑膜腔內。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">十字韌帶囊內、滑膜外；半月板不是覆蓋骨端的透明軟骨。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>