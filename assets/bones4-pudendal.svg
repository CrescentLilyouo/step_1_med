<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">陰部神經：由骨盆繞行至會陰</title><desc id="desc">中文解剖概念圖，非等比例；細節與來源見網頁比較表。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#168674" stroke-width="1.5"/></marker></defs><rect width="1100" height="690" rx="18" fill="#f8fbfd"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="40" y="57" font-size="33" fill="#193f4e" text-anchor="start" font-weight="700">陰部神經：由骨盆繞行至會陰</text><text x="40" y="96" font-size="20" fill="#627580" text-anchor="start" font-weight="400">本站原創示意｜非等比例，請配合解剖教材閱讀</text><rect x="40" y="140" width="300" height="112" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="190.0" y="180" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">① 骨盆內</text><text x="190.0" y="216" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">陰部神經 S2–S4</text><rect x="400" y="140" width="300" height="112" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="550.0" y="180" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">② 大坐骨孔</text><text x="550.0" y="216" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">經梨狀肌下方</text><rect x="760" y="140" width="300" height="112" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="910.0" y="180" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">③ 繞坐骨棘</text><text x="910.0" y="216" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">靠近薦棘韌帶</text><rect x="760" y="330" width="300" height="112" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="910.0" y="370" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">④ 小坐骨孔</text><text x="910.0" y="406" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">通向會陰區</text><rect x="400" y="330" width="300" height="112" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="550.0" y="370" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">⑤ 陰部管</text><text x="550.0" y="406" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">閉孔內肌筋膜形成</text><rect x="40" y="330" width="300" height="112" rx="16" fill="#e5f3ef" stroke="#a5c7c0"/><text x="190.0" y="370" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">⑥ 末梢分支</text><text x="190.0" y="406" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">下直腸、會陰及背神經</text><path d="M340 196 L390 196" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><path d="M700 196 L750 196" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><path d="M910 252 L910 320" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><path d="M760 386 L710 386" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><path d="M400 386 L350 386" fill="none" stroke="#168674" stroke-width="4" marker-end="url(#arr)"/><rect x="40" y="500" width="1020" height="105" rx="16" fill="#fff1da" stroke="#a5c7c0"/><text x="550.0" y="540" font-size="26" fill="#193f4e" text-anchor="middle" font-weight="650">與內陰部動靜脈大致伴行</text><text x="550.0" y="576" font-size="20" fill="#193f4e" text-anchor="middle" font-weight="400">陰部管 ≠ 閉孔管；經小孔到會陰，不是回到腹膜腔</text><text x="40" y="650" font-size="20" fill="#193f4e" text-anchor="start" font-weight="400">核對來源：S114 陰部神經；S125 臀區教材</text></g></svg>