<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">肱骨近端：肌袖 3＋1，溝的附著另列</title><desc id="desc">近端前視展開；依原影片板書構想重繪並核對教材，非逐筆描摹或等比例。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#158875" stroke-width="1.5"/></marker></defs><rect width="1100" height="810" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC,Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="35" y="52" font-size="31" fill="#203e48" text-anchor="start" font-weight="700">肱骨近端：肌袖 3＋1，溝的附著另列</text><text x="35" y="90" font-size="20" fill="#657780" text-anchor="start" font-weight="400">近端前視展開｜回看 33:30–39:00｜非等比例</text><ellipse cx="275" cy="210" rx="75" ry="80" fill="#dcebf0" stroke="#7899a6" stroke-width="3"/><path d="M350 190L410 250L375 410L305 420L290 300" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="410" cy="250" rx="30" ry="45" fill="#f6e5bd" stroke="#7899a6" stroke-width="3"/><ellipse cx="365" cy="340" rx="24" ry="34" fill="#f3d4d1" stroke="#7899a6" stroke-width="3"/><path d="M300 450L370 450L400 575L320 575Z" fill="#dcebf0" stroke="#7899a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M395 295 L375 430" fill="none" stroke="#7899a6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M365 375 L345 430" fill="none" stroke="#7899a6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M378 315 L365 540" fill="none" stroke="#c1837e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="520" y="135" width="520" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="535" y="170" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">大結節：棘上、棘下、小圓</text><text x="535" y="206" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">三塊肌袖；上、中、下三個面</text><rect x="520" y="260" width="520" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="535" y="295" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">小結節：肩胛下肌</text><text x="535" y="331" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">肌袖第四塊；不是大圓肌</text><rect x="520" y="385" width="520" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="535" y="420" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">溝外唇／溝底／內唇</text><text x="535" y="456" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">胸大肌／闊背肌／大圓肌</text><rect x="520" y="510" width="520" height="95" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="535" y="545" font-size="24" fill="#203e48" text-anchor="start" font-weight="700">結節間溝通過：肱二頭肌長頭腱</text><text x="535" y="581" font-size="20" fill="#203e48" text-anchor="start" font-weight="400">通過，不是止在溝底</text><rect x="35" y="650" width="1030" height="94" rx="12" fill="#dcefe8" stroke="#b7cbd0" stroke-width="2"/><text x="55" y="685" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">前視簡圖把肌肉附著分成「結節」與「唇／溝底」兩組。</text><text x="55" y="719" font-size="22" fill="#203e48" text-anchor="start" font-weight="400">圖中粉紅小結節在前面；肱二頭肌長頭腱由盂上方經過此溝。</text><text x="35" y="790" font-size="18" fill="#657780" text-anchor="start" font-weight="400">本站中文重繪／整合；骨形與路徑簡化，精確構造請搭配主題頁和教材原圖。</text></g></svg>