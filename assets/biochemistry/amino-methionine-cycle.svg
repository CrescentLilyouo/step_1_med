<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 870" role="img" aria-labelledby="t d"><title id="t">Methionine與homocysteine分流</title><desc id="d">Methionine形成SAM供甲基，經SAH到homocysteine；一支由B12與methylTHF回到methionine，另一支由B6參與CBS和cystathionase形成cysteine。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="870" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="38" text-anchor="middle" font-size="22">Homocysteine：回收甲基循環，或將硫送往 cysteine</text><rect x="225" y="85" width="310" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="114" text-anchor="middle" font-size="20">Methionine</text><text x="380.0" y="139" text-anchor="middle" font-size="16">與 ATP 形成 SAM</text><path d="M380 160L380 205" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="225" y="215" width="310" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="244" text-anchor="middle" font-size="20">SAM</text><text x="380.0" y="269" text-anchor="middle" font-size="16">把 methyl 交給受質</text><path d="M380 290L380 335" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="225" y="345" width="310" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="374" text-anchor="middle" font-size="20">SAH → Homocysteine</text><text x="380.0" y="399" text-anchor="middle" font-size="16">完成甲基轉移後的路徑</text><path d="M220 380H35V120H220" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="115" y="233" text-anchor="middle" font-size="18">回甲基化</text><text x="115" y="264" text-anchor="middle" font-size="17">B₁₂ ＋</text><text x="115" y="294" text-anchor="middle" font-size="15">5-methyl-THF</text><path d="M380 420L380 480" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="550" y="455" text-anchor="middle" font-size="18">CBS ＋ serine；B₆</text><rect x="225" y="490" width="310" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="519" text-anchor="middle" font-size="20">Cystathionine</text><text x="380.0" y="544" text-anchor="middle" font-size="16">Transsulfuration</text><path d="M380 565L380 625" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="550" y="600" text-anchor="middle" font-size="17">Cystathionase；B₆</text><rect x="225" y="635" width="310" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="664" text-anchor="middle" font-size="20">Cysteine</text><text x="380.0" y="689" text-anchor="middle" font-size="16">硫來自 methionine；碳骨架來自 serine</text><text x="380" y="762" text-anchor="middle" font-size="20">B₁₂ 缺乏：homocysteine ↑，也可能 MMA ↑</text><text x="380" y="807" text-anchor="middle" font-size="18">葉酸缺乏：homocysteine ↑；不以 MMA ↑ 為典型特徵</text></g></svg>