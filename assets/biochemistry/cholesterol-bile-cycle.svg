<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 730" role="img" aria-labelledby="t"><title id="t">膽酸腸肝循環及糞便流失</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="730" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="40" text-anchor="middle" font-size="25">回收節省成本；流失才需要補充</text><rect x="225" y="80" width="310" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="109" text-anchor="middle" font-size="20">肝：Cholesterol</text><text x="380.0" y="134" text-anchor="middle" font-size="16">CYP7A1 參與經典路徑</text><path d="M380 155L380 190" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="225" y="200" width="310" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="229" text-anchor="middle" font-size="20">Primary bile acids</text><text x="380.0" y="254" text-anchor="middle" font-size="16">結合 glycine／taurine</text><path d="M380 275L380 310" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="225" y="320" width="310" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="349" text-anchor="middle" font-size="20">膽汁 → 腸道</text><text x="380.0" y="374" text-anchor="middle" font-size="16">協助脂質及 ADEK 吸收</text><path d="M380 395L380 430" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="225" y="440" width="310" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="469" text-anchor="middle" font-size="20">末端迴腸回收</text><text x="380.0" y="494" text-anchor="middle" font-size="16">門脈回肝，重複利用</text><path d="M220 475H70V115H220" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="138" y="286" text-anchor="middle" font-size="19">回收</text><path d="M540 355H645V550" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="505" y="560" width="230" height="70" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="620.0" y="589" text-anchor="middle" font-size="20">部分糞便流失</text><text x="620.0" y="614" text-anchor="middle" font-size="16">需由新合成補充</text><text x="250" y="583" text-anchor="middle" font-size="17">細菌可形成 secondary bile acids</text><text x="250" y="617" text-anchor="middle" font-size="17">CA → DCA；CDCA → LCA</text><text x="380" y="690" text-anchor="middle" font-size="18">迴腸 FXR–FGF19 等回饋訊號可降低肝膽酸合成</text></g></svg>