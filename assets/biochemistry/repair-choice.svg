<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" role="img" aria-labelledby="title"><title id="title">由 DNA 損傷推回辨認與修復途徑</title><rect width="760" height="630" fill="#f6faf9"/><g font-family="system-ui,sans-serif" fill="#163e45"><text x="24" y="45" font-size="25" font-weight="650">由 DNA 損傷推回辨認與修復途徑</text><rect x="20" y="68" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="69" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="116" font-size="17" font-weight="600">單一鹼基</text><text x="184" y="100" font-size="19" font-weight="600">去胺或氧化造成小型鹼基異常 → BER</text><text x="184" y="130" font-size="16" font-weight="400">典型由 glycosylase 移除鹼基，留下 AP site。</text><rect x="20" y="170" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="171" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="218" font-size="17" font-weight="600">體積大、扭曲</text><text x="184" y="202" font-size="19" font-weight="600">紫外光造成嘧啶二聚體等損傷 → NER</text><text x="184" y="232" font-size="16" font-weight="400">在損傷兩側切開受損股，移除寡核苷酸後補合。</text><rect x="20" y="272" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="273" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="320" font-size="17" font-weight="600">複製後錯配</text><text x="184" y="304" font-size="19" font-weight="600">錯配鹼基或小型插入／缺失環 → MMR</text><text x="184" y="334" font-size="16" font-weight="400">辨認新股錯誤並切除重製。缺陷可見微衛星不穩定。</text><rect x="20" y="374" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="375" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="422" font-size="17" font-weight="600">雙股斷裂</text><text x="184" y="406" font-size="19" font-weight="600">有姐妹染色分體可作模板 → HR</text><text x="184" y="436" font-size="16" font-weight="400">常見於 S／G₂ 期，以同源序列引導合成。</text><rect x="20" y="476" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="477" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="524" font-size="17" font-weight="600">雙股斷裂</text><text x="184" y="508" font-size="19" font-weight="600">斷端直接接合 → NHEJ</text><text x="184" y="538" font-size="16" font-weight="400">可在 G₁ 運作。需修整不相容斷端時可能產生插入或缺失。</text><text x="24" y="616" font-size="15" font-weight="400">聚合酶在合成當下以 3′→5′ 外切酶校讀，已逃過校讀的錯配可再由 MMR 處理。</text></g></svg>