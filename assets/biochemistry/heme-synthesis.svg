<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" role="img" aria-labelledby="title"><title id="title">血基質合成經過三個區段</title><rect width="760" height="630" fill="#f6faf9"/><g font-family="system-ui,sans-serif" fill="#163e45"><text x="24" y="45" font-size="25" font-weight="650">血基質合成經過三個區段</text><rect x="20" y="68" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="69" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="116" font-size="17" font-weight="600">粒線體基質</text><text x="184" y="100" font-size="19" font-weight="600">Glycine ＋ succinyl-CoA → ALA</text><text x="184" y="130" font-size="16" font-weight="400">ALA synthase 需要 PLP（維生素 B₆）。</text><rect x="20" y="170" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="171" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="218" font-size="17" font-weight="600">胞質</text><text x="184" y="202" font-size="19" font-weight="600">2 ALA → porphobilinogen（PBG）</text><text x="184" y="232" font-size="16" font-weight="400">ALA dehydratase 受鉛抑制。每個 PBG 有一個吡咯環。</text><rect x="20" y="272" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="273" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="320" font-size="17" font-weight="600">胞質</text><text x="184" y="304" font-size="19" font-weight="600">4 PBG → 線狀四吡咯 → uroporphyrinogen III</text><text x="184" y="334" font-size="16" font-weight="400">HMBS 組裝線狀分子，再由 UROS 形成 III 型環。</text><rect x="20" y="374" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="375" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="422" font-size="17" font-weight="600">胞質 → 粒線體</text><text x="184" y="406" font-size="19" font-weight="600">Uroporphyrinogen III → coproporphyrinogen III</text><text x="184" y="436" font-size="16" font-weight="400">脫羧後進入粒線體，再經氧化形成 protoporphyrin IX。</text><rect x="20" y="476" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="477" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="524" font-size="17" font-weight="600">粒線體內膜</text><text x="184" y="508" font-size="19" font-weight="600">Protoporphyrin IX ＋ Fe²⁺ → heme</text><text x="184" y="538" font-size="16" font-weight="400">Ferrochelatase 將鐵嵌入環中央，也是鉛的作用位置。</text><text x="24" y="616" font-size="15" font-weight="400">每個 heme 需要 8 個 ALA，合計來自 8 個 glycine 與 8 個 succinyl-CoA。</text></g></svg>