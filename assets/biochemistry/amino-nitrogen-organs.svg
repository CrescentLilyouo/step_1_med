<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" role="img" aria-labelledby="t d"><title id="t">跨器官氮運輸</title><desc id="d">肌肉以alanine及glutamine輸送氮；肝以尿素排氮，腎以銨排氮並參與酸鹼調節。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="720" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="38" text-anchor="middle" font-size="25">同樣運氮，目的地決定最後形式</text><rect x="210" y="80" width="340" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="109" text-anchor="middle" font-size="20">肌肉／其他周邊組織</text><text x="380.0" y="134" text-anchor="middle" font-size="16">氮集中到 glutamate 等中間物</text><path d="M280 155V200H190V235" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M480 155V200H570V235" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="245" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="274" text-anchor="middle" font-size="20">Alanine</text><text x="190.0" y="299" text-anchor="middle" font-size="16">Pyruvate 接氮；ALT／PLP</text><rect x="420" y="245" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="274" text-anchor="middle" font-size="20">Glutamine</text><text x="570.0" y="299" text-anchor="middle" font-size="16">多接一個 amide 氮；耗 ATP</text><path d="M190 320L190 375" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M570 320L570 375" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="385" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="414" text-anchor="middle" font-size="20">肝：糖－丙胺酸循環</text><text x="190.0" y="439" text-anchor="middle" font-size="16">氮 → urea；碳 → 供糖</text><rect x="420" y="385" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="414" text-anchor="middle" font-size="20">腎：glutamine 分解</text><text x="570.0" y="439" text-anchor="middle" font-size="16">NH₄⁺ 尿排出；酸鹼調節</text><path d="M425 300H380V505H190V535" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="545" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="574" text-anchor="middle" font-size="20">Glutamine 亦可供肝等使用</text><text x="190.0" y="599" text-anchor="middle" font-size="16">不是只能送往腎臟</text><text x="560" y="560" text-anchor="middle" font-size="20">尿素：主要由肝製造</text><text x="560" y="596" text-anchor="middle" font-size="20">銨排泄：腎的重要任務</text><text x="380" y="677" text-anchor="middle" font-size="17">Glutamate 有 1 個氮；glutamine 有 α-amino 與 amide 共 2 個氮</text></g></svg>