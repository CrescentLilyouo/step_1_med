<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" role="img"><title>分泌路徑的區室與故障線索</title><desc>依蛋白所在區室尋找受影響的步驟。</desc><rect width="760" height="305" rx="12" fill="#f5f9f8"/><g font-family="system-ui,sans-serif" fill="#154940"><text x="20" y="35" font-size="24" font-weight="700">分泌路徑的區室與故障線索</text><rect x="9" width="742" height="41" y="55" rx="5" fill="#d0e6df"/><text x="20" y="81" font-size="17">區室</text><text x="195" y="81" font-size="17">處理步驟</text><text x="377" y="81" font-size="17">若受阻</text><text x="574" y="81" font-size="17">典型線索</text><rect x="9" width="742" height="41" y="100" rx="5" fill="#ffffff"/><text x="20" y="126" font-size="17">胞質 → ER</text><text x="195" y="126" font-size="17">SRP 導引</text><text x="377" y="126" font-size="17">進入 ER 減少</text><text x="574" y="126" font-size="17">訊號肽異常</text><rect x="9" width="742" height="41" y="145" rx="5" fill="#e9f2ef"/><text x="20" y="171" font-size="17">ER 腔</text><text x="195" y="171" font-size="17">折疊與二硫鍵</text><text x="377" y="171" font-size="17">異常鏈滯留</text><text x="574" y="171" font-size="17">品質管制</text><rect x="9" width="742" height="41" y="190" rx="5" fill="#ffffff"/><text x="20" y="216" font-size="17">Golgi</text><text x="195" y="216" font-size="17">溶小體酵素分選</text><text x="377" y="216" font-size="17">酵素外流</text><text x="574" y="216" font-size="17">M6P 標記不足</text><rect x="9" width="742" height="41" y="235" rx="5" fill="#e9f2ef"/><text x="20" y="261" font-size="17">分泌顆粒</text><text x="195" y="261" font-size="17">前驅物切割</text><text x="377" y="261" font-size="17">成熟產物減少</text><text x="574" y="261" font-size="17">胰島素加工</text></g></svg>
