<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 655" role="img" aria-labelledby="title desc"><title id="title">TCA八步與每圈能量</title><desc id="desc">由OAA加acetyl-CoA開始，依序citrate、isocitrate、alpha-ketoglutarate、succinyl-CoA、succinate、fumarate、malate回OAA。每圈3 NADH、1 FAD相關當量、1 GTP與2 CO2。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="655" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="32" text-anchor="middle" font-size="24">TCA：順時針追碳與電子</text><rect x="40" y="75" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="155.0" y="101" text-anchor="middle" font-size="20">OAA</text><text x="155.0" y="124" text-anchor="middle" font-size="15">4C；一圈後再生</text><rect x="490" y="75" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="605.0" y="101" text-anchor="middle" font-size="20">Citrate</text><text x="605.0" y="124" text-anchor="middle" font-size="15">6C</text><rect x="490" y="205" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="605.0" y="231" text-anchor="middle" font-size="20">Isocitrate</text><text x="605.0" y="254" text-anchor="middle" font-size="15">6C</text><rect x="490" y="335" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="605.0" y="361" text-anchor="middle" font-size="20">α-KG</text><text x="605.0" y="384" text-anchor="middle" font-size="15">5C</text><rect x="490" y="465" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="605.0" y="491" text-anchor="middle" font-size="20">Succinyl-CoA</text><text x="605.0" y="514" text-anchor="middle" font-size="15">4C</text><rect x="40" y="465" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="155.0" y="491" text-anchor="middle" font-size="20">Succinate</text><text x="155.0" y="514" text-anchor="middle" font-size="15">4C</text><rect x="40" y="335" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="155.0" y="361" text-anchor="middle" font-size="20">Fumarate</text><text x="155.0" y="384" text-anchor="middle" font-size="15">4C</text><rect x="40" y="205" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="155.0" y="231" text-anchor="middle" font-size="20">Malate</text><text x="155.0" y="254" text-anchor="middle" font-size="15">4C</text><path d="M275 106L485 106" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><text x="380" y="78" text-anchor="middle" font-size="16">+ Acetyl-CoA (2C)</text><text x="380" y="135" text-anchor="middle" font-size="15">1  Citrate synthase</text><path d="M605 140L605 200" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><rect x="500" y="162" width="210" height="23" fill="#f8fbfa"/><text x="605" y="179" text-anchor="middle" font-size="16">2  Aconitase</text><path d="M605 270L605 330" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><rect x="500" y="290" width="210" height="23" fill="#f8fbfa"/><text x="605" y="307" text-anchor="middle" font-size="16">3  NADH + CO₂</text><path d="M605 400L605 460" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><rect x="500" y="420" width="210" height="23" fill="#f8fbfa"/><text x="605" y="437" text-anchor="middle" font-size="16">4  NADH + CO₂</text><path d="M485 495L275 495" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><text x="380" y="480" text-anchor="middle" font-size="16">5  GTP／ATP</text><text x="380" y="522" text-anchor="middle" font-size="15">釋出 CoA</text><path d="M155 460L155 400" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="420" width="210" height="23" fill="#f8fbfa"/><text x="155" y="437" text-anchor="middle" font-size="16">6  FAD → CoQ</text><path d="M155 330L155 270" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="290" width="210" height="23" fill="#f8fbfa"/><text x="155" y="307" text-anchor="middle" font-size="16">7  加水</text><path d="M155 200L155 140" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="162" width="210" height="23" fill="#f8fbfa"/><text x="155" y="179" text-anchor="middle" font-size="16">8  NADH</text><text x="380" y="240" text-anchor="middle" font-size="20">每圈淨收益</text><text x="380" y="280" text-anchor="middle" font-size="20">3 NADH</text><text x="380" y="318" text-anchor="middle" font-size="20">1 FAD 當量</text><text x="380" y="356" text-anchor="middle" font-size="20">1 GTP／ATP</text><text x="380" y="394" text-anchor="middle" font-size="20">2 CO₂</text><text x="380" y="582" text-anchor="middle" font-size="20">3 × 2.5 + 1 × 1.5 + 1 ≈ 10 ATP 當量</text><text x="380" y="620" text-anchor="middle" font-size="17">需完成整圈及後續電子氧化；OAA 不淨增加</text></g></svg>