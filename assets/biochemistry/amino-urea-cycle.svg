<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1010" role="img" aria-labelledby="t d"><title id="t">尿素循環：兩個氮、兩個區室、四個高能磷酸鍵</title><desc id="d">粒線體CPSI與OTC生成citrulline，胞質ASS1加入aspartate，ASL產fumarate，arginase產urea及ornithine。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="1010" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="36" text-anchor="middle" font-size="25">尿素循環：追氮來源，也追 ATP 去向</text><rect x="110" y="65" width="600" height="310" rx="15" fill="#e7eff6"/><text x="615" y="96" text-anchor="middle" font-size="18">粒線體基質</text><rect x="210" y="110" width="330" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="375.0" y="139" text-anchor="middle" font-size="20">NH₄⁺ ＋ HCO₃⁻</text><text x="375.0" y="164" text-anchor="middle" font-size="16">第一個氮 ＋ 尿素的碳</text><path d="M375 184L375 232" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="520" y="212" text-anchor="middle" font-size="18">CPS-I · 2 ATP</text><text x="205" y="212" text-anchor="middle" font-size="16">NAG 活化</text><rect x="210" y="240" width="330" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="375.0" y="269" text-anchor="middle" font-size="20">Carbamoyl phosphate</text><text x="375.0" y="294" text-anchor="middle" font-size="16">OTC 再接上 ornithine</text><path d="M375 315L375 398" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="510" y="355" text-anchor="middle" font-size="18">OTC</text><rect x="210" y="410" width="330" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="375.0" y="439" text-anchor="middle" font-size="20">Citrulline</text><text x="375.0" y="464" text-anchor="middle" font-size="16">離開粒線體，進入胞質</text><text x="642" y="453" text-anchor="middle" font-size="20">胞質</text><path d="M375 485L375 540" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="510" y="515" text-anchor="middle" font-size="17">ASS1 · ATP → AMP</text><rect x="25" y="510" width="170" height="70" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="110.0" y="539" text-anchor="middle" font-size="20">Aspartate</text><text x="110.0" y="564" text-anchor="middle" font-size="16">第二個氮</text><path d="M200 545L205 570" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="210" y="550" width="330" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="375.0" y="579" text-anchor="middle" font-size="20">Argininosuccinate</text><text x="375.0" y="604" text-anchor="middle" font-size="16">兩個氮都已進入骨架</text><path d="M375 625L375 680" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="478" y="657" text-anchor="middle" font-size="18">ASL</text><path d="M545 585H638V650" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="550" y="660" width="180" height="70" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="640.0" y="689" text-anchor="middle" font-size="20">Fumarate</text><text x="640.0" y="714" text-anchor="middle" font-size="16">連回 TCA</text><rect x="210" y="690" width="330" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="375.0" y="719" text-anchor="middle" font-size="20">Arginine</text><text x="375.0" y="744" text-anchor="middle" font-size="16">Arginase 水解</text><path d="M375 765L375 810" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="210" y="820" width="330" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="375.0" y="849" text-anchor="middle" font-size="20">Ornithine ＋ Urea</text><text x="375.0" y="874" text-anchor="middle" font-size="16">Ornithine 回收；urea 排氮</text><path d="M205 855H10V350H355" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="75" y="465" text-anchor="middle" font-size="16">回收</text><text x="380" y="943" text-anchor="middle" font-size="22">總計 3 ATP，但消耗 4 個高能磷酸鍵當量</text><text x="380" y="979" text-anchor="middle" font-size="17">NH₄⁺、aspartate 各供一個氮；不要把 ornithine 當淨消耗物</text></g></svg>