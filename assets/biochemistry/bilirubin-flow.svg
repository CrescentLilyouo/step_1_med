<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" role="img" aria-labelledby="title"><title id="title">沿膽紅素的移動方向定位黃疸</title><rect width="760" height="630" fill="#f6faf9"/><g font-family="system-ui,sans-serif" fill="#163e45"><text x="24" y="45" font-size="25" font-weight="650">沿膽紅素的移動方向定位黃疸</text><rect x="20" y="68" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="69" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="116" font-size="17" font-weight="600">巨噬細胞</text><text x="184" y="100" font-size="19" font-weight="600">Heme → biliverdin → 未結合膽紅素</text><text x="184" y="130" font-size="16" font-weight="400">Heme oxygenase 開環，biliverdin reductase 再還原膽綠素。</text><rect x="20" y="170" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="171" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="218" font-size="17" font-weight="600">血漿</text><text x="184" y="202" font-size="19" font-weight="600">未結合膽紅素與 albumin 結合運送</text><text x="184" y="232" font-size="16" font-weight="400">白蛋白結合限制腎絲球過濾，因此單純溶血時尿膽紅素通常陰性。</text><rect x="20" y="272" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="273" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="320" font-size="17" font-weight="600">肝細胞</text><text x="184" y="304" font-size="19" font-weight="600">UGT1A1 加上 glucuronic acid</text><text x="184" y="334" font-size="16" font-weight="400">結合後水溶性提高，可經 MRP2 排入膽小管。</text><rect x="20" y="374" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="375" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="422" font-size="17" font-weight="600">腸道</text><text x="184" y="406" font-size="19" font-weight="600">結合膽紅素 → urobilinogen</text><text x="184" y="436" font-size="16" font-weight="400">腸菌參與轉化。多數後續形成糞便色素，部分經門脈回肝。</text><rect x="20" y="476" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="477" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="524" font-size="17" font-weight="600">腎臟</text><text x="184" y="508" font-size="19" font-weight="600">部分尿膽素原到尿中，氧化成 urobilin</text><text x="184" y="538" font-size="16" font-weight="400">膽汁阻塞時血中結合膽紅素可增加，使尿膽紅素轉陽性。</text><text x="24" y="616" font-size="15" font-weight="400">判題時分開讀血清膽紅素分型、尿膽紅素、尿膽素原與糞色。</text></g></svg>