<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 730" role="img" aria-labelledby="t"><title id="t">脂質分類：先看骨架，再看頭部</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="730" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="40" text-anchor="middle" font-size="26">先看骨架，再看頭部</text><rect x="40" y="80" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="109" text-anchor="middle" font-size="20">Glycerol 骨架</text><text x="190.0" y="134" text-anchor="middle" font-size="16">甘油</text><rect x="420" y="80" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="109" text-anchor="middle" font-size="20">Sphingosine 骨架</text><text x="570.0" y="134" text-anchor="middle" font-size="16">鞘氨醇</text><path d="M190 155L190 195" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M570 155L570 195" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="205" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="234" text-anchor="middle" font-size="20">TAG／甘油磷脂</text><text x="190.0" y="259" text-anchor="middle" font-size="16">TAG：三條脂醯鏈</text><rect x="420" y="205" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="234" text-anchor="middle" font-size="20">Ceramide</text><text x="570.0" y="259" text-anchor="middle" font-size="16">Amide 鍵接一條脂肪酸</text><path d="M190 280L190 320" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M570 280L570 320" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="330" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="359" text-anchor="middle" font-size="20">磷酸頭部 → PC、PE、PI</text><text x="190.0" y="384" text-anchor="middle" font-size="16">甘油磷脂</text><rect x="420" y="330" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="359" text-anchor="middle" font-size="20">磷酸膽鹼 → Sphingomyelin</text><text x="570.0" y="384" text-anchor="middle" font-size="16">屬磷脂，也屬鞘脂</text><path d="M725 240H740V470H725" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="420" y="435" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="464" text-anchor="middle" font-size="20">糖頭部 → Glycosphingolipid</text><text x="570.0" y="489" text-anchor="middle" font-size="16">Cerebroside／ganglioside</text><text x="190" y="460" text-anchor="middle" font-size="20">磷脂 ≠ 全部都有甘油</text><text x="190" y="494" text-anchor="middle" font-size="18">鞘磷脂是關鍵例外</text><rect x="90" y="555" width="580" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="584" text-anchor="middle" font-size="20">Cholesterol：另外一種 sterol 骨架</text><text x="380.0" y="609" text-anchor="middle" font-size="16">四個融合環；不是甘油或鞘氨醇</text><text x="380" y="682" text-anchor="middle" font-size="18">儲能脂滴、細胞膜與訊息脂質：功能要配合結構判斷</text></g></svg>