<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" role="img" aria-labelledby="t d"><title id="t">芳香族胺基酸神經傳導物路徑</title><desc id="d">Tyrosine以BH4 hydroxylation產DOPA，以PLP decarboxylation產dopamine，再以Cu與vitaminC支持DBH產norepinephrine，PNMT使用SAM產epinephrine；tryptophan經BH4與PLP步驟產serotonin。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="880" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="36" text-anchor="middle" font-size="25">先羥化、再脫羧：兩條路一起記</text><rect x="40" y="85" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="114" text-anchor="middle" font-size="20">Tyrosine</text><text x="190.0" y="139" text-anchor="middle" font-size="16">Catecholamine 前驅物</text><rect x="420" y="85" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="114" text-anchor="middle" font-size="20">Tryptophan</text><text x="570.0" y="139" text-anchor="middle" font-size="16">Serotonin 前驅物</text><path d="M65 160L65 220" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M445 160L445 220" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="190" y="193" text-anchor="middle" font-size="19">TH ＋ BH₄</text><text x="570" y="193" text-anchor="middle" font-size="19">TPH ＋ BH₄</text><rect x="40" y="230" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="259" text-anchor="middle" font-size="20">L-DOPA</text><text x="190.0" y="284" text-anchor="middle" font-size="16">Hydroxylation 後</text><rect x="420" y="230" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="259" text-anchor="middle" font-size="20">5-Hydroxytryptophan</text><text x="570.0" y="284" text-anchor="middle" font-size="16">Hydroxylation 後</text><path d="M65 305L65 365" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M445 305L445 365" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="190" y="340" text-anchor="middle" font-size="18">AADC ＋ PLP（B₆）</text><text x="570" y="340" text-anchor="middle" font-size="18">AADC ＋ PLP（B₆）</text><rect x="40" y="375" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="404" text-anchor="middle" font-size="20">Dopamine</text><text x="190.0" y="429" text-anchor="middle" font-size="16">Decarboxylation 後</text><rect x="420" y="375" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="404" text-anchor="middle" font-size="20">Serotonin</text><text x="570.0" y="429" text-anchor="middle" font-size="16">Decarboxylation 後</text><path d="M65 450L65 510" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M445 450L445 655" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="190" y="486" text-anchor="middle" font-size="18">DBH：Cu、vitamin C</text><text x="570" y="515" text-anchor="middle" font-size="18">Acetylation</text><text x="570" y="550" text-anchor="middle" font-size="18">再以 SAM 供甲基</text><rect x="40" y="520" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="549" text-anchor="middle" font-size="20">Norepinephrine</text><text x="190.0" y="574" text-anchor="middle" font-size="16">Dopamine β-hydroxylation</text><path d="M65 595L65 655" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="190" y="631" text-anchor="middle" font-size="18">PNMT ＋ SAM</text><rect x="40" y="665" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="694" text-anchor="middle" font-size="20">Epinephrine</text><text x="190.0" y="719" text-anchor="middle" font-size="16">N-methylation 後</text><rect x="420" y="665" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="694" text-anchor="middle" font-size="20">Melatonin</text><text x="570.0" y="719" text-anchor="middle" font-size="16">乙醯化＋甲基化</text><text x="380" y="798" text-anchor="middle" font-size="22">BH₄ ≠ PLP ≠ SAM：依反應類型辨輔因子</text><text x="380" y="841" text-anchor="middle" font-size="17">圖示為合成主線；組織分布、調控與降解見正文</text></g></svg>