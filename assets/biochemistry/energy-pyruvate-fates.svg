<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="title desc"><title id="title">Pyruvate的四種去向</title><desc id="desc">Pyruvate在胞質可經LDH成lactate或ALT成alanine；進粒線體後可經PDH成acetyl-CoA，或PC成oxaloacetate。每個出口的目的與輔因子不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="640" height="450" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="320" y="30" text-anchor="middle" font-size="22">先問要解決什麼需求，再選出口</text><rect x="210" y="65" width="220" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="320.0" y="92" text-anchor="middle" font-size="20">Pyruvate</text><text x="320.0" y="115" text-anchor="middle" font-size="15">糖解產生的三碳交會點</text><path d="M245 132L160 190" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M395 132L480 190" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="30" y="195" width="260" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="160.0" y="222" text-anchor="middle" font-size="20">Lactate｜LDH</text><text x="160.0" y="245" text-anchor="middle" font-size="15">再生胞質 NAD⁺</text><rect x="350" y="195" width="260" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="480.0" y="222" text-anchor="middle" font-size="20">Alanine｜ALT</text><text x="480.0" y="245" text-anchor="middle" font-size="15">PLP，胺基轉移</text><path d="M300 132L300 250" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M340 132L340 250" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="320" y="280" text-anchor="middle" font-size="17">進入粒線體</text><path d="M300 295L160 325" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M340 295L480 325" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="30" y="330" width="260" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="160.0" y="357" text-anchor="middle" font-size="20">Acetyl-CoA｜PDH</text><text x="160.0" y="380" text-anchor="middle" font-size="15">產 CO₂、NADH；不可逆</text><rect x="350" y="330" width="260" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="480.0" y="357" text-anchor="middle" font-size="20">Oxaloacetate｜PC</text><text x="480.0" y="380" text-anchor="middle" font-size="15">Biotin + ATP，補充碳流</text><text x="320" y="432" text-anchor="middle" font-size="17">LDH／ALT：胞質　｜　PDH／PC：粒線體</text></g></svg>