<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" role="img"><title>乳糖與葡萄糖的四種組合</title><desc>低葡萄糖讓 CAP–cAMP 的正調控增強；仍要同時檢查 LacI。</desc><rect width="760" height="305" rx="12" fill="#f5f9f8"/><g font-family="system-ui,sans-serif" fill="#154940"><text x="20" y="35" font-size="24" font-weight="700">乳糖與葡萄糖的四種組合</text><rect x="9" width="742" height="41" y="55" rx="5" fill="#d0e6df"/><text x="20" y="81" font-size="17">乳糖</text><text x="195" y="81" font-size="17">葡萄糖</text><text x="377" y="81" font-size="17">LacI 抑制</text><text x="574" y="81" font-size="17">預期轉錄</text><rect x="9" width="742" height="41" y="100" rx="5" fill="#ffffff"/><text x="20" y="126" font-size="17">無</text><text x="195" y="126" font-size="17">高</text><text x="377" y="126" font-size="17">保留</text><text x="574" y="126" font-size="17">很低</text><rect x="9" width="742" height="41" y="145" rx="5" fill="#e9f2ef"/><text x="20" y="171" font-size="17">無</text><text x="195" y="171" font-size="17">低</text><text x="377" y="171" font-size="17">保留</text><text x="574" y="171" font-size="17">很低</text><rect x="9" width="742" height="41" y="190" rx="5" fill="#ffffff"/><text x="20" y="216" font-size="17">有</text><text x="195" y="216" font-size="17">高</text><text x="377" y="216" font-size="17">解除</text><text x="574" y="216" font-size="17">較低</text><rect x="9" width="742" height="41" y="235" rx="5" fill="#e9f2ef"/><text x="20" y="261" font-size="17">有</text><text x="195" y="261" font-size="17">低</text><text x="377" y="261" font-size="17">解除</text><text x="574" y="261" font-size="17">最高</text></g></svg>
