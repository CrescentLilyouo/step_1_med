<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" role="img" aria-labelledby="title"><title id="title">嘧啶先組環，接上核糖後再分流</title><rect width="760" height="630" fill="#f6faf9"/><g font-family="system-ui,sans-serif" fill="#163e45"><text x="24" y="45" font-size="25" font-weight="650">嘧啶先組環，接上核糖後再分流</text><rect x="20" y="68" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="69" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="116" font-size="17" font-weight="600">胞質 CAD</text><text x="184" y="100" font-size="19" font-weight="600">CPS II → aspartate transcarbamoylase → dihydroorotase</text><text x="184" y="130" font-size="16" font-weight="400">以 glutamine 供氮，再接 aspartate 及閉環。</text><rect x="20" y="170" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="171" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="218" font-size="17" font-weight="600">粒線體內膜</text><text x="184" y="202" font-size="19" font-weight="600">Dihydroorotate → orotate</text><text x="184" y="232" font-size="16" font-weight="400">Dihydroorotate dehydrogenase 連到 ubiquinone。</text><rect x="20" y="272" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="273" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="320" font-size="17" font-weight="600">胞質 UMPS</text><text x="184" y="304" font-size="19" font-weight="600">Orotate ＋ PRPP → OMP → UMP</text><text x="184" y="334" font-size="16" font-weight="400">先接核糖，再脫羧得到 UMP。</text><rect x="20" y="374" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="375" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="422" font-size="17" font-weight="600">核糖核苷酸</text><text x="184" y="406" font-size="19" font-weight="600">UMP → UDP → UTP → CTP</text><text x="184" y="436" font-size="16" font-weight="400">CTP synthetase 由 glutamine 供氮，並消耗 ATP。</text><rect x="20" y="476" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="477" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="524" font-size="17" font-weight="600">去氧核苷酸</text><text x="184" y="508" font-size="19" font-weight="600">dUMP → dTMP</text><text x="184" y="538" font-size="16" font-weight="400">Thymidylate synthase 使用 5,10-methylene-THF，產生 DHF。</text><text x="24" y="616" font-size="15" font-weight="400">Ribonucleotide reductase 作用於 NDP，連接核糖與去氧核苷酸供應。</text></g></svg>