<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc"><title id="title">電子流與質子回流分開看</title><desc id="desc">NADH經I與succinate經II平行匯入CoQ，再到III、cytochrome c、IV，氧還原為水。I III IV建立質子梯度，ATP synthase使用梯度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="640" height="640" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="320" y="30" text-anchor="middle" font-size="22">電子入口平行，質子動力另外耦合</text><rect x="35" y="55" width="250" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="160.0" y="82" text-anchor="middle" font-size="20">NADH → I</text><text x="160.0" y="105" text-anchor="middle" font-size="15">泵出 4 H⁺／2 e⁻</text><rect x="355" y="55" width="250" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="480.0" y="82" text-anchor="middle" font-size="20">Succinate → II</text><text x="480.0" y="105" text-anchor="middle" font-size="15">不泵 H⁺</text><path d="M160 120L275 162" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M480 120L365 162" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="220" y="165" width="200" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="320.0" y="192" text-anchor="middle" font-size="20">CoQ → III</text><text x="320.0" y="215" text-anchor="middle" font-size="15">III：淨移出 4 H⁺／2 e⁻</text><path d="M320 231L320 267" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="220" y="270" width="200" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="320.0" y="297" text-anchor="middle" font-size="20">Cytochrome c</text><text x="320.0" y="320" text-anchor="middle" font-size="15">一次傳 1 e⁻</text><path d="M320 335L320 370" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="220" y="375" width="200" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="320.0" y="402" text-anchor="middle" font-size="20">IV → O₂ → H₂O</text><text x="320.0" y="425" text-anchor="middle" font-size="15">IV：泵出 2 H⁺／2 e⁻</text><text x="320" y="472" text-anchor="middle" font-size="19">I、III、IV：基質 → 膜間腔，建立梯度</text><path d="M45 495H595" stroke="#a4cfc0" stroke-width="2"/><rect x="30" y="515" width="250" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="155.0" y="542" text-anchor="middle" font-size="20">H⁺ 回到基質</text><text x="155.0" y="565" text-anchor="middle" font-size="15">經 ATP synthase</text><path d="M286 547L348 547" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="355" y="515" width="250" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="480.0" y="542" text-anchor="middle" font-size="20">ADP + Pi → ATP</text><text x="480.0" y="565" text-anchor="middle" font-size="15">使用質子動力</text><text x="320" y="612" text-anchor="middle" font-size="18">泵出質子 ≠ 生成水所消耗的化學質子</text></g></svg>