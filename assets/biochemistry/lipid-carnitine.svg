<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 705" role="img" aria-labelledby="title desc"><title id="title">Carnitine shuttle</title><desc id="desc">CPT-I把長鏈脂醯基交carnitine，translocase運過內膜，CPT-II交回基質CoA；malonylCoA抑制CPT-I。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="705" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="35" text-anchor="middle" font-size="25">跨內膜的是 acylcarnitine</text><text x="380" y="72" text-anchor="middle" font-size="20">胞質側：長鏈 acyl-CoA</text><rect x="225" y="95" width="310" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="122" text-anchor="middle" font-size="20">CPT-I（外膜）</text><text x="380.0" y="146" text-anchor="middle" font-size="16">脂醯基：CoA → carnitine</text><text x="115" y="127" text-anchor="middle" font-size="17">Malonyl-CoA</text><path d="M120 148H210M210 139V157" stroke="#a76136" stroke-width="3"/><path d="M380 168L380 198" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><rect x="225" y="205" width="310" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="232" text-anchor="middle" font-size="20">Acylcarnitine</text><text x="380.0" y="256" text-anchor="middle" font-size="16">CoA 留在原側</text><rect x="35" y="300" width="690" height="95" rx="12" fill="#e6eef3"/><text x="130" y="332" text-anchor="middle" font-size="19">粒線體內膜</text><rect x="250" y="313" width="260" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="340" text-anchor="middle" font-size="20">Translocase</text><text x="380.0" y="364" text-anchor="middle" font-size="16">與 carnitine 交換</text><path d="M380 278L380 307" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 402L380 432" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><rect x="225" y="440" width="310" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="467" text-anchor="middle" font-size="20">CPT-II（基質側）</text><text x="380.0" y="491" text-anchor="middle" font-size="16">脂醯基：carnitine → CoA</text><path d="M380 514L380 544" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><rect x="225" y="552" width="310" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="579" text-anchor="middle" font-size="20">基質 acyl-CoA</text><text x="380.0" y="603" text-anchor="middle" font-size="16">進入 β 氧化</text><text x="380" y="669" text-anchor="middle" font-size="18">CPT-I 受 malonyl-CoA 抑制；短中鏈不套同一規則</text></g></svg>