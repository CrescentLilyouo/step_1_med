<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" role="img"><title>兩次轉酯如何接合外顯子</title><desc>第一步釋出外顯子一的 3′-OH，才有第二步的攻擊者。</desc><rect width="760" height="215" rx="12" fill="#f5f9f8"/><g font-family="system-ui,sans-serif" fill="#154940"><text x="20" y="35" font-size="24" font-weight="700">兩次轉酯如何接合外顯子</text><rect x="9" width="742" height="41" y="55" rx="5" fill="#d0e6df"/><text x="20" y="81" font-size="17">反應</text><text x="195" y="81" font-size="17">提供羥基</text><text x="377" y="81" font-size="17">攻擊位置</text><text x="574" y="81" font-size="17">反應後</text><rect x="9" width="742" height="41" y="100" rx="5" fill="#ffffff"/><text x="20" y="126" font-size="17">第一次</text><text x="195" y="126" font-size="17">分支 A 的 2′-OH</text><text x="377" y="126" font-size="17">5′ 剪接位點</text><text x="574" y="126" font-size="17">產生套索鍵</text><rect x="9" width="742" height="41" y="145" rx="5" fill="#e9f2ef"/><text x="20" y="171" font-size="17">第二次</text><text x="195" y="171" font-size="17">外顯子一的 3′-OH</text><text x="377" y="171" font-size="17">3′ 剪接位點</text><text x="574" y="171" font-size="17">兩外顯子相接</text></g></svg>
