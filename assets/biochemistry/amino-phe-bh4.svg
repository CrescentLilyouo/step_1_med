<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 695" role="img" aria-labelledby="t d"><title id="t">Phenylalanine與BH4</title><desc id="d">PAH將phenylalanine變tyrosine並使用BH4，BH4再生缺陷同時影響其他芳香族胺基酸hydroxylase。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="695" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="38" text-anchor="middle" font-size="23">同樣 phenylalanine 高，阻塞點不一定相同</text><rect x="40" y="95" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="124" text-anchor="middle" font-size="20">Phenylalanine</text><text x="190.0" y="149" text-anchor="middle" font-size="16">必需胺基酸</text><path d="M345 130L410 130" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="420" y="95" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="124" text-anchor="middle" font-size="20">Tyrosine</text><text x="570.0" y="149" text-anchor="middle" font-size="16">PAH 阻塞時成為條件必需</text><text x="380" y="195" text-anchor="middle" font-size="20">PAH：hydroxylation，使用 BH₄ 與 O₂</text><rect x="40" y="260" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="289" text-anchor="middle" font-size="20">PAH 本身缺陷</text><text x="190.0" y="314" text-anchor="middle" font-size="16">主要阻塞 Phe → Tyr</text><rect x="420" y="260" width="300" height="70" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="570.0" y="289" text-anchor="middle" font-size="20">BH₄ 合成／再生缺陷</text><text x="570.0" y="314" text-anchor="middle" font-size="16">影響不只 PAH</text><path d="M190 335L190 390" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M570 335L570 390" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="400" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="429" text-anchor="middle" font-size="20">Phe 增加、Tyr 供應受限</text><text x="190.0" y="454" text-anchor="middle" font-size="16">不能只把它當飲食吃太多</text><rect x="420" y="400" width="300" height="70" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="570.0" y="429" text-anchor="middle" font-size="20">其他 hydroxylase 也可能受影響</text><text x="570.0" y="454" text-anchor="middle" font-size="16">Tyrosine／tryptophan 路徑</text><text x="380" y="542" text-anchor="middle" font-size="17">BH₄ 依賴：Phe hydroxylase、Tyr hydroxylase、Trp hydroxylase</text><text x="380" y="588" text-anchor="middle" font-size="20">PLP 依賴：後續芳香族胺基酸 decarboxylase</text><text x="380" y="645" text-anchor="middle" font-size="20">羥化與脫羧不同；不要把 BH₄ 與 B₆ 放在同一步</text></g></svg>