<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-labelledby="title desc"><title id="title">PPP兩階段與用途</title><desc id="desc">胞質G6P氧化產2 NADPH與CO2，形成ribulose5P後可轉核糖或重排成F6P與GAP。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="700" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="36" text-anchor="middle" font-size="24">PPP：電子往還原反應，碳可重新分配</text><rect x="40" y="80" width="300" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="107" text-anchor="middle" font-size="20">G6P（6C）</text><text x="190.0" y="131" text-anchor="middle" font-size="16">氧化段入口</text><path d="M190 150L190 200" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><text x="510" y="158" text-anchor="middle" font-size="17">G6PD ＋ 6PG dehydrogenase</text><rect x="40" y="210" width="300" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="237" text-anchor="middle" font-size="20">Ribulose-5-P（5C）</text><text x="190.0" y="261" text-anchor="middle" font-size="16">每次釋出 1 CO₂</text><rect x="415" y="210" width="305" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="567.5" y="237" text-anchor="middle" font-size="20">2 NADPH</text><text x="567.5" y="261" text-anchor="middle" font-size="16">還原合成／GSH 再生</text><path d="M200 175H568V205" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><path d="M190 282L190 335" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="345" width="300" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="372" text-anchor="middle" font-size="20">Ribose／xylulose-5-P</text><text x="190.0" y="396" text-anchor="middle" font-size="16">核糖合成／碳重排</text><path d="M345 375L410 375" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><rect x="415" y="345" width="305" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="567.5" y="372" text-anchor="middle" font-size="20">五碳糖重排</text><text x="567.5" y="396" text-anchor="middle" font-size="16">Transketolase：2C；需 TPP</text><text x="568" y="439" text-anchor="middle" font-size="18">Transaldolase：3C</text><path d="M568 453L568 485" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><rect x="415" y="495" width="305" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="567.5" y="522" text-anchor="middle" font-size="20">2 F6P ＋ 1 GAP</text><text x="567.5" y="546" text-anchor="middle" font-size="16">總碳數 15C，接糖解／回收</text><text x="205" y="500" text-anchor="middle" font-size="21">非氧化段可逆</text><text x="205" y="535" text-anchor="middle" font-size="18">3 × 5C ⇌ 2 × 6C ＋ 3C</text><text x="380" y="613" text-anchor="middle" font-size="20">氧化段：產 NADPH、CO₂；非氧化段：重排碳骨架</text><text x="380" y="658" text-anchor="middle" font-size="18">PPP 本身不直接產 ATP；不同需求可走不同碳流</text></g></svg>