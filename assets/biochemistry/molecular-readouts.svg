<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" role="img"><title>從問題選擇能保留該資訊的方法</title><desc>先選觀察對象，再讀每種方法可直接支持的推論。</desc><rect width="760" height="305" rx="12" fill="#f5f9f8"/><g font-family="system-ui,sans-serif" fill="#154940"><text x="20" y="35" font-size="24" font-weight="700">從問題選擇能保留該資訊的方法</text><rect x="9" width="742" height="41" y="55" rx="5" fill="#d0e6df"/><text x="20" y="81" font-size="17">要問什麼</text><text x="195" y="81" font-size="17">要保留的資訊</text><text x="377" y="81" font-size="17">代表方法</text><text x="574" y="81" font-size="17">解讀限制</text><rect x="9" width="742" height="41" y="100" rx="5" fill="#ffffff"/><text x="20" y="126" font-size="17">染色體位置</text><text x="195" y="126" font-size="17">原位座標</text><text x="377" y="126" font-size="17">FISH</text><text x="574" y="126" font-size="17">非單鹼基定序</text><rect x="9" width="742" height="41" y="145" rx="5" fill="#e9f2ef"/><text x="20" y="171" font-size="17">RNA 相對量</text><text x="195" y="171" font-size="17">RNA 族群</text><text x="377" y="171" font-size="17">RT-qPCR</text><text x="574" y="171" font-size="17">須正規化</text><rect x="9" width="742" height="41" y="190" rx="5" fill="#ffffff"/><text x="20" y="216" font-size="17">RNA 大小</text><text x="195" y="216" font-size="17">不同長度</text><text x="377" y="216" font-size="17">Northern</text><text x="574" y="216" font-size="17">量受上樣影響</text><rect x="9" width="742" height="41" y="235" rx="5" fill="#e9f2ef"/><text x="20" y="261" font-size="17">蛋白保護區</text><text x="195" y="261" font-size="17">DNA 切割圖譜</text><text x="377" y="261" font-size="17">Footprinting</text><text x="574" y="261" font-size="17">不直接證明活化</text></g></svg>
