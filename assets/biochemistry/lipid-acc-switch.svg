<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 670" role="img" aria-labelledby="title desc"><title id="title">ACC與脂肪酸代謝協調</title><desc id="desc">餐後與citrate促ACC與malonylCoA，支持FAS並限制CPT-I；能量壓力AMPK抑ACC，減輕CPT-I抑制。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="670" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="35" text-anchor="middle" font-size="24">同一個 malonyl-CoA，連接合成與氧化</text><rect x="40" y="75" width="300" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="102" text-anchor="middle" font-size="20">餐後／碳源充足</text><text x="190.0" y="126" text-anchor="middle" font-size="16">Insulin、citrate</text><rect x="420" y="75" width="300" height="66" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="570.0" y="102" text-anchor="middle" font-size="20">能量壓力</text><text x="570.0" y="126" text-anchor="middle" font-size="16">AMPK 活化</text><path d="M190 150L190 190" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 150L570 190" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="200" width="300" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="227" text-anchor="middle" font-size="20">ACC 活性較高</text><text x="190.0" y="251" text-anchor="middle" font-size="16">Acetyl-CoA → malonyl-CoA</text><rect x="420" y="200" width="300" height="66" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="570.0" y="227" text-anchor="middle" font-size="20">ACC 被磷酸化抑制</text><text x="570.0" y="251" text-anchor="middle" font-size="16">Malonyl-CoA 生成下降</text><path d="M190 275L190 315" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 275L570 315" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="325" width="300" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="352" text-anchor="middle" font-size="20">Malonyl-CoA 增加</text><text x="190.0" y="376" text-anchor="middle" font-size="16">FAS 的延長原料</text><rect x="420" y="325" width="300" height="66" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="570.0" y="352" text-anchor="middle" font-size="20">Malonyl-CoA 降低</text><text x="570.0" y="376" text-anchor="middle" font-size="16">CPT-I 受抑減輕</text><path d="M190 400L190 440" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 400L570 440" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="450" width="300" height="66" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="477" text-anchor="middle" font-size="20">偏向脂肪酸合成</text><text x="190.0" y="501" text-anchor="middle" font-size="16">並限制 CPT-I 入口</text><rect x="420" y="450" width="300" height="66" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="570.0" y="477" text-anchor="middle" font-size="20">較有利長鏈脂肪酸氧化</text><text x="570.0" y="501" text-anchor="middle" font-size="16">仍需受質、氧與其他條件</text><text x="380" y="577" text-anchor="middle" font-size="20">ACC 花 ATP 做 malonyl；FAS 花 NADPH 延長碳鏈</text><text x="380" y="623" text-anchor="middle" font-size="18">磷酸化的結果取決於蛋白：ACC 被抑制，不是被活化</text></g></svg>