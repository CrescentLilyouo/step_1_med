<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img"><title>跟著新生肽走過一輪延長</title><desc>讀同一列看相對位置，沿列往下看肽鏈先轉移、再隨 tRNA 移位。</desc><rect width="760" height="260" rx="12" fill="#f5f9f8"/><g font-family="system-ui,sans-serif" fill="#154940"><text x="20" y="35" font-size="24" font-weight="700">跟著新生肽走過一輪延長</text><rect x="9" width="742" height="41" y="55" rx="5" fill="#d0e6df"/><text x="20" y="81" font-size="17">時間點</text><text x="195" y="81" font-size="17">E 位</text><text x="377" y="81" font-size="17">P 位</text><text x="574" y="81" font-size="17">A 位</text><rect x="9" width="742" height="41" y="100" rx="5" fill="#ffffff"/><text x="20" y="126" font-size="17">遞送完成</text><text x="195" y="126" font-size="17">空或即將離開</text><text x="377" y="126" font-size="17">帶舊肽鏈</text><text x="574" y="126" font-size="17">帶新胺基酸</text><rect x="9" width="742" height="41" y="145" rx="5" fill="#e9f2ef"/><text x="20" y="171" font-size="17">剛成鍵</text><text x="195" y="171" font-size="17">—</text><text x="377" y="171" font-size="17">去醯化 tRNA</text><text x="574" y="171" font-size="17">帶延長的肽鏈</text><rect x="9" width="742" height="41" y="190" rx="5" fill="#ffffff"/><text x="20" y="216" font-size="17">轉位完成</text><text x="195" y="216" font-size="17">去醯化 tRNA</text><text x="377" y="216" font-size="17">帶延長的肽鏈</text><text x="574" y="216" font-size="17">空出</text></g></svg>
