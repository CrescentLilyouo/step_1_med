<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" role="img" aria-labelledby="t"><title id="t">三條脂蛋白運輸線</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="820" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="37" text-anchor="middle" font-size="25">運輸路線：起點與殘粒去向要分開</text><text x="380" y="78" text-anchor="middle" font-size="20">外源性：腸道 → 淋巴 → 循環</text><rect x="25" y="100" width="210" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="130.0" y="129" text-anchor="middle" font-size="20">小腸 CM</text><text x="130.0" y="154" text-anchor="middle" font-size="16">ApoB-48</text><path d="M240 135L270 135" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="280" y="100" width="205" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="382.5" y="129" text-anchor="middle" font-size="20">LPL 卸 TAG</text><text x="382.5" y="154" text-anchor="middle" font-size="16">ApoC-II 支持</text><path d="M490 135L520 135" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="530" y="100" width="205" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="632.5" y="129" text-anchor="middle" font-size="20">CM remnant</text><text x="632.5" y="154" text-anchor="middle" font-size="16">ApoE → 肝</text><text x="382" y="205" text-anchor="middle" font-size="18">脂肪酸供肌肉／脂肪組織使用</text><text x="380" y="264" text-anchor="middle" font-size="20">內源性：肝臟分泌 VLDL；B-100 持續保留</text><rect x="25" y="290" width="210" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="130.0" y="319" text-anchor="middle" font-size="20">肝 VLDL</text><text x="130.0" y="344" text-anchor="middle" font-size="16">富 TAG</text><path d="M240 325L270 325" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="280" y="290" width="205" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="382.5" y="319" text-anchor="middle" font-size="20">IDL</text><text x="382.5" y="344" text-anchor="middle" font-size="16">去 TAG 後的殘粒</text><path d="M490 325L520 325" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="530" y="290" width="205" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="632.5" y="319" text-anchor="middle" font-size="20">LDL</text><text x="632.5" y="344" text-anchor="middle" font-size="16">B-100 → LDLR</text><path d="M382 366L382 405" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="280" y="415" width="205" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="382.5" y="444" text-anchor="middle" font-size="20">部分 IDL 回肝</text><text x="382.5" y="469" text-anchor="middle" font-size="16">ApoE 相關辨識</text><text x="380" y="545" text-anchor="middle" font-size="20">HDL 相關：周邊膽固醇回收</text><rect x="25" y="570" width="210" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="130.0" y="599" text-anchor="middle" font-size="20">周邊細胞</text><text x="130.0" y="624" text-anchor="middle" font-size="16">ABCA1 等輸出</text><path d="M240 605L270 605" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="280" y="570" width="205" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="382.5" y="599" text-anchor="middle" font-size="20">HDL／LCAT</text><text x="382.5" y="624" text-anchor="middle" font-size="16">游離膽固醇 → CE</text><path d="M490 605L520 605" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="530" y="570" width="205" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="632.5" y="599" text-anchor="middle" font-size="20">肝 SR-BI</text><text x="632.5" y="624" text-anchor="middle" font-size="16">選擇性攝取 CE</text><text x="380" y="690" text-anchor="middle" font-size="18">另可經 CETP 與 apoB 顆粒交換，再由其路徑回肝</text><text x="380" y="760" text-anchor="middle" font-size="18">血中游離脂肪酸主要與 albumin 結合；不是另一種 CM</text></g></svg>