<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="title desc"><title id="title">糖質新生三個繞道</title><desc id="desc">PK由PC與PEPCK兩步繞過，分別耗ATP與GTP；PFK1由FBPase1水解繞過；hexokinase由內質網G6Pase繞過。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="640" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="32" text-anchor="middle" font-size="24">三個不可逆關卡，四個繞道酵素</text><text x="380" y="75" text-anchor="middle" font-size="20">① 繞過 pyruvate kinase</text><rect x="25" y="100" width="190" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="120.0" y="126" text-anchor="middle" font-size="20">Pyruvate</text><text x="120.0" y="149" text-anchor="middle" font-size="15">3C</text><rect x="285" y="100" width="190" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="126" text-anchor="middle" font-size="20">OAA</text><text x="380.0" y="149" text-anchor="middle" font-size="15">4C</text><rect x="545" y="100" width="190" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="640.0" y="126" text-anchor="middle" font-size="20">PEP</text><text x="640.0" y="149" text-anchor="middle" font-size="15">3C</text><path d="M220 131L280 131" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><path d="M480 131L540 131" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><text x="250" y="190" text-anchor="middle" font-size="20">PC</text><text x="250" y="216" text-anchor="middle" font-size="16">ATP、biotin、HCO₃⁻</text><text x="250" y="240" text-anchor="middle" font-size="16">粒線體</text><text x="510" y="190" text-anchor="middle" font-size="20">PEPCK</text><text x="510" y="216" text-anchor="middle" font-size="16">GTP → GDP；釋 CO₂</text><text x="510" y="240" text-anchor="middle" font-size="16">胞質／粒線體 isoform</text><path d="M35 270H725" stroke="#b9d1c8"/><text x="380" y="305" text-anchor="middle" font-size="20">② 繞過 PFK-1（胞質）</text><rect x="75" y="330" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="356" text-anchor="middle" font-size="20">F1,6BP</text><text x="190.0" y="379" text-anchor="middle" font-size="15">雙磷酸中間物</text><rect x="455" y="330" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="356" text-anchor="middle" font-size="20">F6P</text><text x="570.0" y="379" text-anchor="middle" font-size="15">單磷酸中間物</text><path d="M310 360L450 360" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><text x="380" y="414" text-anchor="middle" font-size="18">FBPase-1：水解釋 Pi，不產 ATP</text><path d="M35 440H725" stroke="#b9d1c8"/><text x="380" y="475" text-anchor="middle" font-size="20">③ 繞過 hexokinase／glucokinase</text><rect x="75" y="500" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="526" text-anchor="middle" font-size="20">G6P</text><text x="190.0" y="549" text-anchor="middle" font-size="15">匯集兩條供糖途徑</text><rect x="455" y="500" width="230" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="570.0" y="526" text-anchor="middle" font-size="20">Glucose</text><text x="570.0" y="549" text-anchor="middle" font-size="15">可供血液使用</text><path d="M310 530L450 530" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><text x="380" y="590" text-anchor="middle" font-size="18">G6Pase：內質網系統；水解釋 Pi</text></g></svg>