<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" role="img" aria-labelledby="title"><title id="title">嘌呤在核糖上組環，再由 IMP 分流</title><rect width="760" height="630" fill="#f6faf9"/><g font-family="system-ui,sans-serif" fill="#163e45"><text x="24" y="45" font-size="25" font-weight="650">嘌呤在核糖上組環，再由 IMP 分流</text><rect x="20" y="68" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="69" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="116" font-size="17" font-weight="600">核糖骨架</text><text x="184" y="100" font-size="19" font-weight="600">Ribose-5-P → PRPP</text><text x="184" y="130" font-size="16" font-weight="400">PRPP synthetase 消耗 ATP，提供活化核糖供合成與回收。</text><rect x="20" y="170" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="171" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="218" font-size="17" font-weight="600">承諾步驟</text><text x="184" y="202" font-size="19" font-weight="600">PRPP ＋ glutamine → 5-phosphoribosylamine</text><text x="184" y="232" font-size="16" font-weight="400">Glutamine-PRPP amidotransferase 受嘌呤核苷酸回饋調控。</text><rect x="20" y="272" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="273" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="320" font-size="17" font-weight="600">共同中間物</text><text x="184" y="304" font-size="19" font-weight="600">逐步組環 → IMP</text><text x="184" y="334" font-size="16" font-weight="400">環中碳氮來自 Gly、Gln、Asp、CO₂ 與 formyl-THF。</text><rect x="20" y="374" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="375" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="422" font-size="17" font-weight="600">AMP 分支</text><text x="184" y="406" font-size="19" font-weight="600">IMP ＋ aspartate → adenylosuccinate → AMP</text><text x="184" y="436" font-size="16" font-weight="400">使用 GTP，釋出 fumarate，留下來自 Asp 的氮。</text><rect x="20" y="476" width="720" height="84" rx="9" fill="white" stroke="#b5cfc9"/><rect x="21" y="477" width="145" height="82" rx="8" fill="#dfefe9"/><text x="33" y="524" font-size="17" font-weight="600">GMP 分支</text><text x="184" y="508" font-size="19" font-weight="600">IMP → XMP → GMP</text><text x="184" y="538" font-size="16" font-weight="400">先經 IMP dehydrogenase 氧化，再用 ATP 與 Gln 完成胺化。</text><text x="24" y="616" font-size="15" font-weight="400">回收可直接將 hypoxanthine 或 guanine 接到 PRPP，分別得到 IMP 或 GMP。</text></g></svg>