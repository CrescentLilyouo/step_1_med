<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">ATP與葡萄糖磷酸化耦合</title><desc id="desc">兩個標準反應相加，消去Pi與水，得到glucose加ATP生成G6P加ADP，標準自由能約負16.7 kJ每mol。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="640" height="360" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="320" y="30" text-anchor="middle" font-size="22">化學計量相加，才是同一筆能量帳</text><rect x="30" y="55" width="580" height="64" rx="10" fill="#fff3df" stroke="#8cafa4"/><text x="320.0" y="82" text-anchor="middle" font-size="20">Glucose + Pi → G6P + H₂O</text><text x="320.0" y="105" text-anchor="middle" font-size="15">ΔG°′ = +13.8 kJ/mol</text><text x="320" y="145" text-anchor="middle" font-size="26">＋</text><rect x="30" y="165" width="580" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="320.0" y="192" text-anchor="middle" font-size="20">ATP + H₂O → ADP + Pi</text><text x="320.0" y="215" text-anchor="middle" font-size="15">ΔG°′ = −30.5 kJ/mol</text><path d="M320 235L320 266" stroke="#41636b" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="30" y="275" width="580" height="64" rx="10" fill="#e5f2ed" stroke="#8cafa4"/><text x="320.0" y="302" text-anchor="middle" font-size="20">Glucose + ATP → G6P + ADP</text><text x="320.0" y="325" text-anchor="middle" font-size="15">總 ΔG°′ ≈ −16.7 kJ/mol</text></g></svg>