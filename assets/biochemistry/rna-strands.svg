<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img"><title>同一段基因的三種寫法</title><desc>聚合酶沿中列由左往右讀取，在下列 RNA 的 3′ 端延長。</desc><rect width="760" height="260" rx="12" fill="#f5f9f8"/><g font-family="system-ui,sans-serif" fill="#154940"><text x="20" y="35" font-size="24" font-weight="700">同一段基因的三種寫法</text><rect x="9" width="742" height="41" y="55" rx="5" fill="#d0e6df"/><text x="20" y="81" font-size="17">分子</text><text x="195" y="81" font-size="17">左端</text><text x="377" y="81" font-size="17">由左向右的序列</text><text x="574" y="81" font-size="17">右端</text><rect x="9" width="742" height="41" y="100" rx="5" fill="#ffffff"/><text x="20" y="126" font-size="17">編碼股 DNA</text><text x="195" y="126" font-size="17">5′</text><text x="377" y="126" font-size="17">A T G   G A A</text><text x="574" y="126" font-size="17">3′</text><rect x="9" width="742" height="41" y="145" rx="5" fill="#e9f2ef"/><text x="20" y="171" font-size="17">模板股 DNA</text><text x="195" y="171" font-size="17">3′</text><text x="377" y="171" font-size="17">T A C   C T T</text><text x="574" y="171" font-size="17">5′</text><rect x="9" width="742" height="41" y="190" rx="5" fill="#ffffff"/><text x="20" y="216" font-size="17">新生 RNA</text><text x="195" y="216" font-size="17">5′</text><text x="377" y="216" font-size="17">A U G   G A A</text><text x="574" y="216" font-size="17">3′</text></g></svg>
