<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 790" role="img" aria-labelledby="t d"><title id="t">胺基酸碳骨架的七個代謝入口</title><desc id="d">五個入口可形成糖新生碳來源；acetylCoA及acetoacetate分支不能在人體淨轉為葡萄糖。分類針對碳去向而非能否供能。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="790" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="36" text-anchor="middle" font-size="25">先找入口，再判斷能否淨生糖</text><rect x="225" y="70" width="310" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="99" text-anchor="middle" font-size="20">胺基酸去除／轉移氮</text><text x="380.0" y="124" text-anchor="middle" font-size="16">留下不同的碳骨架</text><path d="M290 145V185H190V215" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M470 145V185H570V215" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="225" width="300" height="70" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="254" text-anchor="middle" font-size="20">Glucogenic 入口</text><text x="190.0" y="279" text-anchor="middle" font-size="16">可以提供糖新生碳</text><rect x="420" y="225" width="300" height="70" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="570.0" y="254" text-anchor="middle" font-size="20">Ketogenic 入口</text><text x="570.0" y="279" text-anchor="middle" font-size="16">不是淨生糖來源</text><path d="M190 300L190 335" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M570 300L570 335" stroke="#41636b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="345" width="300" height="230" rx="12" fill="#edf6f1" stroke="#95b5ab"/><text x="190" y="382" text-anchor="middle" font-size="20">Pyruvate</text><text x="190" y="422" text-anchor="middle" font-size="20">α-Ketoglutarate</text><text x="190" y="462" text-anchor="middle" font-size="20">Succinyl-CoA</text><text x="190" y="502" text-anchor="middle" font-size="20">Fumarate</text><text x="190" y="542" text-anchor="middle" font-size="20">Oxaloacetate</text><rect x="420" y="345" width="300" height="70" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="570.0" y="374" text-anchor="middle" font-size="20">Acetyl-CoA</text><text x="570.0" y="399" text-anchor="middle" font-size="16">可氧化供能；不能淨生糖</text><rect x="420" y="460" width="300" height="70" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="570.0" y="489" text-anchor="middle" font-size="20">Acetoacetate</text><text x="570.0" y="514" text-anchor="middle" font-size="16">或 acetoacetyl-CoA；生酮碳</text><text x="570" y="567" text-anchor="middle" font-size="18">Leucine、lysine：純生酮</text><text x="380" y="635" text-anchor="middle" font-size="21">同一胺基酸可有不同碳片段，分別走入兩側</text><text x="380" y="681" text-anchor="middle" font-size="18">「生酮」不是不能產 ATP；「生糖」不是一定立刻變成 glucose</text><text x="380" y="735" text-anchor="middle" font-size="18">Thr 的分類有教材與物種差異；請配合正文的路徑範圍</text></g></svg>