<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" role="img" aria-labelledby="title desc"><title id="title">肝醣分解與合成相反調控</title><desc id="desc">PKA促進phosphorylase kinase及glycogen phosphorylase的活化；PKA相關磷酸化使glycogen synthase活性下降。PP1去磷酸化則支持相反方向。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41636b"/></marker></defs><rect width="760" height="660" fill="#f8fbfa"/><g font-family="system-ui,sans-serif" fill="#173d46"><text x="380" y="32" text-anchor="middle" font-size="24">先看被調控的是哪個蛋白</text><rect x="155" y="55" width="450" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="81" text-anchor="middle" font-size="20">典型 β 受體／肝臟 glucagon 訊號</text><text x="380.0" y="104" text-anchor="middle" font-size="15">Gs → adenylyl cyclase → cAMP</text><path d="M380 120L380 150" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="155" width="220" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="380.0" y="181" text-anchor="middle" font-size="20">PKA 活化</text><text x="380.0" y="204" text-anchor="middle" font-size="15">磷酸化不同下游蛋白</text><path d="M300 220L190 270" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><path d="M460 220L570 270" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="280" width="280" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="306" text-anchor="middle" font-size="20">Phosphorylase kinase</text><text x="190.0" y="329" text-anchor="middle" font-size="15">活性增加</text><rect x="430" y="280" width="280" height="62" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="570.0" y="306" text-anchor="middle" font-size="20">Glycogen synthase</text><text x="570.0" y="329" text-anchor="middle" font-size="15">磷酸化後活性下降</text><path d="M190 345L190 385" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="390" width="280" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="416" text-anchor="middle" font-size="20">Glycogen phosphorylase</text><text x="190.0" y="439" text-anchor="middle" font-size="15">磷酸化後偏活化</text><path d="M570 345L570 385" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><rect x="430" y="390" width="280" height="62" rx="10" fill="#fff2df" stroke="#95b5ab"/><text x="570.0" y="416" text-anchor="middle" font-size="20">合成下降</text><text x="570.0" y="439" text-anchor="middle" font-size="15">與動員配合</text><path d="M190 455L190 490" fill="none" stroke="#41636b" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="495" width="280" height="62" rx="10" fill="#e5f2ed" stroke="#95b5ab"/><text x="190.0" y="521" text-anchor="middle" font-size="20">肝醣 → G1P</text><text x="190.0" y="544" text-anchor="middle" font-size="15">執行磷酸解</text><text x="570" y="515" text-anchor="middle" font-size="20">蛋白磷酸化</text><text x="570" y="548" text-anchor="middle" font-size="20">≠ 糖鍵的磷酸解</text><text x="380" y="602" text-anchor="middle" font-size="19">PP1 去磷酸化：GP 活性下降，GS 活性上升</text><text x="380" y="635" text-anchor="middle" font-size="16">Ca²⁺、AMP 與器官差異另見正文</text></g></svg>