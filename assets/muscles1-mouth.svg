<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 915" role="img" aria-labelledby="title desc"><title id="title">口周肌：把嘴角與嘴唇方向分開</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="915" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">口周肌：把嘴角與嘴唇方向分開</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 04:30–06:00｜非等比例</text><path d="M380 420 Q460 365 550 412 Q640 365 720 420 Q550 535 380 420Z" fill="#fbd5d1" stroke="#ba6c65" stroke-width="5"/><path d="M380 420 Q550 450 720 420" stroke="#9c5550" stroke-width="3" fill="none"/><path d="M380 420 L160 420" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M390 405 L240 230" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M470 401 L410 210" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M575 410 L610 220" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M390 440 L235 610" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M500 466 L470 630" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M655 442 L820 610" stroke="#158875" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="40" y="397" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">笑肌：嘴角向外</text><text x="60" y="196" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">顴大肌：嘴角外上提</text><text x="380" y="165" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">提口角肌</text><text x="650" y="200" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">提上唇肌</text><text x="60" y="670" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">降口角肌</text><text x="430" y="688" font-size="25" fill="#203e48" text-anchor="start" font-weight="400">降下唇肌</text><text x="740" y="667" font-size="24" fill="#203e48" text-anchor="start" font-weight="400">闊頸肌：向下牽拉</text><rect x="55" y="735" width="990" height="96" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="772" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">口輪匝肌：閉唇、噘唇；頰肌：壓頰、協助吹氣</text><text x="550.0" y="805" font-size="20" fill="#203e48" text-anchor="middle" font-weight="400">頦肌可使下唇突出；箭頭是動作概念，不是各肌實際纖維路徑</text><text x="35" y="873" font-size="21" fill="#203e48" text-anchor="start" font-weight="400">原圖約 04:30–06:00；詳表區分嘴角、上唇、下唇與下顎。</text></g></svg>