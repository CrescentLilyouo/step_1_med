<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 930" role="img" aria-labelledby="title desc"><title id="title">頸前層級：下顎—舌骨—甲狀軟骨—胸骨</title><desc id="desc">依影片板書構想重繪，另以教材核對；不是逐筆描摹、實際解剖照片或等比例圖。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#158875" fill="none"/></marker></defs><rect width="1100" height="930" rx="18" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="35" y="55" font-size="32" fill="#203e48" text-anchor="start" font-weight="700">頸前層級：下顎—舌骨—甲狀軟骨—胸骨</text><text x="35" y="93" font-size="20" fill="#657780" text-anchor="start" font-weight="400">板書重繪＋教材核對｜回看 62:00–72:00、97:00–103:00｜非等比例</text><rect x="390" y="155" width="320" height="70" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="192" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">顱骨／下顎</text><rect x="390" y="375" width="320" height="70" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="412" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">舌骨</text><rect x="390" y="560" width="320" height="70" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="597" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">甲狀軟骨</text><rect x="390" y="755" width="320" height="70" rx="12" fill="#e7f3ef" stroke="#adcac3"/><text x="550.0" y="792" font-size="25" fill="#203e48" text-anchor="middle" font-weight="600">胸骨／肩胛骨</text><path d="M390 190 L390 375" stroke="#158875" stroke-width="9" fill="none"/><path d="M710 190 L710 375" stroke="#158875" stroke-width="9" fill="none"/><path d="M390 445 L390 755" stroke="#158875" stroke-width="9" fill="none"/><path d="M710 445 L710 755" stroke="#158875" stroke-width="9" fill="none"/><path d="M550 630 L550 755" stroke="#158875" stroke-width="9" fill="none"/><path d="M550 445 L550 560" stroke="#158875" stroke-width="9" fill="none"/><text x="45" y="282" font-size="28" fill="#203e48" text-anchor="star