name: Publish study site with original explanation pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: study-site-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .ym-pdf-cache
            explanations/pages
          key: ym-pages-v1-${{ hashFiles('explanations/index.json', 'scripts/build_ym_pages.py') }}
      - run: python -m pip install PyMuPDF==1.26.5 Pillow==11.3.0
      - run: python scripts/build_ym_pages.py
      - run: node scripts/test_quiz.cjs && node scripts/test_explanations.cjs
      - name: Prepare public website
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.ym-pdf-cache' --exclude='scripts' --exclude='_site' --exclude='explanations/pdfs' ./ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
