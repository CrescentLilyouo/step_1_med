const subjects=[['anatomy','解剖學','Anatomy'],['histology','組織學','Histology'],['embryology','胚胎及發育生物學','Embryology & Developmental Biology'],['physiology','生理學','Physiology'],['biochemistry','生物化學','Biochemistry'],['pharmacology','藥理學','Pharmacology'],['pathology','病理學','Pathology'],['microbiology','微生物學','Microbiology'],['parasitology','寄生蟲學','Parasitology'],['immunology','免疫學','Immunology'],['public-health','公共衛生學','Public Health']];
const groups=[['醫學（一）','5 個科目',[subjects[4],subjects[0],subjects[2],subjects[1],subjects[3]]],['醫學（二）','6 個科目',[subjects[7],subjects[9],subjects[8],subjects[5],subjects[6],subjects[10]]]];

function renderBase(){const id=location.hash.replace('#/subject/','');const subject=subjects.find(s=>s[0]===id);const group=subject?groups.find(g=>g[2].some(s=>s[0]===id)):null;document.querySelectorAll('.nav-subject').forEach(a=>{const active=a.dataset.id===id;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});const home=document.getElementById('home-link');home.classList.toggle('active',!subject);if(!subject)home.setAttribute('aria-current','page');else home.removeAttribute('aria-current');document.getElementById('top-title').textContent=subject?`${group[0]} / ${subject[1]}`:'科目總覽';document.title=subject?`${subject[1]}｜一階國考`:'一階國考｜科目總覽';if(subject){content.innerHTML=`<nav class="breadcrumb" aria-label="麵包屑"><a href="#/">科目總覽</a><span aria-hidden="true">/</span><a href="#/${group===groups[0]?'medicine-one':'medicine-two'}">${group[0]}</a><span aria-hidden="true">/</span><span>${subject[1]}</span></nav><div class="detail-heading"><p class="eyebrow">${group[0]}</p><h1 tabindex="-1">${subject[1]}</h1><p class="intro">${subject[2]}</p></div><div class="empty-panel"><div class="empty-symbol" aria-hidden="true">Ⅰ</div><h2>尚未加入教材</h2><p>此科目目前保留空白，之後再加入章節與複習內容。</p><a href="#/" class="back">返回科目總覽</a></div>`}else{content.innerHTML=`<div class="page-head"><div><p class="eyebrow">SUBJECT DIRECTORY</p><h1 tabindex="-1">醫學（一）・醫學（二）</h1><p class="intro">依一階國考分組，選擇科目開始複習。</p></div><div class="count"><b>2</b>大分類</div></div>`+groups.map(g=>`<section id="${g===groups[0]?'medicine-one':'medicine-two'}" aria-label="${g[0]}"><div class="section-title"><h2>${g[0]}</h2><span>${g[1]}</span></div><div class="grid">`+g[2].map(s=>`<a class="card" href="#/subject/${s[0]}"><div class="card-top"><span class="number">${String(subjects.indexOf(s)+1).padStart(2,'0')}</span><span class="empty-tag">${s[0]==='anatomy'?'2 個章節':'尚無教材'}</span></div><h3>${s[1]}</h3><span class="english" lang="en">${s[2]}</span></a>`).join('')+'</div></section>').join('')+`<p class="home-note">解剖學已加入概論與骨骼（1）、骨骼（2）；微生物與免疫學分開整理，其餘科目待加入教材。 <a href="https://wwwq.moex.gov.tw/exam/wFrmExamQandASearch.aspx?e=115020&amp;y=2026" target="_blank" rel="noopener noreferrer">考選部科目分組</a></p>`}const anchor=document.getElementById(location.hash.replace('#/',''));if(anchor)anchor.scrollIntoView({block:'start'});else window.scrollTo(0,0)}function render(){const parts=location.hash.replace(/^#\//,'').split('/');if(parts[0]==='subject'&&parts[1]==='anatomy')renderAnatomy(parts);else renderBase()}window.addEventListener('hashchange',()=>{render();content.querySelector('h1').focus({preventScroll:true})});render();
